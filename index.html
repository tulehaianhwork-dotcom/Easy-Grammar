n, nguyên nhân, mục đích, kết quả và nhượng bộ.", "blocks": [{"t": "p", "text": "Mệnh đề trạng ngữ trả lời các câu hỏi KHI NÀO, VÌ SAO, ĐỂ LÀM GÌ, MẶC DÙ GÌ. Đây chính là các câu có when, because, so that, although."}, {"t": "h", "lv": 2, "text": "Bảng theo nhóm nghĩa"}, {"t": "tbl", "rows": [["Nhóm", "Liên từ", "Ví dụ"], ["Thời gian", "when, while, before, after, as soon as, until, since", "Call me when you arrive."], ["Nguyên nhân", "because, since, as", "She stayed home because she was sick."], ["Mục đích", "so that, in order that", "He studies hard so that he can pass."], ["Kết quả", "so + adj + that, such + N + that", "He was so tired that he fell asleep."], ["Nhượng bộ", "although, though, even though", "Although she was ill, she went to school."], ["Điều kiện", "if, unless, as long as", "I will go out unless it rains."], ["Cách thức", "as if, as though", "He acts as if he knew everything."]]}, {"t": "h", "lv": 2, "text": "So + adj + that và such + N + that"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "so + tính từ hoặc trạng từ + that: He was so tired that he fell asleep.", "lv": 0}, {"t": "p", "text": "such + (a/an) + tính từ + danh từ + that: It was such a hot day that we stayed inside.", "lv": 0}, {"t": "p", "text": "so many hoặc so much + danh từ + that: There were so many people that we could not move.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Mệnh đề thời gian và điều kiện KHÔNG dùng will: I will call you as soon as I get home.", "lv": 0}, {"t": "p", "text": "because đi với MỆNH ĐỀ, because of đi với DANH TỪ. Tương tự although với despite và in spite of.", "lv": 0}]}], "quiz": [{"t": "I will call you as soon as I ___ home.", "o": ["get", "will get", "got", "am getting"], "a": 0, "e": "Mệnh đề thời gian dùng hiện tại đơn."}, {"t": "He was so tired ___ he fell asleep.", "o": ["that", "which", "what", "who"], "a": 0, "e": "Cấu trúc so + tính từ + that."}, {"t": "She stayed at home ___ she was sick.", "o": ["because", "although", "unless", "until"], "a": 0, "e": "Bị ốm là nguyên nhân."}, {"t": "I will go out ___ it rains.", "o": ["unless", "although", "because", "so that"], "a": 0, "e": "Unless nghĩa là trừ khi."}, {"t": "He studied hard ___ he could pass the exam.", "o": ["so that", "although", "unless", "until"], "a": 0, "e": "So that chỉ mục đích."}, {"t": "___ she was tired, she finished the work.", "o": ["Although", "Because", "If", "As soon as"], "a": 0, "e": "Mệt nhưng vẫn làm xong là nhượng bộ."}, {"t": "It was ___ a hot day that we stayed inside.", "o": ["so", "such", "very", "too"], "a": 1, "e": "Trước cụm danh từ a hot day dùng such."}, {"t": "She was absent ___ her illness.", "o": ["because", "because of", "although", "so"], "a": 1, "e": "Her illness là danh từ nên dùng because of."}, {"t": "There were ___ many people that we could not move.", "o": ["so", "such", "very", "too"], "a": 0, "e": "Trước many dùng so."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">In spite of</span> <span class=\"seg\" data-l=\"B\">he was tired,</span> <span class=\"seg\" data-l=\"C\">he</span> <span class=\"seg\" data-l=\"D\">kept working</span>.", "o": ["In spite of", "he was tired,", "he", "kept working"], "a": 0, "e": "In spite of đi với danh từ, trước mệnh đề phải dùng Although."}]}, {"id": "u14", "title": "Mệnh đề danh từ", "desc": "Mệnh đề đóng vai trò như một danh từ, và quy tắc không đảo ngữ.", "blocks": [{"t": "p", "text": "Mệnh đề danh từ đứng ở đúng vị trí của một danh từ: làm chủ ngữ, tân ngữ hoặc bổ ngữ. Mẹo nhận biết là thay được bằng it hoặc something."}, {"t": "h", "lv": 2, "text": "Các từ mở đầu"}, {"t": "tbl", "rows": [["Từ", "Nghĩa", "Ví dụ"], ["that", "rằng, việc", "I know that he is honest."], ["what", "điều mà", "What she said is important."], ["whether / if", "liệu có", "I wonder whether he will come."], ["who, whom, whose", "ai", "I don't know who called."], ["where, when, why, how", "nơi, lúc, vì sao, cách", "I don't know where she lives."]]}, {"t": "h", "lv": 2, "text": "Quy tắc vàng — KHÔNG đảo ngữ"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Dù mở đầu bằng từ để hỏi, mệnh đề danh từ vẫn giữ trật tự S + V như câu kể.", "lv": 0}, {"t": "p", "text": "Sai: I don't know what is he doing.", "lv": 0}, {"t": "p", "text": "Đúng: I don't know what he is doing.", "lv": 0}, {"t": "p", "text": "Sai: Do you know what time is it?", "lv": 0}, {"t": "p", "text": "Đúng: Do you know what time it is?", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "What she said is important. (Điều cô ấy nói rất quan trọng.) - làm chủ ngữ", "lv": 0}, {"t": "p", "text": "He told us that he had lost his keys. (Anh ấy nói với chúng tôi rằng anh ấy đã mất chìa khoá.) - làm tân ngữ", "lv": 0}, {"t": "p", "text": "The problem is that we have no money. (Vấn đề là chúng tôi không có tiền.) - làm bổ ngữ", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Khi mệnh đề danh từ làm chủ ngữ thì động từ chính chia SỐ ÍT: What she said is important.", "lv": 0}, {"t": "p", "text": "Whether dùng được ở mọi vị trí, còn if chỉ dùng sau động từ: I wonder if he will come. Nhưng chủ ngữ phải là Whether he will come is unclear.", "lv": 0}]}], "quiz": [{"t": "I don't know where ___ .", "o": ["does he live", "he lives", "lives he", "is he living"], "a": 1, "e": "Mệnh đề danh từ giữ trật tự S + V."}, {"t": "She asked me ___ I could help her.", "o": ["whether", "what", "who", "where"], "a": 0, "e": "Câu hỏi dạng Yes/No nên dùng whether hoặc if."}, {"t": "___ she said is important.", "o": ["What", "Where", "Whether", "That"], "a": 0, "e": "What nghĩa là điều mà, mở đầu mệnh đề làm chủ ngữ."}, {"t": "Mẹo nhận biết mệnh đề danh từ là gì?", "o": ["Thử thay bằng it hoặc something", "Thêm dấu phẩy trước mệnh đề", "Đổi động từ sang quá khứ", "Bỏ chủ ngữ"], "a": 0, "e": "Thay được bằng it hoặc something thì đó là mệnh đề danh từ."}, {"t": "Do you know what time ___ ?", "o": ["it is", "is it", "does it", "it be"], "a": 0, "e": "Mệnh đề danh từ không đảo ngữ."}, {"t": "He told us ___ he had lost his keys.", "o": ["that", "what", "whom", "whose"], "a": 0, "e": "That mở đầu mệnh đề danh từ làm tân ngữ."}, {"t": "___ she will come is not certain.", "o": ["Whether", "If", "Which", "Whose"], "a": 0, "e": "Làm chủ ngữ thì dùng whether, không dùng if."}, {"t": "What she said ___ very important.", "o": ["is", "are", "were", "have been"], "a": 0, "e": "Mệnh đề danh từ làm chủ ngữ thì động từ số ít."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">I</span> <span class=\"seg\" data-l=\"B\">don't know</span> <span class=\"seg\" data-l=\"C\">what is he</span> <span class=\"seg\" data-l=\"D\">doing</span>.", "o": ["I", "don't know", "what is he", "doing"], "a": 2, "e": "Mệnh đề danh từ không đảo: what he is doing."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">We</span> <span class=\"seg\" data-l=\"B\">wonder</span> <span class=\"seg\" data-l=\"C\">where is the manager</span> <span class=\"seg\" data-l=\"D\">going</span>.", "o": ["We", "wonder", "where is the manager", "going"], "a": 2, "e": "Mệnh đề danh từ không đảo: where the manager is going."}]}, {"id": "c1", "title": "So sánh hơn, so sánh nhất và so sánh kép", "desc": "Quy tắc tính từ ngắn và dài, các dạng bất quy tắc và cấu trúc so sánh đặc biệt.", "blocks": [{"t": "p", "text": "Chọn đúng dạng so sánh chỉ cần đếm âm tiết của tính từ."}, {"t": "h", "lv": 2, "text": "Quy tắc theo độ dài tính từ"}, {"t": "tbl", "rows": [["Loại tính từ", "So sánh hơn", "So sánh nhất", "Ví dụ"], ["Ngắn (1 âm tiết)", "adj + er + than", "the + adj + est", "tall - taller - the tallest"], ["Tận cùng -y", "đổi y thành ier", "the + iest", "happy - happier - the happiest"], ["Dài (2 âm tiết trở lên)", "more + adj + than", "the most + adj", "beautiful - more beautiful - the most beautiful"]]}, {"t": "h", "lv": 2, "text": "Dạng bất quy tắc bắt buộc thuộc"}, {"t": "tbl", "rows": [["Gốc", "So sánh hơn", "So sánh nhất"], ["good / well", "better", "the best"], ["bad / badly", "worse", "the worst"], ["many / much", "more", "the most"], ["little", "less", "the least"], ["far", "farther / further", "the farthest / the furthest"]]}, {"t": "h", "lv": 2, "text": "Các cấu trúc so sánh hay ra thi"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "So sánh bằng: as + adj + as. She is as tall as her brother.", "lv": 0}, {"t": "p", "text": "So sánh không bằng: not as + adj + as. He is not as tall as me.", "lv": 0}, {"t": "p", "text": "So sánh kém: less + adj + than. This book is less interesting than that one.", "lv": 0}, {"t": "p", "text": "So sánh kép (càng càng): The + so sánh hơn, the + so sánh hơn. The more you study, the better you get.", "lv": 0}, {"t": "p", "text": "Càng ngày càng: so sánh hơn + and + so sánh hơn. It is getting colder and colder.", "lv": 0}, {"t": "p", "text": "Gấp bội: twice as + adj + as, three times as + adj + as.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "So sánh nhất luôn đi với THE và thường có in, of: the tallest student in my class.", "lv": 0}, {"t": "p", "text": "Dùng much, far, a lot để nhấn mạnh so sánh hơn: much better, far more important. KHÔNG dùng very trước so sánh hơn.", "lv": 0}]}], "quiz": [{"t": "She is ___ girl in her class.", "o": ["the tallest", "taller", "more tall", "the more tall"], "a": 0, "e": "So sánh trong một nhóm nên dùng so sánh nhất."}, {"t": "This is ___ book I have ever read.", "o": ["the most interesting", "more interesting", "most interesting", "the more interesting"], "a": 0, "e": "So sánh nhất cần the."}, {"t": "My result is ___ than yours.", "o": ["gooder", "better", "more good", "best"], "a": 1, "e": "Good là bất quy tắc, so sánh hơn là better."}, {"t": "He is not ___ tall ___ his brother.", "o": ["so / than", "as / as", "more / than", "as / than"], "a": 1, "e": "So sánh bằng dùng as + adj + as."}, {"t": "___ you practise, ___ you become.", "o": ["The more / the better", "More / better", "The most / the best", "More the / better the"], "a": 0, "e": "So sánh kép dùng The + so sánh hơn, the + so sánh hơn."}, {"t": "The weather is getting ___ .", "o": ["hot and hot", "hotter and hotter", "more hot and hot", "the hottest"], "a": 1, "e": "Càng ngày càng dùng so sánh hơn + and + so sánh hơn."}, {"t": "This film is ___ interesting than that one.", "o": ["less", "least", "little", "fewer"], "a": 0, "e": "So sánh kém dùng less + adj + than."}, {"t": "Her score is ___ than mine.", "o": ["worse", "worst", "more bad", "badder"], "a": 0, "e": "Bad là bất quy tắc, so sánh hơn là worse."}, {"t": "This house is ___ expensive than that one.", "o": ["very", "much", "so", "too"], "a": 1, "e": "Much dùng để nhấn mạnh so sánh hơn, không dùng very."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">is the</span> <span class=\"seg\" data-l=\"C\">most tall</span> <span class=\"seg\" data-l=\"D\">student in the class</span>.", "o": ["She", "is the", "most tall", "student in the class"], "a": 2, "e": "Tall là tính từ ngắn nên so sánh nhất là the tallest."}]}, {"id": "c2", "title": "Gerund và Infinitive: V-ing hay to V", "desc": "Động từ nào theo sau là V-ing, động từ nào theo sau là to V, và các trường hợp đổi nghĩa.", "blocks": [{"t": "p", "text": "Đây là dạng ra thi gần như chắc chắn. Cách duy nhất là thuộc danh sách, nhưng có thể nhóm lại cho dễ nhớ."}, {"t": "h", "lv": 2, "text": "Động từ theo sau là V-ing"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Nhóm thích và ghét: enjoy, like, love, hate, mind, prefer", "lv": 0}, {"t": "p", "text": "Nhóm tránh và dừng: avoid, finish, quit, give up, stop (ngừng hẳn)", "lv": 0}, {"t": "p", "text": "Nhóm gợi ý và cân nhắc: suggest, consider, imagine, deny, admit", "lv": 0}, {"t": "p", "text": "Nhóm khác: practise, risk, keep, miss", "lv": 0}, {"t": "p", "text": "LUÔN sau GIỚI TỪ: He is good at playing chess. She is interested in reading.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Động từ theo sau là to V"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Nhóm muốn và quyết định: want, decide, hope, plan, expect, intend", "lv": 0}, {"t": "p", "text": "Nhóm đồng ý và từ chối: agree, refuse, promise, offer", "lv": 0}, {"t": "p", "text": "Nhóm cố gắng: try, manage, fail, learn, afford, seem", "lv": 0}, {"t": "p", "text": "Nhóm có tân ngữ ở giữa: tell, ask, advise, allow, want + O + to V. He told me to wait.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Động từ đổi NGHĨA khi đổi dạng"}, {"t": "tbl", "rows": [["Động từ", "+ V-ing", "+ to V"], ["stop", "ngừng hẳn việc đó: stop smoking", "dừng lại để làm: stop to smoke"], ["remember", "nhớ đã làm rồi: remember locking", "nhớ phải làm: remember to lock"], ["forget", "quên đã làm: forget meeting", "quên phải làm: forget to call"], ["try", "thử làm xem sao: try eating", "cố gắng làm: try to eat"], ["regret", "hối tiếc đã làm: regret telling", "tiếc phải báo: regret to tell"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Sau động từ khuyết thiếu (can, must, will, should) và sau make, let, help thì dùng NGUYÊN THỂ KHÔNG to: She must go. He made me cry.", "lv": 0}, {"t": "p", "text": "Sau would like, would love thì dùng to V: I would like to book a table.", "lv": 0}]}], "quiz": [{"t": "He decided ___ a new job.", "o": ["looking for", "to look for", "look for", "looked for"], "a": 1, "e": "Sau decide dùng to V."}, {"t": "They avoided ___ the mistake again.", "o": ["to make", "making", "make", "made"], "a": 1, "e": "Sau avoid dùng V-ing."}, {"t": "She finished ___ her homework at nine.", "o": ["to do", "doing", "do", "did"], "a": 1, "e": "Sau finish dùng V-ing."}, {"t": "He is good at ___ chess.", "o": ["play", "to play", "playing", "played"], "a": 2, "e": "Sau giới từ at dùng V-ing."}, {"t": "They agreed ___ the meeting until next week.", "o": ["postpone", "to postpone", "postponing", "postponed"], "a": 1, "e": "Sau agree dùng to V."}, {"t": "Remember ___ the door before you leave.", "o": ["locking", "to lock", "lock", "locked"], "a": 1, "e": "Nhớ phải làm việc gì đó thì dùng to V."}, {"t": "He stopped ___ because it was bad for his health.", "o": ["smoking", "to smoke", "smoke", "smoked"], "a": 0, "e": "Ngừng hẳn việc đó thì dùng V-ing."}, {"t": "My mother made me ___ the dishes.", "o": ["to wash", "washing", "wash", "washed"], "a": 2, "e": "Sau make dùng nguyên thể không to."}, {"t": "I would like ___ a table for two.", "o": ["book", "booking", "to book", "booked"], "a": 2, "e": "Sau would like dùng to V."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">suggested</span> <span class=\"seg\" data-l=\"C\">to go</span> <span class=\"seg\" data-l=\"D\">to the cinema</span>.", "o": ["She", "suggested", "to go", "to the cinema"], "a": 2, "e": "Sau suggest dùng V-ing: going."}]}, {"id": "c3", "title": "Câu hỏi đuôi", "desc": "Quy tắc ngược dấu, chọn trợ động từ và các trường hợp đặc biệt.", "blocks": [{"t": "p", "text": "Câu hỏi đuôi là phần ngắn gắn ở cuối câu để hỏi lại. Chỉ cần ba bước."}, {"t": "h", "lv": 2, "text": "Ba bước làm câu hỏi đuôi"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Bước 1: Câu chính KHẲNG ĐỊNH thì đuôi PHỦ ĐỊNH, và ngược lại.", "lv": 0}, {"t": "p", "text": "Bước 2: Lấy trợ động từ của câu chính. Nếu không có thì mượn do, does, did.", "lv": 0}, {"t": "p", "text": "Bước 3: Chủ ngữ trong đuôi luôn là ĐẠI TỪ (he, she, it, they).", "lv": 0}]}, {"t": "tbl", "rows": [["Câu chính", "Câu hỏi đuôi", "Ghi chú"], ["She is a teacher,", "isn't she?", "có be thì lấy be"], ["They don't like it,", "do they?", "phủ định thì đuôi khẳng định"], ["He went home,", "didn't he?", "quá khứ đơn mượn did"], ["You have finished,", "haven't you?", "có have thì lấy have"], ["She can swim,", "can't she?", "có modal thì lấy modal"]]}, {"t": "h", "lv": 2, "text": "Các trường hợp đặc biệt bắt buộc nhớ"}, {"t": "tbl", "rows": [["Câu chính", "Đuôi đúng"], ["I am right,", "aren't I?"], ["Let's go,", "shall we?"], ["Open the door,", "will you?"], ["There is a book,", "isn't there?"], ["Everyone likes it,", "don't they?"], ["Nobody came,", "did they?"], ["He never comes,", "does he?"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Các từ mang nghĩa phủ định như never, hardly, seldom, no, nothing, nobody làm câu chính thành PHỦ ĐỊNH, nên đuôi phải KHẲNG ĐỊNH.", "lv": 0}, {"t": "p", "text": "Everyone, someone, nobody dùng đại từ they trong đuôi.", "lv": 0}]}], "quiz": [{"t": "She is a doctor, ___ ?", "o": ["isn't she", "is she", "doesn't she", "isn't her"], "a": 0, "e": "Câu khẳng định thì đuôi phủ định, lấy be."}, {"t": "They don't live here, ___ ?", "o": ["don't they", "do they", "are they", "didn't they"], "a": 1, "e": "Câu phủ định thì đuôi khẳng định."}, {"t": "He went home early, ___ ?", "o": ["didn't he", "doesn't he", "wasn't he", "hadn't he"], "a": 0, "e": "Quá khứ đơn mượn did."}, {"t": "I am late, ___ ?", "o": ["amn't I", "aren't I", "am I", "isn't I"], "a": 1, "e": "Trường hợp đặc biệt dùng aren't I."}, {"t": "Let's go out, ___ ?", "o": ["shall we", "will we", "do we", "don't we"], "a": 0, "e": "Sau Let's luôn dùng shall we."}, {"t": "There is a problem, ___ ?", "o": ["isn't there", "isn't it", "is there", "aren't there"], "a": 0, "e": "Với There is thì đuôi dùng isn't there."}, {"t": "He never calls, ___ ?", "o": ["does he", "doesn't he", "did he", "is he"], "a": 0, "e": "Never mang nghĩa phủ định nên đuôi khẳng định."}, {"t": "Everyone enjoyed the party, ___ ?", "o": ["didn't they", "didn't he", "did they", "wasn't everyone"], "a": 0, "e": "Everyone dùng đại từ they."}, {"t": "You have finished your work, ___ ?", "o": ["haven't you", "didn't you", "don't you", "aren't you"], "a": 0, "e": "Có have thì đuôi lấy have."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">Nobody</span> <span class=\"seg\" data-l=\"B\">came</span> <span class=\"seg\" data-l=\"C\">to the party,</span> <span class=\"seg\" data-l=\"D\">didn't they</span>?", "o": ["Nobody", "came", "to the party,", "didn't they"], "a": 3, "e": "Nobody mang nghĩa phủ định nên đuôi phải khẳng định: did they."}]}, {"id": "u27", "title": "Câu điều kiện loại 0, 1, 2", "desc": "Ba loại điều kiện cơ bản và cách phân biệt theo mức độ có thật.", "blocks": [{"t": "p", "text": "Chọn loại điều kiện theo một câu hỏi: việc đó CÓ THẬT, CÓ THỂ xảy ra, hay KHÔNG CÓ THẬT ở hiện tại?"}, {"t": "h", "lv": 2, "text": "Bảng ba loại"}, {"t": "tbl", "rows": [["Loại", "Mệnh đề If", "Mệnh đề chính", "Dùng khi"], ["Loại 0", "hiện tại đơn", "hiện tại đơn", "Sự thật, quy luật tự nhiên"], ["Loại 1", "hiện tại đơn", "will + V", "Có thể xảy ra trong tương lai"], ["Loại 2", "quá khứ đơn", "would + V", "Không có thật ở hiện tại"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "Loại 0: If you heat ice, it melts. (Nếu bạn đun đá, nó tan.)", "lv": 0}, {"t": "p", "text": "Loại 1: If it rains tomorrow, we will stay home. (Nếu mai trời mưa, chúng tôi sẽ ở nhà.)", "lv": 0}, {"t": "p", "text": "Loại 2: If I were rich, I would travel the world. (Nếu tôi giàu, tôi sẽ đi khắp thế giới. Thực tế tôi không giàu.)", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Các điểm bị hỏi nhiều"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Mệnh đề If TUYỆT ĐỐI không dùng will. Sai: If it will rain.", "lv": 0}, {"t": "p", "text": "Loại 2 dùng WERE cho mọi chủ ngữ: If I were you, I would study harder.", "lv": 0}, {"t": "p", "text": "Unless = If not: Unless you hurry, you will be late. = If you do not hurry, you will be late.", "lv": 0}, {"t": "p", "text": "Có thể dùng can, may, might thay will trong loại 1: If you study, you can pass.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "If I were you, I would... là mẫu câu khuyên bảo rất hay xuất hiện trong đề.", "lv": 0}, {"t": "p", "text": "Mệnh đề If đứng trước thì có dấu phẩy, đứng sau thì không.", "lv": 0}]}], "quiz": [{"t": "If you mix red and blue, you ___ purple.", "o": ["get", "will got", "would get", "getting"], "a": 0, "e": "Sự thật hiển nhiên nên dùng loại 0."}, {"t": "If it ___ sunny tomorrow, we will go to the beach.", "o": ["is", "will be", "was", "would be"], "a": 0, "e": "Mệnh đề If của loại 1 dùng hiện tại đơn."}, {"t": "If I ___ rich, I would travel the world.", "o": ["am", "were", "will be", "have been"], "a": 1, "e": "Loại 2 dùng were cho mọi chủ ngữ."}, {"t": "If she ___ more time, she would travel more.", "o": ["has", "had", "will have", "would have"], "a": 1, "e": "Loại 2 dùng quá khứ đơn ở mệnh đề If."}, {"t": "Unless tương đương với cấu trúc nào?", "o": ["if ... not", "if ... will", "although", "because"], "a": 0, "e": "Unless nghĩa là nếu không."}, {"t": "Chọn câu ĐÚNG.", "o": ["If it will rain, we will stay inside.", "If it rains, we will stay inside.", "If it rain, we will stay inside.", "If it rained, we will stay inside."], "a": 1, "e": "Loại 1: If + hiện tại đơn, will + V."}, {"t": "If I ___ you, I would study harder.", "o": ["were", "am", "will be", "have been"], "a": 0, "e": "Mẫu câu khuyên bảo dùng If I were you."}, {"t": "If you heat ice, it ___ .", "o": ["melts", "will melted", "would melt", "melted"], "a": 0, "e": "Quy luật tự nhiên nên dùng loại 0."}, {"t": "If she leaves early, she ___ catch the bus.", "o": ["will", "would", "was", "had"], "a": 0, "e": "Loại 1 dùng will ở mệnh đề chính."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">If it</span> <span class=\"seg\" data-l=\"B\">will rain</span> <span class=\"seg\" data-l=\"C\">tomorrow,</span> <span class=\"seg\" data-l=\"D\">we will cancel the trip</span>.", "o": ["If it", "will rain", "tomorrow,", "we will cancel the trip"], "a": 1, "e": "Mệnh đề If dùng hiện tại đơn: If it rains."}]}, {"id": "u28", "title": "Câu điều kiện loại 3, hỗn hợp và đảo ngữ", "desc": "Điều kiện trái với quá khứ, câu hỗn hợp và ba dạng đảo ngữ.", "blocks": [{"t": "p", "text": "Loại 3 nói về điều đã KHÔNG xảy ra trong quá khứ và kết quả cũng đã không xảy ra."}, {"t": "h", "lv": 2, "text": "Loại 3 và loại hỗn hợp"}, {"t": "tbl", "rows": [["Loại", "Mệnh đề If", "Mệnh đề chính", "Ví dụ"], ["Loại 3", "had + V3", "would have + V3", "If I had studied, I would have passed."], ["Hỗn hợp 1", "had + V3 (quá khứ)", "would + V (hiện tại)", "If I had studied medicine, I would be a doctor now."], ["Hỗn hợp 2", "quá khứ đơn (hiện tại)", "would have + V3 (quá khứ)", "If I were rich, I would have bought that car."]]}, {"t": "h", "lv": 2, "text": "Ba dạng đảo ngữ bắt buộc nhớ"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Loại 1: Should + S + V. Should you need help, please call me.", "lv": 0}, {"t": "p", "text": "Loại 2: Were + S + to V hoặc Were + S + N. Were I you, I would accept.", "lv": 0}, {"t": "p", "text": "Loại 3: Had + S + V3. Had I known, I would have told you.", "lv": 0}, {"t": "p", "text": "Khi đảo ngữ thì BỎ if.", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "If we had trained harder, we would have won the match. (Nếu chúng tôi tập luyện chăm hơn, chúng tôi đã thắng trận đấu rồi.)", "lv": 0}, {"t": "p", "text": "If she hadn't been ill, she would have taken the exam.", "lv": 0}, {"t": "p", "text": "Had I known about the problem, I would have helped.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Mệnh đề If của loại 3 KHÔNG dùng would have. Sai: If she would have studied.", "lv": 0}, {"t": "p", "text": "Dấu hiệu nhận ra loại hỗn hợp là từ now, today xuất hiện ở mệnh đề chính.", "lv": 0}]}], "quiz": [{"t": "If we had trained harder, we ___ the match.", "o": ["would have won", "would win", "will win", "won"], "a": 0, "e": "Loại 3 dùng would have + V3."}, {"t": "If I had studied medicine, I ___ a doctor now.", "o": ["would be", "would have been", "will be", "was"], "a": 0, "e": "Có now nên kết quả ở hiện tại, dùng would + V."}, {"t": "___ you need help, please call me.", "o": ["Should", "Had", "Were", "Did"], "a": 0, "e": "Đảo ngữ loại 1 dùng Should + S + V."}, {"t": "___ I known about the problem, I would have helped.", "o": ["Had", "Should", "Were", "Did"], "a": 0, "e": "Đảo ngữ loại 3 dùng Had + S + V3."}, {"t": "If I had known, I ___ you.", "o": ["would have told", "would tell", "will tell", "told"], "a": 0, "e": "Loại 3 dùng would have + V3."}, {"t": "If she hadn't been ill, she ___ the exam.", "o": ["would have taken", "would take", "will take", "took"], "a": 0, "e": "Trái với quá khứ nên dùng would have + V3."}, {"t": "Should you ___ any questions, please ask.", "o": ["have", "had", "has", "having"], "a": 0, "e": "Sau Should + S dùng động từ nguyên thể."}, {"t": "___ I you, I would accept the offer.", "o": ["Were", "Had", "Should", "Did"], "a": 0, "e": "Đảo ngữ loại 2 dùng Were + S."}, {"t": "Chọn câu ĐÚNG.", "o": ["If she would have studied, she would have passed.", "If she had studied, she would have passed.", "If she has studied, she would have passed.", "If she studied, she would have pass."], "a": 1, "e": "Mệnh đề If của loại 3 dùng had + V3."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">If she</span> <span class=\"seg\" data-l=\"B\">would have studied</span> <span class=\"seg\" data-l=\"C\">harder,</span> <span class=\"seg\" data-l=\"D\">she would have passed</span>.", "o": ["If she", "would have studied", "harder,", "she would have passed"], "a": 1, "e": "Mệnh đề If của loại 3 dùng had studied."}]}, {"id": "c4", "title": "Câu ước: wish và if only", "desc": "Ba loại câu ước ứng với hiện tại, quá khứ và tương lai.", "blocks": [{"t": "p", "text": "Câu ước diễn tả điều TRÁI với thực tế. Quy tắc chung là lùi thì xuống một bậc so với thực tế."}, {"t": "h", "lv": 2, "text": "Ba loại câu ước"}, {"t": "tbl", "rows": [["Ước về", "Công thức", "Ví dụ", "Thực tế"], ["Hiện tại", "wish + S + quá khứ đơn", "I wish I had a car.", "Tôi không có ô tô"], ["Quá khứ", "wish + S + had + V3", "I wish I had studied harder.", "Tôi đã không học chăm"], ["Tương lai", "wish + S + would + V", "I wish it would stop raining.", "Mong trời ngừng mưa"]]}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "If only có nghĩa và công thức giống hệt wish, chỉ nhấn mạnh hơn: If only I had a car.", "lv": 0}, {"t": "p", "text": "Với động từ be ở ước hiện tại thì dùng WERE cho mọi chủ ngữ: I wish I were taller.", "lv": 0}, {"t": "p", "text": "Would chỉ dùng khi ước người khác hoặc sự việc thay đổi, KHÔNG dùng khi chủ ngữ hai vế giống nhau. Sai: I wish I would be rich.", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I wish I knew his address. (Ước gì tôi biết địa chỉ của anh ấy. Thực tế là không biết.)", "lv": 0}, {"t": "p", "text": "I wish I hadn't said that. (Ước gì tôi đã không nói điều đó.)", "lv": 0}, {"t": "p", "text": "I wish you would stop talking. (Ước gì bạn ngừng nói.)", "lv": 0}, {"t": "p", "text": "If only I were younger. (Giá mà tôi trẻ hơn.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Cách chuyển nhanh: lấy câu thực tế rồi đảo nghĩa và lùi một thì. I am not rich. - I wish I were rich.", "lv": 0}, {"t": "p", "text": "Cấu trúc tương đương: It is a pity that... và S + would rather + S + quá khứ đơn.", "lv": 0}]}], "quiz": [{"t": "I wish I ___ a car.", "o": ["have", "had", "will have", "would have"], "a": 1, "e": "Ước về hiện tại dùng quá khứ đơn."}, {"t": "I wish I ___ harder last year.", "o": ["studied", "had studied", "study", "would study"], "a": 1, "e": "Ước về quá khứ dùng had + V3."}, {"t": "I wish it ___ raining.", "o": ["stops", "stopped", "would stop", "had stopped"], "a": 2, "e": "Ước sự việc thay đổi trong tương lai dùng would."}, {"t": "I wish I ___ taller.", "o": ["am", "was", "were", "will be"], "a": 2, "e": "Ước hiện tại với be thì dùng were."}, {"t": "If only I ___ his phone number.", "o": ["know", "knew", "will know", "would know"], "a": 1, "e": "If only giống wish, ước hiện tại dùng quá khứ đơn."}, {"t": "She wishes she ___ that mistake.", "o": ["doesn't make", "didn't make", "hadn't made", "wouldn't make"], "a": 2, "e": "Ước về quá khứ dùng had + V3."}, {"t": "I wish you ___ so loudly.", "o": ["don't talk", "didn't talk", "wouldn't talk", "hadn't talk"], "a": 2, "e": "Ước người khác thay đổi hành vi dùng would."}, {"t": "Thực tế: I am not rich. Câu ước đúng là gì?", "o": ["I wish I am rich.", "I wish I were rich.", "I wish I will be rich.", "I wish I had been rich."], "a": 1, "e": "Ước hiện tại với be dùng were."}, {"t": "Chọn câu SAI.", "o": ["I wish I were taller.", "I wish I had more money.", "I wish I would be rich.", "I wish he would help me."], "a": 2, "e": "Không dùng would khi chủ ngữ hai vế giống nhau."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">I</span> <span class=\"seg\" data-l=\"B\">wish</span> <span class=\"seg\" data-l=\"C\">I have</span> <span class=\"seg\" data-l=\"D\">a bigger house</span>.", "o": ["I", "wish", "I have", "a bigger house"], "a": 2, "e": "Ước về hiện tại dùng quá khứ đơn: I had."}]}, {"id": "u29", "title": "Câu bị động", "desc": "Công thức bị động của các thì, bị động với modal và hai tân ngữ.", "blocks": [{"t": "p", "text": "Bị động dùng khi muốn nhấn mạnh việc gì được làm chứ không phải ai làm. Công thức lõi là be + V3, chỉ đổi dạng của be theo thì."}, {"t": "h", "lv": 2, "text": "Bảng bị động theo thì"}, {"t": "tbl", "rows": [["Thì", "Chủ động", "Bị động"], ["Hiện tại đơn", "cooks", "is / are cooked"], ["Hiện tại tiếp diễn", "is cooking", "is being cooked"], ["Quá khứ đơn", "cooked", "was / were cooked"], ["Quá khứ tiếp diễn", "was cooking", "was being cooked"], ["Hiện tại hoàn thành", "has cooked", "has been cooked"], ["Quá khứ hoàn thành", "had cooked", "had been cooked"], ["Tương lai đơn", "will cook", "will be cooked"], ["Modal", "must cook", "must be cooked"]]}, {"t": "h", "lv": 2, "text": "Ba bước chuyển sang bị động"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Bước 1: Tân ngữ của câu chủ động trở thành chủ ngữ của câu bị động.", "lv": 0}, {"t": "p", "text": "Bước 2: Chia be theo đúng thì của động từ cũ, rồi thêm V3.", "lv": 0}, {"t": "p", "text": "Bước 3: Chủ ngữ cũ chuyển xuống cuối, thêm by. Nếu không quan trọng thì bỏ.", "lv": 0}, {"t": "p", "text": "The chef cooks the meal. - The meal is cooked by the chef.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Bị động với hai tân ngữ"}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "They gave me a present. - I was given a present. hoặc A present was given to me.", "lv": 0}, {"t": "p", "text": "Động từ hay có hai tân ngữ: give, send, show, tell, offer, lend, teach.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Nội động từ (happen, occur, arrive, go, come, die) KHÔNG có bị động.", "lv": 0}, {"t": "p", "text": "Cấu trúc người ta nói rằng: It is said that he is rich. = He is said to be rich.", "lv": 0}]}], "quiz": [{"t": "The meal ___ by the chef.", "o": ["is cooked", "cooks", "is cooking", "cooking"], "a": 0, "e": "Bị động hiện tại đơn là is + V3."}, {"t": "My bike ___ yesterday.", "o": ["was stolen", "stole", "is stolen", "was stealing"], "a": 0, "e": "Bị động quá khứ đơn là was + V3."}, {"t": "The problem must ___ quickly.", "o": ["be solved", "solve", "is solved", "been solved"], "a": 0, "e": "Bị động với modal là modal + be + V3."}, {"t": "The tickets ___ before we arrived.", "o": ["had been sold", "have been sold", "were selling", "sold"], "a": 0, "e": "Bị động quá khứ hoàn thành là had been + V3."}, {"t": "Câu nào KHÔNG thể chuyển sang bị động?", "o": ["The accident happened.", "The chef cooks the meal.", "They built the bridge.", "People speak English."], "a": 0, "e": "Happen là nội động từ nên không có bị động."}, {"t": "These cars ___ in Japan.", "o": ["are made", "make", "is made", "made"], "a": 0, "e": "Bị động hiện tại đơn, chủ ngữ số nhiều."}, {"t": "The room ___ when I arrived.", "o": ["was being cleaned", "is being cleaned", "cleaned", "has cleaned"], "a": 0, "e": "Bị động quá khứ tiếp diễn."}, {"t": "They gave me a present. Câu bị động đúng là gì?", "o": ["I was given a present.", "I was give a present.", "A present gave to me.", "Me was given a present."], "a": 0, "e": "Tân ngữ chỉ người lên làm chủ ngữ."}, {"t": "It is said that he ___ rich.", "o": ["is", "be", "being", "been"], "a": 0, "e": "Cấu trúc It is said that + mệnh đề bình thường."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">The letter</span> <span class=\"seg\" data-l=\"B\">was</span> <span class=\"seg\" data-l=\"C\">wrote</span> <span class=\"seg\" data-l=\"D\">by my mother</span>.", "o": ["The letter", "was", "wrote", "by my mother"], "a": 2, "e": "Bị động cần V3: was written."}]}, {"id": "u30", "title": "Động từ khuyết thiếu và modal perfect", "desc": "Can, must, should cho hiện tại và dạng modal + have + V3 cho quá khứ.", "blocks": [{"t": "p", "text": "Động từ khuyết thiếu diễn tả thái độ của người nói. Thêm have + V3 là chuyển sang nói về quá khứ."}, {"t": "h", "lv": 2, "text": "Modal cơ bản"}, {"t": "tbl", "rows": [["Modal", "Nghĩa", "Ví dụ"], ["can / could", "có thể, khả năng", "She can swim."], ["may / might", "có lẽ, khả năng thấp", "It might rain later."], ["must", "phải, nghĩa vụ mạnh", "You must wear a seatbelt."], ["have to", "phải, do hoàn cảnh bắt buộc", "I have to work tomorrow."], ["should / ought to", "nên, lời khuyên", "You should see a doctor."], ["would", "lời đề nghị lịch sự", "Would you like some tea?"]]}, {"t": "h", "lv": 2, "text": "Modal perfect — nói về quá khứ"}, {"t": "tbl", "rows": [["Cấu trúc", "Nghĩa", "Ví dụ"], ["must have + V3", "chắc hẳn đã", "The lights are off. They must have gone to bed."], ["can't have + V3", "không thể nào đã", "He can't have finished so fast."], ["should have + V3", "lẽ ra nên (nhưng đã không)", "You should have told me earlier."], ["shouldn't have + V3", "lẽ ra không nên", "You shouldn't have shouted at him."], ["could have + V3", "đã có thể (nhưng không làm)", "We could have stayed longer."], ["may / might have + V3", "có lẽ đã", "She might have forgotten."]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Sau mọi modal luôn là động từ NGUYÊN THỂ KHÔNG to. Sai: She must to go.", "lv": 0}, {"t": "p", "text": "Phân biệt: mustn't là cấm, còn don't have to là không cần. You mustn't smoke. / You don't have to come.", "lv": 0}]}], "quiz": [{"t": "You ___ see a doctor.", "o": ["should", "might", "can't", "would have"], "a": 0, "e": "Should dùng cho lời khuyên."}, {"t": "The lights are off. They ___ gone to bed.", "o": ["must have", "must", "should to have", "can have"], "a": 0, "e": "Suy luận về quá khứ dùng must have + V3."}, {"t": "You ___ told me earlier.", "o": ["should have", "should", "must", "might"], "a": 0, "e": "Lẽ ra nên làm dùng should have + V3."}, {"t": "It ___ rain later, but I am not sure.", "o": ["might", "must", "should have", "can't have"], "a": 0, "e": "Might diễn tả khả năng thấp."}, {"t": "Sau động từ khuyết thiếu dùng dạng động từ nào?", "o": ["Nguyên thể không to", "To + nguyên thể", "V-ing", "V3"], "a": 0, "e": "Sau modal luôn là nguyên thể không to."}, {"t": "You ___ wear a seatbelt. It is the law.", "o": ["must", "might", "could", "would"], "a": 0, "e": "Must diễn tả nghĩa vụ mạnh."}, {"t": "We ___ have stayed longer, but we had to leave.", "o": ["could", "must", "can't", "should to"], "a": 0, "e": "Đã có thể nhưng không làm dùng could have + V3."}, {"t": "You ___ shouted at him. It was rude.", "o": ["shouldn't have", "shouldn't", "mightn't", "can't be"], "a": 0, "e": "Lẽ ra không nên làm dùng shouldn't have + V3."}, {"t": "Phân biệt: câu nào nghĩa là KHÔNG CẦN?", "o": ["You mustn't come.", "You don't have to come.", "You can't come.", "You shouldn't come."], "a": 1, "e": "Don't have to nghĩa là không cần, mustn't nghĩa là cấm."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">must</span> <span class=\"seg\" data-l=\"C\">to go</span> <span class=\"seg\" data-l=\"D\">now</span>.", "o": ["She", "must", "to go", "now"], "a": 2, "e": "Sau must dùng nguyên thể không to: go."}]}, {"id": "c5", "title": "Câu tường thuật", "desc": "Lùi thì, đổi đại từ và trạng ngữ, tường thuật câu hỏi và câu mệnh lệnh.", "blocks": [{"t": "p", "text": "Tường thuật là kể lại lời người khác. Có ba thứ phải đổi: THÌ, ĐẠI TỪ và TRẠNG NGỮ."}, {"t": "h", "lv": 2, "text": "1. Lùi thì"}, {"t": "tbl", "rows": [["Lời nói trực tiếp", "Lời tường thuật"], ["hiện tại đơn", "quá khứ đơn"], ["hiện tại tiếp diễn", "quá khứ tiếp diễn"], ["quá khứ đơn", "quá khứ hoàn thành"], ["hiện tại hoàn thành", "quá khứ hoàn thành"], ["will", "would"], ["can", "could"], ["may", "might"], ["must", "had to"]]}, {"t": "h", "lv": 2, "text": "2. Đổi đại từ và trạng ngữ"}, {"t": "tbl", "rows": [["Trực tiếp", "Tường thuật"], ["I, we", "he, she, they"], ["my, our", "his, her, their"], ["this, these", "that, those"], ["now", "then"], ["today", "that day"], ["tomorrow", "the next day"], ["yesterday", "the day before"], ["ago", "before"], ["here", "there"]]}, {"t": "h", "lv": 2, "text": "3. Ba dạng câu tường thuật"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Câu kể: S + said (that) + mệnh đề lùi thì. He said that he was tired.", "lv": 0}, {"t": "p", "text": "Câu hỏi Yes/No: S + asked + if/whether + S + V (KHÔNG đảo). She asked if I could help.", "lv": 0}, {"t": "p", "text": "Câu hỏi WH: S + asked + từ để hỏi + S + V (KHÔNG đảo). He asked where I lived.", "lv": 0}, {"t": "p", "text": "Câu mệnh lệnh: S + told/asked + O + to V. Phủ định là not to V. She told me to wait. He asked me not to go.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "KHÔNG lùi thì khi nói về sự thật hiển nhiên: He said that the sun rises in the east.", "lv": 0}, {"t": "p", "text": "Câu hỏi tường thuật KHÔNG đảo ngữ và KHÔNG có dấu chấm hỏi. Sai: He asked where did I live.", "lv": 0}]}], "quiz": [{"t": "He said, I am tired. Câu tường thuật đúng là gì?", "o": ["He said that he is tired.", "He said that he was tired.", "He said that he had tired.", "He said he will be tired."], "a": 1, "e": "Hiện tại đơn lùi thành quá khứ đơn."}, {"t": "She said, I will come tomorrow.", "o": ["She said she will come tomorrow.", "She said she would come the next day.", "She said she would come tomorrow.", "She said she comes the next day."], "a": 1, "e": "Will lùi thành would và tomorrow đổi thành the next day."}, {"t": "He asked, Where do you live?", "o": ["He asked where did I live.", "He asked where I lived.", "He asked where do I live.", "He asked where I live."], "a": 1, "e": "Câu hỏi tường thuật không đảo ngữ và phải lùi thì."}, {"t": "She asked, Can you help me?", "o": ["She asked if I could help her.", "She asked can I help her.", "She asked if could I help her.", "She asked if I can help her."], "a": 0, "e": "Câu hỏi Yes/No dùng if và lùi can thành could."}, {"t": "She said, Wait here. Câu tường thuật đúng là gì?", "o": ["She told me wait there.", "She told me to wait there.", "She told me waiting there.", "She said me to wait there."], "a": 1, "e": "Câu mệnh lệnh dùng told + O + to V."}, {"t": "He said, Don't go out.", "o": ["He told me don't go out.", "He told me not to go out.", "He told me to not go out.", "He said me not go out."], "a": 1, "e": "Mệnh lệnh phủ định dùng not to V."}, {"t": "Must lùi thành gì trong câu tường thuật?", "o": ["had to", "must have", "would must", "can"], "a": 0, "e": "Must lùi thành had to."}, {"t": "He said, I saw her yesterday.", "o": ["He said he saw her yesterday.", "He said he had seen her the day before.", "He said he has seen her yesterday.", "He said he sees her the day before."], "a": 1, "e": "Quá khứ đơn lùi thành quá khứ hoàn thành, yesterday đổi thành the day before."}, {"t": "The teacher said, The earth moves ar ta-l=\"C\">born</span> <span class=\"seg\" data-l=\"D\">in July 5th</span>.", "o": ["She", "was", "born", "in July 5th"], "a": 3, "e": "Ngày cụ thể phải dùng on: on July 5th."}, {"t": "He was tired, ___ he kept working.", "o": ["so", "but", "because", "and"], "a": 1, "e": "Hai vế tương phản nên dùng but."}, {"t": "___ it was raining, we went out.", "o": ["Because", "Although", "So", "And"], "a": 1, "e": "Vế sau trái ngược vế trước nên dùng Although."}, {"t": "She was absent ___ her illness.", "o": ["because", "because of", "although", "so"], "a": 1, "e": "Her illness là danh từ nên dùng because of."}, {"t": "___ Lan ___ Nam can speak French.", "o": ["Both / and", "Either / and", "Neither / or", "Not only / and"], "a": 0, "e": "Cặp chuẩn là both… and…"}, {"t": "Neither he ___ I am responsible.", "o": ["or", "nor", "and", "but"], "a": 1, "e": "Đi với neither là nor."}, {"t": "Chọn câu ĐÚNG.", "o": ["Although he was ill, but he came.", "Although he was ill, he came.", "Because he was ill, so he came.", "Despite he was ill, he came."], "a": 1, "e": "Không dùng hai liên từ cùng lúc; despite phải đi với danh từ."}, {"t": "Call me ___ you arrive.", "o": ["so", "but", "as soon as", "although"], "a": 2, "e": "Diễn tả thời gian nên dùng as soon as."}, {"t": "She is not only beautiful ___ also intelligent.", "o": ["and", "but", "or", "nor"], "a": 1, "e": "Cặp chuẩn là not only… but also…"}, {"t": "___ you study hard, you will fail.", "o": ["If", "Unless", "Because", "Although"], "a": 1, "e": "Unless nghĩa là “nếu không”, hợp nghĩa với vế sau."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">In spite of</span> <span class=\"seg\" data-l=\"B\">he was tired</span> <span class=\"seg\" data-l=\"C\">,</span> <span class=\"seg\" data-l=\"D\">he kept working</span>.", "o": ["In spite of", "he was tired", ",", "he kept working"], "a": 1, "e": "In spite of phải đi với danh từ; đứng trước mệnh đề phải dùng Although."}]}, {"id": "t2", "part": "p4", "title": "Bài kiểm tra Các kiểu câu và dấu câu", "quiz": [{"t": "Nhóm từ nào KHÔNG thể đứng riêng thành câu?", "o": ["She reads books.", "because she loves stories", "They played basketball.", "He is rich."], "a": 1, "e": "Because she loves stories là mệnh đề phụ thuộc nên không đứng riêng được."}, {"t": "She reads books, and he writes poems. Câu này có mấy mệnh đề độc lập?", "o": ["1", "2", "3", "0"], "a": 1, "e": "She reads books và he writes poems là hai mệnh đề độc lập."}, {"t": "Because it was late, we went home. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 2, "e": "Có 1 mệnh đề phụ thuộc (Because it was late) và 1 mệnh đề độc lập nên là câu phức."}, {"t": "Mệnh đề phụ thuộc thường mở đầu bằng gì?", "o": ["Liên từ phụ thuộc hoặc đại từ quan hệ", "Dấu chấm", "Mạo từ", "Giới từ chỉ nơi chốn"], "a": 0, "e": "Liên từ phụ thuộc (because, although...) hoặc đại từ quan hệ mở đầu mệnh đề phụ thuộc."}, {"t": "Câu nào có vị ngữ ghép?", "o": ["She danced and sang.", "John and Mary left.", "They arrived.", "She sings, and he dances."], "a": 0, "e": "Danced và sang là hai động từ dùng chung chủ ngữ she."}, {"t": "Câu nào có chủ ngữ ghép?", "o": ["John and Mary went to the store.", "She danced and sang.", "He ran.", "It rained, so we left."], "a": 0, "e": "John and Mary là hai chủ ngữ dùng chung động từ."}, {"t": "Câu nào là câu đơn?", "o": ["The students studied hard.", "The students studied, but they failed.", "The students failed because they did not study.", "Although they studied, they failed."], "a": 0, "e": "Chỉ có một mệnh đề độc lập."}, {"t": "Một câu đơn chứa bao nhiêu mệnh đề độc lập?", "o": ["1", "2", "3", "Không có"], "a": 0, "e": "Câu đơn chỉ có một mệnh đề độc lập."}, {"t": "He doesn't smoke, ___ does he drink.", "o": ["nor", "or", "but", "so"], "a": 0, "e": "Nor nghĩa là cũng không, dùng với phủ định bổ sung."}, {"t": "Hurry up, ___ you will miss the bus.", "o": ["and", "or", "so", "yet"], "a": 1, "e": "Or chỉ lựa chọn hoặc hậu quả nếu không làm: nhanh lên, nếu không sẽ lỡ xe."}, {"t": "Chọn câu đúng.", "o": ["She studied hard, she failed the exam.", "She studied hard, yet she failed the exam.", "She studied hard yet, she failed the exam.", "She studied hard; yet she failed, the exam."], "a": 1, "e": "Hai mệnh đề độc lập nối bằng dấu phẩy và liên từ kết hợp yet."}, {"t": "He stayed home, ___ he was ill.", "o": ["for", "so", "but", "or"], "a": 0, "e": "For nghĩa là vì, chỉ nguyên nhân."}, {"t": "We went out ___ it was raining.", "o": ["although", "because", "unless", "so that"], "a": 0, "e": "Trời mưa nhưng vẫn ra ngoài là nhượng bộ nên dùng although."}, {"t": "___ you hurry, you will miss the bus.", "o": ["Unless", "Because", "Although", "Until"], "a": 0, "e": "Unless = if ... not: trừ khi bạn nhanh lên."}, {"t": "Chọn câu đúng.", "o": ["After we finished dinner, we watched a movie.", "After we finished dinner we, watched a movie.", "After, we finished dinner we watched a movie.", "After we finished dinner; we watched a movie."], "a": 0, "e": "Mệnh đề phụ thuộc đứng trước cần dấu phẩy rồi mới đến mệnh đề chính."}, {"t": "I will wait here ___ you come back.", "o": ["until", "although", "because", "as if"], "a": 0, "e": "Until nghĩa là cho đến khi, chỉ thời gian."}, {"t": "Chọn câu đúng.", "o": ["Where are you going.", "Where are you going?", "Where are you going!", "Where are you going,"], "a": 1, "e": "Câu hỏi kết thúc bằng dấu chấm hỏi."}, {"t": "Câu nào dùng dấu phẩy Oxford?", "o": ["I bought apples, oranges, and bananas.", "I bought apples, oranges and bananas.", "I bought apples oranges and bananas.", "I bought apples; oranges; and bananas."], "a": 0, "e": "Dấu phẩy Oxford là dấu phẩy đặt trước and trong danh sách."}, {"t": "Tìm phần sai trong câu.", "sentence": "She <span class=\"seg\" data-l=\"A\">enjoys</span> <span class=\"seg\" data-l=\"B\">reading,</span> <span class=\"seg\" data-l=\"C\">and</span> <span class=\"seg\" data-l=\"D\">watching movies</span>.", "o": ["enjoys", "reading,", "and", "watching movies"], "a": 1, "e": "Chỉ liệt kê hai đối tượng nên không cần dấu phẩy: reading and watching movies."}, {"t": "Chọn cách sửa tốt nhất cho If you study hard you will pass the exam.", "o": ["If you study hard, you will pass the exam.", "If you study hard; you will pass the exam.", "If you study, hard you will pass the exam.", "If you study hard you, will pass the exam."], "a": 0, "e": "Mệnh đề If đứng trước cần dấu phẩy."}, {"t": "Câu nào dưới đây có chứa một mệnh đề phụ thuộc?", "o": ["She reads books.", "They played basketball.", "He left because he was tired.", "Tom and Jerry ran."], "a": 2, "e": "Because he was tired là mệnh đề phụ thuộc."}, {"t": "We stayed home, and it rained all day. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 1, "e": "Hai mệnh đề độc lập nối bằng and nên là câu ghép."}, {"t": "When I arrived, she was cooking. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 2, "e": "Có 1 mệnh đề phụ thuộc (When I arrived) và 1 mệnh đề độc lập nên là câu phức."}, {"t": "Câu phức khác câu ghép ở điểm nào?", "o": ["Câu phức có mệnh đề phụ thuộc", "Câu phức có nhiều mệnh đề độc lập", "Câu phức không có động từ", "Câu phức chỉ có một từ"], "a": 0, "e": "Câu phức có ít nhất một mệnh đề phụ thuộc, còn câu ghép nối các mệnh đề độc lập."}, {"t": "The children laughed and played in the garden. Câu này có gì đặc biệt?", "o": ["Chủ ngữ ghép", "Vị ngữ ghép", "Hai mệnh đề độc lập", "Mệnh đề phụ thuộc"], "a": 1, "e": "Laughed và played là hai động từ dùng chung chủ ngữ the children."}, {"t": "Anna and Ben are cousins. Câu này là kiểu câu nào?", "o": ["Câu đơn có chủ ngữ ghép", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 0, "e": "Chỉ có một mệnh đề với hai chủ ngữ Anna và Ben."}, {"t": "Câu nào KHÔNG phải câu đơn?", "o": ["She sings.", "She sings and dances.", "She sings, and he dances.", "Mary and Tom sing."], "a": 2, "e": "She sings, and he dances có hai mệnh đề đ const $ = s => document.querySelector(s);

const stripTags = s => String(s).replace(/<[^>]*>/g, '');
const day = (o = 0) => new Date(Date.now() + o * 864e5).toLocaleDateString('en-CA');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

let toastTimer, toastTo = null;
function toast(m, ms = 3200, to = null) {
  const t = $('#toast');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; toastTo = null; }, ms);
}

const testSize = t => Math.min(TEST_SIZE, t.quiz.length);       /* số câu mỗi lần làm (bốc từ ngân hàng) */
const testPass = (s, n) => s * 10 >= n * 7;                     /* bài kiểm tra: đúng từ 70% */
const testNeed = n => Math.ceil(n * 0.7);                      /* 20 câu: cần ít nhất 14 */
const TRY_UNLOCK = 3;                                          /* làm đủ 3 lần thì mở khóa tạm phần sau */
const testTries = (p, t) => (p.tests[t.id] && p.tests[t.id].tries) || 0;
const partOf = id => PARTS.find(p => p.units.includes(id));
const partUnits = pt => pt.units.map(U).filter(Boolean);
const partTest = pt => TESTS.find(t => t.part === pt.id);
const testPart = t => PARTS.find(p => p.id === t.part);
function getQ(id) {
  const m = /^([A-Za-z][A-Za-z0-9_-]*):(\d+)$/.exec(id || '');
  if (!m) return null;
  const src = UNITS.find(x => x.id === m[1]) || TESTS.find(x => x.id === m[1]);
  return src && src.quiz[+m[2]] ? { u: src, q: src.quiz[+m[2]], i: +m[2] } : null;
}

/* ===================== TIẾN ĐỘ ===================== */
const emptyP = () => ({ units: {}, tests: {}, wrong: [], days: [] });
/* Làm sạch dữ liệu đọc từ máy chủ (không tin hoàn toàn dữ liệu bên ngoài) */
function cleanP(o) {
  const p = emptyP();
  if (!o || typeof o !== 'object') return p;
  UNITS.forEach(u => { const s = o.units && o.units[u.id]; if (s && Number.isFinite(+s.best)) p.units[u.id] = { best: clamp(Math.floor(+s.best), 0, u.quiz.length) }; });
  TESTS.forEach(t => { const s = o.tests && o.tests[t.id]; if (s && Number.isFinite(+s.best)) p.tests[t.id] = { best: clamp(Math.floor(+s.best), 0, testSize(t)), tries: clamp(Math.floor(+s.tries) || 0, 0, 999) }; });
  if (Array.isArray(o.wrong)) p.wrong = [...new Set(o.wrong.filter(id => typeof id === 'string' && getQ(id)))];
  /* Ngày đã học được lưu trong cùng trường units (khóa _days) để không cần đổi quy tắc Firestore */
  const rawDays = o.units && o.units._days;
  if (Array.isArray(rawDays)) p.days = [...new Set(rawDays.filter(validDay))].sort().slice(-400);
  return p;
}
const isDone = (p, u) => !!p.units[u.id] && p.units[u.id].best >= passMark(u);
const testPassed = (p, t) => !!p.tests[t.id] && testPass(p.tests[t.id].best, testSize(t));
const itemsOf = pt => [...partUnits(pt).map(u => ({ kind: 'unit', o: u })), ...(partTest(pt) ? [{ kind: 'test', o: partTest(pt) }] : [])];
const allItems = () => PARTS.flatMap(itemsOf);
const itemDone = (p, it) => it.kind === 'unit' ? isDone(p, it.o) : testPassed(p, it.o);
function itemState(p, it) {
  if (itemDone(p, it)) return 'done';
  return (it.kind === 'unit' ? p.units[it.o.id] : p.tests[it.o.id]) ? 'prog' : 'none';
}
/* Tổng số mục và % hoàn thành luôn tính từ các bài đang hiển thị trong các phần (gồm bài học và bài kiểm tra) */
function stats(p) {
  const its = allItems();
  return { total: its.length, done: its.filter(i => itemDone(p, i)).length, wrong: p.wrong.length };
}

/* Danh sách học viên cho giáo viên: luôn hiện đủ các học viên đã khai báo trong ACCOUNTS, kể cả khi chưa đăng nhập lần nào */
function buildRoster(docs) {
  const R = {};
  Object.keys(ACCOUNTS).filter(u => u !== ADMIN_USER).forEach(u => { R[u] = { u, n: ACCOUNTS[u].name, p: emptyP(), seen: false }; });
  (docs || []).forEach(d => {
    const u = String((d && d.user) || '').toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 20);
    if (!u || u === ADMIN_USER) return;
    R[u] = { u, n: (ACCOUNTS[u] && ACCOUNTS[u].name) || u, p: cleanP(d), seen: true };

}

/* Khóa phần: học viên phải vượt qua bài kiểm tra của phần trước. Giáo viên xem được tất cả. */
function partLocked(pt) {
  if (!ME || ME.role === 'admin') return false;
  const i = PARTS.indexOf(pt);
  if (i <= 0) return false;
  const t = partTest(PARTS[i - 1]);
  if (!t) return false;
  if (testPassed(S, t)) return false;
  return testTries(S, t) < TRY_UNLOCK;   /* làm đủ 3 lần vẫn được học tiếp, tránh bị kẹt */
}
/* phần được mở tạm do làm đủ số lần chứ chưa đạt điểm */
function partSoftOpen(pt) {
  const i = PARTS.indexOf(pt);
  if (i <= 0) return false;
  const t = partTest(PARTS[i - 1]);
  return !!t && !testPassed(S, t) && testTries(S, t) >= TRY_UNLOCK;
}

function donut(done, prog, none) {

    if (!v) return '';
    const len = v / n * C;
    const out = `<circle cx="60" cy="60" r="48" fill="none" stroke-width="16" style="stroke:${color}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return out;
  };
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${done} bài hoàn thành, ${prog} bài đang học, ${none} bài chưa học">
    <circle cx="60" cy="60" r="48" fill="none" stroke-width="16" style="stroke:var(--line)"/>
    ${arc(done, 'var(--ok)')}${arc(prog, 'var(--accent)')}
    <text class="dn" x="60" y="58" text-anchor="middle">${done}/${n}</text>
    <text class="dl" x="60" y="75" text-anchor="middle">hoàn thành</text></svg>`;
}
function progressChart(p) {
  const parts = PARTS.map(pt => ({ pt, its: itemsOf(pt) })).filter(x => x.its.length);
  const c = { done: 0, prog: 0, none: 0 };
  parts.forEach(x => x.its.forEach(it => c[itemState(p, it)]++));
  return `
    <div class="pg">${donut(c.done, c.prog, c.none)}
      <ul class="legend">
        <li><i class="k-done"></i>Hoàn thành: ${c.done} bài</li>
        <li><i class="k-prog"></i>Đang học: ${c.prog} bài</li>
        <li><i class="k-none"></i>Chưa học: ${c.none} bài</li>

    ${parts.map(({ pt, its }) => `

      ${its.map(it => {
        const isT = it.kind === 'test', n = isT ? testSize(it.o) : it.o.quiz.length;
        const st = isT ? p.tests[it.o.id] : p.units[it.o.id];
        const b = st ? st.best : 0, state = itemState(p, it);
        const tick = isT ? 80 : passMark(it.o) / n * 100;
        return `<div class="ub"><div class="ub-h"><span>${isT ? 'Bài kiểm tra cuối phần' : it.o.title}</span><b>${st ? b + '/' + n : 'Chưa học'}</b></div>
          <div class="meter"><i class="${state === 'done' ? 'good' : ''}" style="width:${b / n * 100}%"></i><s style="left:${tick}%"></s></div></div>`;
      }).join('')}`).join('')}
    <p class="muted sm" style="margin:12px 0 0">Vạch đen là mức hoàn thành: bài học đúng ít nhất 75% số câu, bài kiểm tra đúng trên 80%. Đang học là đã làm nhưng chưa đạt mức hoàn thành.</p>`;
}

function loginMsg(e) {

  if (c === 'auth/network-request-failed') return 'Không kết nối được mạng. Hãy kiểm tra internet rồi thử lại.';

async function doLogin(f) {
  const user = f.elements.user.value.toLowerCase().replace(/\s+/g, '');
  const pw = f.elements.pw.value;

  const btn = f.querySelector('button[type=submit]');
  btn.disabled = true;
  try { await Backend.login(user, pw); }
  catch (e) { authErr(loginMsg(e)); btn.disabled = false; }

let calMonth = day().slice(0, 7);
function shiftMonth(ym, k) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + k, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function calendarHTML(days, forAdmin = false) {
  const [y, m] = calMonth.split('-').map(Number);
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;      /* T2 là cột đầu tiên */
  const dim = new Date(y, m, 0).getDate();
  const set = new Set(days), today = day();
  let cells = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(w => `<span class="cal-w">${w}</span>`).join('');
  for (let i = 0; i < lead; i++) cells += '<i class="cd empty"></i>';
  let count = 0;
  for (let d = 1; d <= dim; d++) {
    const key = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const on = set.has(key);
    if (on) count++;
    cells += `<span class="cd${on ? ' on' : ''}${key === today ? ' today' : ''}"${on ? ` aria-label="Ngày ${d}: đã học"` : ''}><b>${d}</b>${on ? '<em>★</em>' : ''}</span>`;
  }
  const isNow = calMonth === today.slice(0, 7);

  const last = days.length ? days.slice().sort().pop().split('-').reverse().join('/') : '';

    <div class="cal-g">${cells}</div>
    <p class="muted sm cal-s">${forAdmin
      ? `${isNow ? 'Tháng này' : 'Tháng ' + m} học viên đã học <b>${count}</b> ngày. ${last ? 'Lần học gần nhất: ' + last + '.' : 'Chưa có ngày học nào được ghi nhận.'}`
      : `${isNow ? 'Tháng này' : 'Tháng ' + m} bạn đã học <b>${count}</b> ngày.${isNow ? ' ' + note : ''}`}</p>`;
}

function weakByPart() {

const noAcc = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

}

const lineCls = t => /^Sai:/.test(t) ? 'no' : /^Đúng:/.test(t) ? 'yes' : /^Lỗi \d+:/.test(t) ? 'lb' : /^→/.test(t) ? 'ar' : '';

/* ===================== QUIZ VÀ BÀI KIỂM TRA ===================== */
/* Trộn thứ tự đáp án (trừ câu tìm lỗi sai, vì các đáp án gắn với đoạn gạch chân A-D) */
const prep = q => {
  if (q.sentence) return q;
  const idx = shuffle(q.o.map((_, i) => i));
  return Object.assign({}, q, { o: idx.map(i => q.o[i]), a: idx.indexOf(q.a) });
};
function startQuiz(mode, id, fixed) {
  let list;

    list = fixed.map(w => { const g = getQ(w); return g ? { id: w, q: g.q } : null; }).filter(Boolean);
    if (!list.length) { toast('Không còn câu nào để làm lại'); return; }
    go({ name: 'quiz', mode: 'retry', refId: id, items: shuffle(list).map(x => ({ id: x.id, q: prep(x.q) })), i: 0, score: 0, picked: null, wrongIds: [] });
    return;
  }
  if (mode === 'unit') { const u = U(id); if (!u) return; list = u.quiz.map((q, i) => ({ id: `${id}:${i}`, q })); }
  else if (mode === 'test') {
    const t = TESTS.find(x => x.id === id); if (!t) return;
    if (partLocked(testPart(t))) return go({ name: 'lessons' });
    list = shuffle(t.quiz.map((q, i) => ({ id: `${id}:${i}`, q }))).slice(0, testSize(t));   /* bốc ngẫu nhiên từ ngân hàng */
  } else list = S.wrong.map(w => { const g = getQ(w); return g ? { id: w, q: g.q } : null; }).filter(Boolean);
  if (!list.length) { toast('Chưa có câu nào để làm'); return; }
  clearResume();
  go({ name: 'quiz', mode, refId: id, items: shuffle(list).map(x => ({ id: x.id, q: prep(x.q) })), i: 0, score: 0, picked: null, wrongIds: [] });
}
const quizTitle = v => v.mode === 'review' ? 'Ôn câu sai' : v.mode === 'retry' ? 'Làm lại câu sai' : v.mode === 'test' ? TESTS.find(t => t.id === v.refId).title : U(v.refId).title;
/* unit chứa một câu hỏi, dùng cho nút Xem lại bài ngay dưới lời giải */
const unitOfQ = id => { const m = /^([A-Za-z][A-Za-z0-9_-]*):/.exec(id || ''); return m ? UNITS.find(x => x.id === m[1]) : null; };
function renderQuiz() {

  if (done) $('#why').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function pick(k) {
  const v = view;
  if (v.picked !== null) return;
  v.picked = k;
  const it = v.items[v.i];
  markStudied();
  if (k === it.q.a) {
    v.score++;
    S.wrong = S.wrong.filter(x => x !== it.id);
    v.wrongIds = (v.wrongIds || []).filter(x => x !== it.id);
  } else {
    if (!S.wrong.includes(it.id)) S.wrong.push(it.id);
    v.wrongIds = v.wrongIds || [];
    if (!v.wrongIds.includes(it.id)) v.wrongIds.push(it.id);
  }
  saveResume(); persist(); renderQuiz();
}
function nextQ() {
  const v = view;
  if (v.i + 1 < v.items.length) { v.i++; v.picked = null; saveResume(); renderQuiz(); window.scrollTo(0, 0); return; }
  clearResume();
  if (v.mode === 'unit') {
    const prev = S.units[v.refId];
    S.units[v.refId] = { best: Math.max(prev ? prev.best : 0, v.score) };
  } else if (v.mode === 'test') {
    const prev = S.tests[v.refId];
    S.tests[v.refId] = { best: Math.max(prev ? prev.best : 0, v.score), tries: ((prev && prev.tries) || 0) + 1 };
  }
  doSave();
  go({ name: 'result', mode: v.mode, refId: v.refId, score: v.score, total: v.items.length, wrongIds: v.wrongIds || [] });
}
/* mục học ngay sau một bài: bài kế trong phần, rồi bài kiểm tra, rồi phần sau */
function nextAfterUnit(u) {

}

function renderTestResult() {

  const pass = testPass(v.score, v.total), need = testNeed(v.total);
  const pct = Math.round(v.score / v.total * 100);
  const wrong = S.wrong.length;
  $app.innerHTML = `
    <div class="narrow"><section class="sec">
      <h3>${t.title}</h3>
      <p class="score">${v.score}/${v.total}</p>
      <p class="muted" style="margin-bottom:6px"><b>${pass ? 'Đạt' : 'Chưa đạt'}</b>: ${pct}% số câu đúng. Cần đúng từ ${need}/${v.total} câu (70%).</p>
      <p class="muted">${pass
        ? (next ? `Bạn đã vượt qua bài kiểm tra Phần ${pt.no}. Phần ${next.no} đã được mở khóa.` : 'Bạn đã vượt qua bài kiểm tra cuối cùng và hoàn thành toàn bộ khóa học.')
        : `Hãy ôn lại các câu sai và xem lại bài học rồi thử lại.${next ? ` Sau ${TRY_UNLOCK} lần làm, Phần ${next.no} sẽ tự mở để bạn không bị kẹt (bạn đã làm ${testTries(S, t)} lần).` : ''}`}</p>
      <div class="btns">
        ${pass && next ? `<button class="btn" data-act="part" data-arg="${next.id}">Sang Phần ${next.no}. ${esc(next.title)}</button>` : ''}
        ${pass && !next ? `<button class="btn" data-act="nav" data-arg="dash">Về tổng quan</button>` : ''}
        ${!pass ? `<button class="btn" data-act="starttest" data-arg="${t.id}">Làm lại bài kiểm tra</button>` : ''}
        ${(v.wrongIds || []).length ? `<button class="btn ghost" data-act="retrywrong">Làm lại ${v.wrongIds.length} câu sai này</button>` : ''}
        ${wrong ? `<button class="btn ghost" data-act="review">Ôn câu sai (${wrong})</button>` : ''}
        <button class="btn ghost" data-act="part" data-arg="${pt.id}">Quay lại Phần ${pt.no}</button>
      </div>
    </section></div>`;
}

/* ===================== HỎI ĐÁP ===================== */
function fillDrafts() { $app.querySelectorAll('textarea[data-draft]').forEach(t => { t.value = drafts[t.dataset.draft] || ''; }); }
function renderAsk() {
  const u = U(view.id), pt = u && partOf(u.id);
  if (!u || (pt && partLocked(pt))) return go({ name: 'lessons' });
  const mine = QA.filter(q => q.unit === u.id);
  const full = pendingQ() >= MAX_PENDING;
  $app.innerHTML = `
    <div class="narrow">
    <button class="back" data-act="unit" data-arg="${u.id}">Quay lại bài học</button>
    <h1 class="h1">Hỏi giáo viên</h1>
    <p class="lead">Bài: <b>${esc(u.title)}</b>. Hãy viết rõ chỗ bạn chưa hiểu, ví dụ nêu câu hoặc quy tắc cụ thể. Giáo viên sẽ trả lời trong mục Hỏi đáp.</p>
    <section class="sec">
      ${full ? `<div class="err">Bạn đang có ${MAX_PENDING} câu hỏi chưa được trả lời. Hãy chờ giáo viên trả lời rồi hỏi tiếp.</div>` : ''}
      <label class="fld"><span>Câu hỏi của bạn</span>
        <textarea class="code" data-draft="ask:${u.id}" id="qText" maxlength="1000" rows="5" placeholder="Ví dụ: Em chưa hiểu vì sao câu ... lại dùng ..."></textarea></label>
      <p class="muted sm" id="qCount" style="margin:0 0 4px">0/1000 ký tự</p>
      <div class="btns"><button class="btn" data-act="sendq" data-arg="${u.id}" ${full ? 'disabled' : ''}>Gửi cho giáo viên</button></div>
    </section>
    ${mine.length ? `<section class="sec"><h3>Câu hỏi trước đây về bài này</h3>${mine.map(q => qCard(q, false)).join('')}</section>` : ''}
    </div>`;
  fillDrafts();
  $('#qCount').textContent = ($('#qText').value.length) + '/1000 ký tự';
}
function qCard(q, fresh) {
  return `<div class="qa-i${fresh ? ' new' : ''}">
    <div class="qa-h"><b>${esc(q.unitTitle)}${fresh ? ' <i class="chip">Mới</i>' : ''}</b><span class="muted sm">${fmtTime(q.created)}</span></div>
    <p class="qa-q">${esc(q.text)}</p>
    ${q.reply ? `<div class="qa-a"><small>Giáo viên trả lời, ${fmtTime(q.replied)}</small><p>${esc(q.reply)}</p></div>` : '<p class="muted sm" style="margin:0">Đang chờ giáo viên trả lời.</p>'}
  </div>`;
}
async function submitQuestion(unitId) {
  const u = U(unitId), ta = $('#qText');
  if (!u || !ta) return;
  const text = ta.value.trim();
  if (!text) return toast('Hãy viết câu hỏi trước khi gửi.');
  if (text.length > 1000) return toast('Câu hỏi quá dài (tối đa 1000 ký tự).');
  if (pendingQ() >= MAX_PENDING) return toast(`Bạn đang có ${MAX_PENDING} câu hỏi chưa được trả lời. Hãy chờ giáo viên trả lời rồi hỏi tiếp.`, 5000);
  const btn = $('[data-act="sendq"]'); if (btn) btn.disabled = true;
  try {
    await Backend.addQuestion({ uid: ME.uid, user: ME.user, unit: u.id, unitTitle: u.title, text, created: Backend.stamp(), reply: '', replied: null, seenByAdmin: false, seenByStudent: true });
    delete drafts['ask:' + u.id];
    toast('Đã gửi câu hỏi cho giáo viên.');
    go({ name: 'qa' });
  } catch (e) {
    if (btn) btn.disabled = false;
    toast('Chưa gửi được câu hỏi. Hãy kiểm tra mạng, hoặc báo giáo viên cập nhật quy tắc Firestore.', 7000);
  }
}
function renderQA() {
  /* câu trả lời mới hiện nhãn "Mới", kể cả khi nó đến lúc học viên đang mở sẵn trang này */
  const fresh = new Set(view.fresh || []);
  QA.forEach(q => { if (q.reply && !q.seenByStudent) fresh.add(q.id); });
  view.fresh = [...fresh];
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Hỏi đáp</h1>
    <p class="lead">Các câu hỏi bạn đã gửi cho giáo viên và câu trả lời. Để hỏi thêm, mở một bài học và bấm Hỏi giáo viên ở cuối bài.</p>
    ${QA.length ? QA.map(q => qCard(q, fresh.has(q.id))).join('')
      : '<div class="empty"><h3>Bạn chưa đặt câu hỏi nào</h3><p class="muted">Mở một bài học, kéo xuống cuối bài và bấm Hỏi giáo viên.</p><div class="btns"><button class="btn" data-act="nav" data-arg="lessons">Đến danh sách bài</button></div></div>'}
    </div>`;
  /* mở trang là coi như đã đọc các câu trả lời mới */
  QA.forEach(q => { if (q.reply && !q.seenByStudent) { q.seenByStudent = true; Promise.resolve(Backend.updateQuestion(q.id, { seenByStudent: true })).catch(() => {}); } });
  renderNav();
}

/* Giáo viên: danh sách câu hỏi từ học viên */
function adminQCard(q, open) {
  return `<div class="qa-i">
    <div class="qa-h"><b>${esc(nameOf(q.user))}, ${esc(q.unitTitle)}</b><span class="muted sm">${fmtTime(q.created)}</span></div>
    <p class="qa-q">${esc(q.text)}</p>
    ${open ? `
      <textarea class="code" data-draft="reply:${esc(q.id)}" maxlength="2000" rows="3" placeholder="Viết câu trả lời cho học viên"></textarea>
      <div class="btns"><button class="btn small" data-act="replyq" data-arg="${esc(q.id)}">Gửi trả lời</button>
        ${q.unit ? `<button class="btn ghost small" data-act="unit" data-arg="${q.unit}">Xem bài</button>` : ''}</div>`
    : `<div class="qa-a"><small>Bạn đã trả lời, ${fmtTime(q.replied)}</small><p>${esc(q.reply)}</p></div>`}
  </div>`;
}
function renderQuestions() {
  const tab = view.tab === 'done' ? 'done' : 'open';
  const open = QA.filter(q => !q.reply), done = QA.filter(q => q.reply);
  const list = tab === 'open' ? open : done;
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Câu hỏi từ học viên</h1>
    <p class="lead">Học viên đặt câu hỏi ở cuối mỗi bài học. Trả lời tại đây, học viên sẽ được báo khi mở app.</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="${tab === 'open'}" data-act="qtab" data-arg="open">Chưa trả lời (${open.length})</button>
      <button class="tab" role="tab" aria-selected="${tab === 'done'}" data-act="qtab" data-arg="done">Đã trả lời (${done.length})</button>
    </div>
    ${list.length ? list.map(q => adminQCard(q, tab === 'open')).join('')
      : `<div class="empty"><h3>${tab === 'open' ? 'Không có câu hỏi nào đang chờ' : 'Chưa có câu hỏi nào được trả lời'}</h3></div>`}
    </div>`;
  fillDrafts();
}
async function sendReply(id) {
  const ta = [...$app.querySelectorAll('textarea[data-draft]')].find(t => t.dataset.draft === 'reply:' + id);
  const text = ta ? ta.value.trim() : '';
  if (!text) return toast('Hãy viết câu trả lời trước khi gửi.');
  if (text.length > 2000) return toast('Câu trả lời quá dài (tối đa 2000 ký tự).');
  try {
    await Backend.updateQuestion(id, { reply: text, replied: Backend.stamp(), seenByAdmin: true, seenByStudent: false });
    delete drafts['reply:' + id];
    toast('Đã gửi trả lời cho học viên.');
  } catch (e) { toast('Chưa gửi được trả lời. Hãy kiểm tra mạng và quy tắc Firestore.', 6000); }
}
function pendingCardHTML() {
  const p = QA.filter(q => !q.reply);
  return `<section class="sec hl"><h3>Câu hỏi từ học viên</h3>
    ${p.length ? `<p>Có <b>${p.length}</b> câu hỏi chưa trả lời.</p>
      ${p.slice(0, 3).map(q => `<div class="wq">${esc(q.text.length > 110 ? q.text.slice(0, 110) + '...' : q.text)}<small>${esc(nameOf(q.user))}, ${esc(q.unitTitle)}</small></div>`).join('')}`
    : '<p class="muted">Không có câu hỏi nào đang chờ trả lời.</p>'}
    <div class="btns"><button class="btn${p.length ? '' : ' ghost'}" data-act="nav" data-arg="questions">${p.length ? 'Trả lời ngay' : 'Xem tất cả câu hỏi'}</button></div></section>`;
}

/* ===================== GIÁO VIÊN: HỌC VIÊN ===================== */
function renderStudents() {
  const R = rosterArr();
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Học viên</h1>
    <p class="lead">Chọn một học viên để xem tiến trình học và các câu đang sai.</p>
    ${pendingCardHTML()}
    ${R.map(r => {
      const s = stats(r.p);
      return `<button class="srow" data-act="viewstudent" data-arg="${esc(r.u)}">
        <span class="srow-h"><b>${esc(r.n)}</b></span>
        <small>${r.seen ? `${s.done}/${s.total} bài hoàn thành, ${s.wrong} câu đang sai` : 'Chưa đăng nhập lần nào'}</small>
      </button>`;
    }).join('')}
    ${Backend.mode === 'preview' ? '<div class="btns"><button class="btn ghost" data-act="seeddemo">Nạp dữ liệu mẫu để xem thử</button></div>' : ''}
    </div>`;
}
function renderStudentDetail() {
  const r = ROSTER[view.key];
  if (!r) return go({ name: 'students' });
  const nw = r.p.wrong.length;
  $app.innerHTML = `
    <div class="narrow">
    <button class="back" data-act="nav" data-arg="students">Quay lại danh sách học viên</button>
    <h1 class="h1">${esc(r.n)}</h1>
    <p class="lead">Tên đăng nhập ${esc(r.u)}${r.seen ? '' : '. Học viên này chưa đăng nhập lần nào.'}</p>
    <section class="sec">${calendarHTML(r.p.days, true)}</section>
    <section class="sec"><h3>Tiến trình học</h3>${progressChart(r.p)}</section>
    <section class="sec"><h3>Câu đang sai${nw ? ' (' + nw + ')' : ''}</h3>${wrongList(r.p)}</section>
    </div>`;
}

/* ===================== TÀI KHOẢN ===================== */
function permText() {
  if (!('Notification' in window)) return 'Trình duyệt này không hỗ trợ thông báo hệ thống. Bạn vẫn nhận thông báo ngay trong trang.';
  if (Notification.permission === 'denied') return 'Trình duyệt đang chặn thông báo của trang này. Hãy bật lại trong cài đặt trang web của trình duyệt.';
  return 'Hiện thông báo của hệ thống khi app đang chạy ngầm trong trình duyệt. Trên điện thoại có thể không hiện, nhưng thông báo trong trang vẫn hoạt động.';
}
function renderAccount() {
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Tài khoản</h1>
    <p class="lead">Thông tin đăng nhập của bạn.</p>
    <section class="sec"><h3>Thông tin</h3>
      <dl class="kv">
        <div><dt>Họ tên</dt><dd>${esc(ME.name)}</dd></div>
        <div><dt>Tên đăng nhập</dt><dd>${esc(ME.user)}</dd></div>
        <div><dt>Loại tài khoản</dt><dd>${ME.role === 'admin' ? 'Giáo viên' : 'Học viên'}</dd></div>
      </dl></section>
    <section class="sec"><h3>Thông báo</h3>
      ${ME.role === 'student' ? `
      <label class="swrow"><span><b>Nhắc học bài mỗi ngày</b><small>Đến giờ đã đặt mà hôm nay bạn chưa học thì app nhắc một lần. Nhắc học chỉ hiện khi trang Easy Grammar đang mở trong trình duyệt.</small></span>
        <input type="checkbox" role="switch" class="sw" data-set="remind" ${SET.remind ? 'checked' : ''}></label>
      <div class="swrow"><span><b>Giờ nhắc</b></span><input type="time" class="timeinp" data-settime="remindTime" value="${esc(SET.remindTime)}"></div>
      <label class="swrow"><span><b>Báo khi giáo viên trả lời</b><small>Hiện thông báo ngay khi giáo viên trả lời câu hỏi của bạn.</small></span>
        <input type="checkbox" role="switch" class="sw" data-set="notifyReply" ${SET.notifyReply ? 'checked' : ''}></label>`
      : `
      <label class="swrow"><span><b>Báo khi có câu hỏi mới</b><small>Hiện thông báo ngay khi có học viên đặt câu hỏi, lúc bạn đang mở app.</small></span>
        <input type="checkbox" role="switch" class="sw" data-set="notifyQuestion" ${SET.notifyQuestion ? 'checked' : ''}></label>`}
      <label class="swrow"><span><b>Thông báo của trình duyệt</b><small>${esc(permText())}</small></span>
        <input type="checkbox" role="switch" class="sw" data-set="browser" ${SET.browser && 'Notification' in window && Notification.permission === 'granted' ? 'checked' : ''}></label>
      <p class="muted sm" style="margin:10px 0 0">Cài đặt này lưu trên thiết bị đang dùng. Thông báo chỉ hoạt động khi app đang mở trong trình duyệt.</p>
    </section>
    <section class="sec"><h3>Phiên đăng nhập</h3>
      <div class="btns" style="margin-top:0"><button class="btn ghost" data-act="logout">Đăng xuất</button></div></section>
    </div>`;
}

/* ===================== SỰ KIỆN ===================== */
document.addEventListener('click', e => {
  if (e.target.closest('#toast') && toastTo) { const to = toastTo; $('#toast').hidden = true; toastTo = null; go(to); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  switch (a) {
    case 'theme': cycleTheme(); break;
    case 'fs': cycleFs(); break;
    case 'logout': doLogout(); break;
    case 'previewlogin': Backend.previewLogin(arg); break;
    case 'seeddemo': Backend.seedDemo(); toast('Đã nạp dữ liệu mẫu cho 2 học viên'); break;
    case 'nav': go({ name: arg }); break;
    case 'part': go({ name: 'part', id: arg }); break;
    case 'ask': go({ name: 'ask', id: arg }); break;
    case 'sendq': submitQuestion(arg); break;
    case 'replyq': sendReply(arg); break;
    case 'qtab': go({ name: 'questions', tab: arg }); break;
    case 'unit': markStudied(); cardI = 0; cardFlip = false; go({ name: 'unit', id: arg, tab: 'learn' }); break;
    case 'calprev': calMonth = shiftMonth(calMonth, -1); render(); break;
    case 'calnext': calMonth = shiftMonth(calMonth, 1); render(); break;
    case 'tab': go({ name: 'unit', id: view.name === 'result' ? view.refId : view.id, tab: arg }); break;
    case 'startquiz': startQuiz('unit', view.name === 'result' ? view.refId : view.id); break;
    case 'starttest': startQuiz('test', arg); break;
    case 'review': startQuiz('review'); break;
    case 'pick': pick(+arg); break;
    case 'nextq': nextQ(); break;
    case 'quit':
      if (confirm('Thoát? Các câu đã trả lời vẫn được lưu và bạn có thể làm tiếp sau.')) {
        saveResume(); doSave();
        const v = view;
        const pt = v.mode === 'unit' ? partOf(v.refId) : v.mode === 'test' ? testPart(TESTS.find(t => t.id === v.refId)) : null;
        go(pt ? { name: 'part', id: pt.id } : { name: ME.role === 'admin' ? 'students' : 'review' });
      }
      break;
    case 'gounit': {
      const gu = U(arg), gp = gu && partOf(gu.id);
      if (gu && !(gp && partLocked(gp))) { markStudied(); go({ name: 'unit', id: arg, tab: 'learn' }); }
      else toast('Bài này thuộc phần chưa mở khóa');
      break;
    }
    case 'retrywrong': startQuiz('retry', view.refId, view.wrongIds || []); break;
    case 'resume': doResume(); break;
    case 'dropresume': clearResume(); toast('Đã bỏ bài làm dở'); render(); break;
    case 'refopen': refOpen = (refOpen === arg ? null : arg); render(); break;
    case 'cardflip': cardFlip = !cardFlip; render(); break;
    case 'cardnext': cardI++; cardFlip = false; render(); break;
    case 'cardprev': cardI = Math.max(0, cardI - 1); cardFlip = false; render(); break;
    case 'viewstudent': calMonth = day().slice(0, 7); go({ name: 'student', key: arg }); break;
  }
});
/* lưu nội dung đang gõ dở */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.draft) {
    drafts[t.dataset.draft] = t.value;
    if (t.id === 'qText') $('#qCount').textContent = t.value.length + '/1000 ký tự';
  }
});
/* công tắc cài đặt thông báo */
document.addEventListener('change', async e => {
  const t = e.target;
  if (!SET || !t.dataset) return;
  if (t.dataset.set) {
    const key = t.dataset.set;
    if (key === 'browser') {
      if (t.checked) {
        if (!('Notification' in window)) { t.checked = false; return toast('Trình duyệt này không hỗ trợ thông báo hệ thống.'); }
        let p = Notification.permission;
        if (p === 'default') { try { p = await Notification.requestPermission(); } catch (_) {} }
        if (p !== 'granted') { t.checked = false; SET.browser = false; saveSettings(); return toast('Chưa được cấp quyền thông báo. Hãy cho phép trong cài đặt trình duyệt.', 5000); }
      }
      SET.browser = t.checked;
    } else SET[key] = t.checked;
    saveSettings();
    if (key === 'remind') { SET.lastRemind = ''; saveSettings(); }
  } else if (t.dataset.settime && /^\d{2}:\d{2}$/.test(t.value)) {
    SET[t.dataset.settime] = t.value; SET.lastRemind = ''; saveSettings();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'login') doLogin(e.target);
});

/* ===================== KHỞI ĐỘNG ===================== */
if (CONFIGURED && typeof firebase === 'undefined') {
  bootError = 'Không tải được Firebase. Hãy kiểm tra kết nối mạng rồi tải lại trang.';
} else {
  try { Backend.init(onAuth); }
  catch (e) { bootError = 'Cấu hình Firebase chưa đúng. Hãy kiểm tra lại FIREBASE_CONFIG.'; }
}
render();
</script>
</body>
</html>
