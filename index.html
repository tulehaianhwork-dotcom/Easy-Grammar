of students are absent today.", "lv": 0}, {"t": "p", "text": "Lỗi thường gặp:", "lv": 0}, {"t": "p", "text": "Sai: The number of cars have risen sharply.", "lv": 0}, {"t": "p", "text": "Đúng: The number of cars has risen sharply.", "lv": 0}]}, {"t": "h", "lv": 3, "text": "“One of” và lượng"}, {"t": "box", "label": "QUY TẮC", "items": [{"t": "p", "text": "Quy tắc: “One of + N số nhiều” → động từ số ít. Lượng tiền, thời gian, khoảng cách xem như một khối → số ít.", "lv": 0}, {"t": "li", "text": "One of my friends is moving to Canada.", "lv": 0}, {"t": "li", "text": "Ten dollars is not enough to buy the book.", "lv": 0}, {"t": "p", "text": "Lỗi thường gặp:", "lv": 0}, {"t": "p", "text": "Sai: One of the main reasons are cost.", "lv": 0}, {"t": "p", "text": "Đúng: One of the main reasons is cost.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Chiến lược nhận diện và sửa lỗi"}, {"t": "tbl", "rows": [["Bước", "Cách làm", "Ví dụ"], ["1. Tìm chủ ngữ chính", "Bỏ qua cụm chen ngang, mệnh đề bổ nghĩa", "The basket of fruits is on the table. → chủ ngữ chính: The basket"], ["2. Xác định số ít/số nhiều", "Danh từ không đếm được, đại từ bất định → số ít", "Each of the players has a unique skill. → chủ ngữ: Each"], ["3. Chia động từ phù hợp", "Lưu ý các ngoại lệ và ngữ cảnh", "The students who participated in the contest deserve praise. → chủ ngữ: The students"], ["4. Kiểm tra từng mệnh đề", "Trong câu phức, mỗi động từ phải khớp với chủ ngữ của mệnh đề chứa nó", "The coach, along with his assistants, is planning the strategy."]]}], "quiz": [{"t": "Two-thirds of the students ___ present.", "o": ["is", "are", "was", "has been"], "a": 1, "e": "Theo danh từ sau of: the students (số nhiều)."}, {"t": "Fifty percent of the work ___ completed.", "o": ["are", "is", "were", "have been"], "a": 1, "e": "Theo danh từ sau of: the work (không đếm được, số ít)."}, {"t": "Mathematics ___ my favorite subject.", "o": ["are", "is", "were", "be"], "a": 1, "e": "Môn học tận cùng -ics đi với động từ số ít."}, {"t": "Neither the manager nor the employees ___ to work overtime.", "o": ["wants", "want", "is wanting", "has wanted"], "a": 1, "e": "Chia theo chủ ngữ gần nhất: the employees (số nhiều)."}, {"t": "The number of cars ___ risen sharply.", "o": ["have", "has", "are", "were"], "a": 1, "e": "The number of dùng động từ số ít."}, {"t": "One of the main reasons ___ cost.", "o": ["are", "is", "were", "have been"], "a": 1, "e": "One of + N số nhiều dùng động từ số ít."}]}, {"id": "u9", "title": "Mệnh đề và bốn kiểu câu", "desc": "Mệnh đề độc lập, mệnh đề phụ thuộc và bốn kiểu câu.", "blocks": [{"t": "p", "text": "Phần này đi từ câu đơn giản nhất đến câu ghép phức."}, {"t": "h", "lv": 2, "text": "Mệnh đề độc lập và mệnh đề phụ thuộc"}, {"t": "p", "text": "Mệnh đề (clause) là một nhóm từ có chủ ngữ và động từ. Mệnh đề được chia thành hai loại:"}, {"t": "tbl", "rows": [["Loại mệnh đề", "Đặc điểm", "Ví dụ"], ["Mệnh đề độc lập (Independent Clause)", "Diễn đạt ý hoàn chỉnh, đứng riêng được như một câu", "She reads books."], ["Mệnh đề phụ thuộc (Dependent Clause)", "Không đứng riêng được, phải gắn với mệnh đề độc lập; thường mở đầu bằng liên từ phụ thuộc hoặc đại từ quan hệ", "because she loves stories"]]}, {"t": "h", "lv": 2, "text": "Tổng quan bốn kiểu câu"}, {"t": "tbl", "rows": [["Kiểu câu", "Thành phần", "Ví dụ"], ["Câu đơn (Simple)", "1 mệnh đề độc lập", "She reads books."], ["Câu ghép (Compound)", "≥ 2 mệnh đề độc lập", "She reads books, and he writes poems."], ["Câu phức (Complex)", "1 mệnh đề độc lập + ≥ 1 mệnh đề phụ thuộc", "She reads books because she loves stories."], ["Câu ghép phức (Compound-Complex)", "≥ 2 mệnh đề độc lập + ≥ 1 mệnh đề phụ thuộc", "Although I was tired, I finished my work, and I went to bed."]]}], "quiz": [{"t": "Nhóm từ nào dưới đây là mệnh đề độc lập?", "o": ["because she loves stories", "She reads books", "when he arrived", "although it rained"], "a": 1, "e": "She reads books có chủ ngữ, động từ và diễn đạt ý hoàn chỉnh. Ba nhóm còn lại mở đầu bằng liên từ phụ thuộc nên không đứng riêng được."}, {"t": "She reads books because she loves stories. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 2, "e": "Có 1 mệnh đề độc lập (She reads books) và 1 mệnh đề phụ thuộc (because she loves stories) nên là câu phức."}, {"t": "She reads books, and he writes poems. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 1, "e": "Hai mệnh đề độc lập nối bằng and, không có mệnh đề phụ thuộc nên là câu ghép."}, {"t": "Although I was tired, I finished my work, and I went to bed. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 3, "e": "Có 2 mệnh đề độc lập (I finished my work; I went to bed) và 1 mệnh đề phụ thuộc (Although I was tired)."}, {"t": "Câu nào dưới đây là câu thiếu, chưa có mệnh đề chính?", "o": ["While driving to work, she listened to the radio.", "While driving to work.", "She listened to the radio while driving.", "She was driving to work."], "a": 1, "e": "While driving to work là mệnh đề phụ thuộc đứng một mình nên chưa thành câu hoàn chỉnh."}, {"t": "The dog barked loudly. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 0, "e": "Chỉ có 1 mệnh đề độc lập (chủ ngữ the dog, động từ barked) nên là câu đơn."}]}, {"id": "u10", "title": "Câu đơn: chủ ngữ ghép và vị ngữ ghép", "desc": "Câu đơn, chủ ngữ ghép và vị ngữ ghép.", "blocks": [{"t": "h", "lv": 2, "text": "Câu đơn (Simple Sentences)"}, {"t": "p", "text": "Câu đơn chứa một mệnh đề độc lập, tức là chỉ có một chủ ngữ và một động từ, còn tân ngữ có thể có hoặc không."}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Subject (Chủ ngữ) + Verb (Động từ) + (Object – Tân ngữ) + (Trạng ngữ)", "lv": 0}]}, {"t": "tbl", "rows": [["Câu", "Nghĩa", "Chủ ngữ", "Động từ", "Thành phần khác"], ["She writes.", "Cô ấy viết.", "She", "writes", "—"], ["The dog barked loudly.", "Con chó sủa to.", "The dog", "barked", "Trạng từ: loudly"], ["They played basketball after school.", "Họ chơi bóng rổ sau giờ học.", "They", "played", "Tân ngữ: basketball; Trạng ngữ: after school"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Luôn xác định được chủ ngữ và động từ chính của câu.", "lv": 0}, {"t": "p", "text": "Đảm bảo câu truyền đạt một ý nghĩa hoàn chỉnh.", "lv": 0}]}, {"t": "h", "lv": 3, "text": "Chủ ngữ ghép và vị ngữ ghép"}, {"t": "p", "text": "Câu đơn vẫn có thể chứa nhiều chủ ngữ hoặc nhiều động từ, miễn là chỉ có một mệnh đề."}, {"t": "tbl", "rows": [["Dạng", "Đặc điểm", "Ví dụ"], ["Chủ ngữ ghép (Compound Subject)", "Hai hoặc nhiều chủ ngữ dùng chung một động từ", "John and Mary went to the store. (John và Mary đã đi đến cửa hàng.)"], ["Vị ngữ ghép (Compound Predicate)", "Hai hoặc nhiều động từ dùng chung một chủ ngữ", "She danced and sang at the concert. (Cô ấy đã nhảy và hát tại buổi hòa nhạc.)"], ["Cả hai đều ghép", "Chủ ngữ ghép + vị ngữ ghép", "Tom and Jerry ran and hid when they saw the cat. (Tom và Jerry đã chạy và trốn khi thấy con mèo.)"]]}], "quiz": [{"t": "Câu nào là câu đơn?", "o": ["She reads books, and he writes poems.", "She danced and sang at the concert.", "She stayed home because she was ill.", "Although it rained, they went out."], "a": 1, "e": "Chỉ có một chủ ngữ she và hai động từ danced, sang nên là một mệnh đề (vị ngữ ghép)."}, {"t": "John and Mary went to the store. Câu này có gì đặc biệt?", "o": ["Chủ ngữ ghép", "Vị ngữ ghép", "Mệnh đề phụ thuộc", "Hai mệnh đề độc lập"], "a": 0, "e": "John and Mary là hai chủ ngữ dùng chung động từ went."}, {"t": "She danced and sang at the concert. Câu này có gì đặc biệt?", "o": ["Chủ ngữ ghép", "Vị ngữ ghép", "Mệnh đề phụ thuộc", "Hai mệnh đề độc lập"], "a": 1, "e": "Danced và sang là hai động từ dùng chung chủ ngữ she."}, {"t": "Tom and Jerry ran and hid. Đây là kiểu câu nào?", "o": ["Câu đơn có cả chủ ngữ ghép và vị ngữ ghép", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 0, "e": "Chỉ có một mệnh đề, với hai chủ ngữ và hai động từ."}, {"t": "Chọn câu đơn.", "o": ["They played basketball after school.", "They played basketball, and we watched.", "They played basketball because it was sunny.", "When they played basketball, we watched."], "a": 0, "e": "Chỉ có một chủ ngữ they và một động từ played. After school chỉ là trạng ngữ."}, {"t": "Chủ ngữ và động từ chính của câu The dog barked loudly lần lượt là gì?", "o": ["dog, loudly", "The dog, barked", "barked, The dog", "loudly, barked"], "a": 1, "e": "The dog là chủ ngữ, barked là động từ chính, loudly là trạng từ."}]}, {"id": "u11", "title": "Câu ghép: FANBOYS và dấu chấm phẩy", "desc": "Câu ghép: các liên từ kết hợp, dấu phẩy và dấu chấm phẩy.", "blocks": [{"t": "h", "lv": 2, "text": "Câu ghép (Compound Sentences)"}, {"t": "p", "text": "Câu ghép kết hợp hai hoặc nhiều mệnh đề độc lập; các mệnh đề này thường được nối bằng liên từ kết hợp (coordinating conjunctions) hoặc dấu chấm phẩy."}, {"t": "tbl", "rows": [["Liên từ (FANBOYS)", "Nghĩa", "Quan hệ ý", "Ví dụ"], ["For", "vì", "Nguyên nhân", "He stayed home, for he was ill."], ["And", "và", "Bổ sung", "She loves reading, and he enjoys writing."], ["Nor", "cũng không", "Phủ định bổ sung", "He doesn’t smoke, nor does he drink."], ["But", "nhưng", "Đối lập", "I wanted to go for a walk, but it started to rain."], ["Or", "hoặc", "Lựa chọn", "Hurry up, or you will miss the bus."], ["Yet", "nhưng mà, tuy vậy", "Đối lập bất ngờ", "He is rich, yet he is unhappy."], ["So", "vì vậy", "Kết quả", "He studies hard, so he gets good grades."]]}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Independent Clause + , + Coordinating Conjunction + Independent Clause", "lv": 0}, {"t": "p", "text": "Independent Clause + ; + Independent Clause", "lv": 0}, {"t": "p", "text": "Independent Clause + ; + however/therefore/moreover + , + Independent Clause", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I wanted to go for a walk, but it started to rain. (Tôi muốn đi dạo nhưng trời bắt đầu mưa.)", "lv": 0}, {"t": "li", "text": "Mệnh đề 1: I wanted to go for a walk | Liên từ: but | Mệnh đề 2: it started to rain", "lv": 1}, {"t": "p", "text": "She loves reading, and he enjoys writing. (Cô ấy thích đọc sách còn anh ấy thích viết.)", "lv": 0}, {"t": "p", "text": "The rent is high; however, the location is excellent.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Đặt dấu phẩy trước liên từ kết hợp khi nối hai mệnh đề độc lập.", "lv": 0}, {"t": "p", "text": "Không dùng dấu phẩy khi chỉ nối hai từ hoặc cụm từ đơn lẻ: I like coffee and tea.", "lv": 0}, {"t": "p", "text": "Không nối hai mệnh đề độc lập chỉ bằng dấu phẩy (lỗi comma splice). Sai: It was late, we went home. Đúng: It was late, so we went home.", "lv": 0}]}], "quiz": [{"t": "It was late, ___ we went home.", "o": ["but", "so", "or", "nor"], "a": 1, "e": "Về muộn là nguyên nhân, đi về là kết quả nên dùng so."}, {"t": "I wanted to go for a walk, ___ it started to rain.", "o": ["so", "or", "but", "nor"], "a": 2, "e": "Muốn đi dạo nhưng trời mưa là hai ý đối lập nên dùng but."}, {"t": "Chọn câu đúng.", "o": ["It was late, we went home.", "It was late, so we went home.", "It was late so, we went home.", "It was late; so, we went home."], "a": 1, "e": "Nối hai mệnh đề độc lập cần liên từ kết hợp sau dấu phẩy. Chỉ dùng dấu phẩy là lỗi comma splice."}, {"t": "The rent is high; ___, the location is excellent.", "o": ["however", "because", "and", "so that"], "a": 0, "e": "Sau dấu chấm phẩy dùng however (tuy nhiên) rồi dấu phẩy để nối hai ý đối lập."}, {"t": "Liên từ nào trong FANBOYS chỉ nguyên nhân?", "o": ["for", "yet", "or", "nor"], "a": 0, "e": "For nghĩa là vì, giới thiệu nguyên nhân: He stayed home, for he was ill."}, {"t": "Câu nào dùng dấu phẩy sai?", "o": ["I like coffee, and tea.", "He stayed home, for he was ill.", "She loves reading, and he enjoys writing.", "He is rich, yet he is unhappy."], "a": 0, "e": "Chỉ nối hai danh từ coffee và tea nên không dùng dấu phẩy: I like coffee and tea."}]}, {"id": "u12", "title": "Câu phức và câu ghép phức", "desc": "Câu phức, liên từ phụ thuộc và câu ghép phức.", "blocks": [{"t": "h", "lv": 2, "text": "Câu phức (Complex Sentences)"}, {"t": "p", "text": "Câu phức gồm một mệnh đề độc lập và ít nhất một mệnh đề phụ thuộc. Mệnh đề phụ thuộc thường được mở đầu bằng liên từ phụ thuộc (subordinating conjunctions)."}, {"t": "tbl", "rows": [["Chức năng", "Liên từ phụ thuộc"], ["Thời gian (Time)", "when, while, before, after, since, until, as soon as"], ["Nguyên nhân (Reason)", "because, since, as"], ["Đối lập, nhượng bộ (Concession)", "although, though, even though"], ["Điều kiện (Condition)", "if, unless, provided that"], ["Mục đích (Purpose)", "so that, in order that"], ["Kết quả (Result)", "so … that, such … that"], ["Cách thức (Manner)", "as if, as though"]]}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Mệnh đề phụ thuộc , mệnh đề độc lập. → có dấu phẩy", "lv": 0}, {"t": "p", "text": "Mệnh đề độc lập + mệnh đề phụ thuộc. → không cần dấu phẩy", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "Because it was raining, we canceled the picnic. (Vì trời mưa nên chúng tôi đã hủy buổi dã ngoại.)", "lv": 0}, {"t": "li", "text": "Mệnh đề phụ thuộc: Because it was raining | Mệnh đề độc lập: we canceled the picnic", "lv": 1}, {"t": "p", "text": "If you study hard, you will pass the exam. (Nếu học chăm chỉ thì bạn sẽ vượt qua kỳ thi.)", "lv": 0}, {"t": "p", "text": "We canceled the picnic because it was raining. (không có dấu phẩy)", "lv": 0}]}, {"t": "p", "text": "Mệnh đề phụ thuộc trong câu phức có ba loại là mệnh đề danh từ, mệnh đề quan hệ và mệnh đề trạng ngữ. Các mệnh đề này được trình bày chi tiết ở Phần 3."}, {"t": "h", "lv": 2, "text": "Câu ghép phức (Compound-Complex Sentences)"}, {"t": "p", "text": "Câu ghép phức kết hợp câu ghép với câu phức, tức là có ít nhất hai mệnh đề độc lập và một hoặc nhiều mệnh đề phụ thuộc."}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "Although I was tired, I finished my work, and I went to bed. (Mặc dù mệt nhưng tôi đã làm xong công việc rồi đi ngủ.)", "lv": 0}, {"t": "li", "text": "Mệnh đề phụ thuộc: Although I was tired", "lv": 1}, {"t": "li", "text": "Mệnh đề độc lập 1: I finished my work", "lv": 1}, {"t": "li", "text": "Mệnh đề độc lập 2: I went to bed", "lv": 1}]}], "quiz": [{"t": "___ it was raining, we canceled the picnic.", "o": ["Because", "But", "So", "Or"], "a": 0, "e": "Mưa là nguyên nhân hủy buổi dã ngoại nên dùng because. But, so, or là liên từ kết hợp, không mở đầu mệnh đề phụ thuộc."}, {"t": "Chọn câu đúng về dấu phẩy.", "o": ["If you study hard you will pass the exam.", "If you study hard, you will pass the exam.", "If you study hard; you will pass the exam.", "If, you study hard you will pass the exam."], "a": 1, "e": "Mệnh đề phụ thuộc đứng trước thì cần dấu phẩy: If you study hard, you will pass."}, {"t": "Liên từ nào dưới đây chỉ sự nhượng bộ?", "o": ["because", "although", "unless", "until"], "a": 1, "e": "Although nghĩa là mặc dù, diễn tả nhượng bộ."}, {"t": "He was ___ tired that he fell asleep.", "o": ["so", "such", "too", "very"], "a": 0, "e": "Cấu trúc so + tính từ + that chỉ kết quả: so tired that."}, {"t": "Câu nào là câu ghép phức?", "o": ["Although I was tired, I finished my work, and I went to bed.", "She reads books because she loves stories.", "She reads books, and he writes poems.", "She reads books."], "a": 0, "e": "Có 2 mệnh đề độc lập và 1 mệnh đề phụ thuộc nên là câu ghép phức."}, {"t": "Liên từ phụ thuộc nào chỉ điều kiện?", "o": ["unless", "although", "while", "until"], "a": 0, "e": "Unless nghĩa là trừ khi (if ... not), diễn tả điều kiện."}]}, {"id": "u13", "title": "Dấu câu cơ bản và lỗi thường gặp", "desc": "Dấu câu cơ bản và các lỗi thường gặp về kiểu câu và dấu câu.", "blocks": [{"t": "h", "lv": 2, "text": "Dấu câu cơ bản (Basic Punctuation)"}, {"t": "p", "text": "Dấu câu giúp câu văn rõ ràng và dễ hiểu hơn."}, {"t": "tbl", "rows": [["Dấu câu", "Chức năng", "Ví dụ"], ["Dấu chấm ( . )", "Kết thúc câu trần thuật", "She is my teacher."], ["Dấu chấm hỏi ( ? )", "Kết thúc câu hỏi", "Where are you going?"], ["Dấu chấm than ( ! )", "Kết thúc câu cảm thán hoặc mệnh lệnh mạnh", "Watch out!"], ["Dấu phẩy ( , )", "Phân tách các mục trong danh sách; ngăn cách mệnh đề phụ thuộc hoặc cụm từ mở đầu", "I bought apples, oranges, and bananas./After the movie, we went to dinner."], ["Dấu chấm phẩy ( ; )", "Nối hai mệnh đề độc lập có liên quan chặt chẽ", "The rent is high; the location is excellent."]]}, {"t": "box", "label": "LƯU Ý | Dấu phẩy Oxford", "items": [{"t": "p", "text": "Dấu phẩy Oxford (Oxford Comma) là dấu phẩy đặt trước “and” trong danh sách từ ba mục trở lên.", "lv": 0}, {"t": "li", "text": "Có dấu phẩy Oxford: I invited John, Mary, and Peter.", "lv": 1}, {"t": "li", "text": "Không có dấu phẩy Oxford: I invited John, Mary and Peter.", "lv": 1}, {"t": "p", "text": "Cả hai cách đều đúng, điều quan trọng là phải dùng nhất quán trong cùng một bài viết.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về kiểu câu và dấu câu"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Câu quá dài, rườm rà, khó hiểu", "lv": 0}, {"t": "p", "text": "Sai: She said that because she was tired and since she had a headache, she would not be able to attend the meeting, which was scheduled for the afternoon, even though it was important.", "lv": 0}, {"t": "p", "text": "Đúng: Because she was tired and had a headache, she said she couldn’t attend the important afternoon meeting.", "lv": 0}, {"t": "p", "text": "→ Câu quá dài và phức tạp nên được tách ra hoặc viết lại cho rõ ràng.", "lv": 0}, {"t": "p", "text": "Lỗi 2: Câu thiếu mệnh đề chính (sentence fragment)", "lv": 0}, {"t": "p", "text": "Sai: While driving to work.", "lv": 0}, {"t": "p", "text": "Đúng: While driving to work, she listened to the radio.", "lv": 0}, {"t": "p", "text": "→ Mệnh đề phụ thuộc cần kết hợp với mệnh đề chính để thành câu hoàn chỉnh.", "lv": 0}, {"t": "p", "text": "Lỗi 3: Thiếu dấu phẩy khi mệnh đề phụ đứng trước", "lv": 0}, {"t": "p", "text": "Sai: If you study hard you will pass the exam.", "lv": 0}, {"t": "p", "text": "Đúng: If you study hard, you will pass the exam.", "lv": 0}, {"t": "p", "text": "Lỗi 4: Thêm dấu phẩy không cần thiết", "lv": 0}, {"t": "p", "text": "Sai: She enjoys reading, and watching movies.", "lv": 0}, {"t": "p", "text": "Đúng: She enjoys reading and watching movies.", "lv": 0}, {"t": "p", "text": "→ Không cần dấu phẩy khi chỉ liệt kê hai đối tượng.", "lv": 0}]}], "quiz": [{"t": "Chọn câu đúng.", "o": ["She enjoys reading, and watching movies.", "She enjoys reading and watching movies.", "She enjoys, reading and watching movies.", "She enjoys reading and, watching movies."], "a": 1, "e": "Chỉ liệt kê hai đối tượng nên không cần dấu phẩy."}, {"t": "Dấu nào dùng để nối hai mệnh đề độc lập có liên quan chặt chẽ?", "o": ["dấu chấm phẩy (;)", "dấu chấm hỏi (?)", "dấu chấm than (!)", "dấu phẩy đơn (,)"], "a": 0, "e": "Dấu chấm phẩy nối hai mệnh đề độc lập liên quan chặt chẽ. Chỉ dùng dấu phẩy đơn sẽ thành lỗi comma splice."}, {"t": "Chọn câu đúng.", "o": ["After the movie; we went to dinner.", "After the movie, we went to dinner.", "After, the movie we went to dinner.", "After the movie we, went to dinner."], "a": 1, "e": "Cụm từ mở đầu được ngăn cách với mệnh đề chính bằng dấu phẩy."}, {"t": "I invited John, Mary, and Peter. Dấu phẩy trước and trong câu này gọi là gì?", "o": ["Dấu phẩy Oxford", "Dấu phẩy ngắt câu", "Comma splice", "Dấu chấm phẩy"], "a": 0, "e": "Dấu phẩy đặt trước and trong danh sách từ ba mục trở lên gọi là dấu phẩy Oxford."}, {"t": "Cách sửa nào làm cho While driving to work thành câu hoàn chỉnh?", "o": ["While driving to work, she listened to the radio.", "While driving to work, and.", "While, driving to work.", "While driving to work;"], "a": 0, "e": "Mệnh đề phụ thuộc cần gắn với mệnh đề chính: she listened to the radio."}, {"t": "Câu nào kết thúc bằng dấu câu dùng cho mệnh lệnh mạnh?", "o": ["Watch out!", "She is my teacher.", "Where are you going?", "I like coffee and tea."], "a": 0, "e": "Dấu chấm than dùng cho câu cảm thán hoặc mệnh lệnh mạnh."}]}, {"id": "u15", "title": "Mệnh đề quan hệ: who, whom, whose, which, that", "desc": "Mệnh đề quan hệ (tính ngữ), các từ quan hệ và lỗi thường gặp.", "blocks": [{"t": "h", "lv": 2, "text": "Mệnh đề quan hệ/tính ngữ (Relative/Adjective Clauses)"}, {"t": "p", "text": "Mệnh đề quan hệ bổ nghĩa cho danh từ hoặc đại từ đứng trước (gọi là antecedent) và giúp xác định hoặc mô tả rõ hơn đối tượng đó."}, {"t": "tbl", "rows": [["Từ quan hệ", "Thay cho", "Chức năng", "Ví dụ"], ["who", "Người", "Chủ ngữ (đôi khi tân ngữ)", "People who exercise regularly tend to be healthier."], ["whom", "Người", "Tân ngữ", "The man whom I met was kind."], ["whose", "Người/vật", "Sở hữu", "The girl whose bag was stolen called the police."], ["which", "Vật", "Chủ ngữ/tân ngữ", "The museum which was renovated is popular."], ["that", "Người/vật", "Chủ ngữ/tân ngữ (chỉ trong mệnh đề xác định)", "The book that you gave me is fascinating."], ["when/where/ why", "Thời gian/nơi chốn/lý do", "Trạng từ quan hệ", "The town where I grew up is small."]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "The book that you gave me is fascinating. (Cuốn sách mà bạn đưa tôi thật hấp dẫn.)", "lv": 0}, {"t": "li", "text": "Antecedent (danh từ được bổ nghĩa): The book | Mệnh đề quan hệ: that you gave me", "lv": 1}, {"t": "p", "text": "People who exercise regularly tend to be healthier. (Người tập thể dục thường xuyên thường khỏe mạnh hơn.)", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về mệnh đề"}, {"t": "h", "lv": 3, "text": "Lỗi về mệnh đề quan hệ"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Dùng sai đại từ quan hệ", "lv": 0}, {"t": "p", "text": "Sai: The man which lives next door is a doctor.", "lv": 0}, {"t": "p", "text": "Đúng: The man who lives next door is a doctor.", "lv": 0}, {"t": "p", "text": "→ “Who” dùng cho người, “which” dùng cho vật.", "lv": 0}, {"t": "p", "text": "Lỗi 2: Lược bỏ đại từ quan hệ khi nó làm chủ ngữ", "lv": 0}, {"t": "p", "text": "Sai: The man lives next door is a doctor.", "lv": 0}, {"t": "p", "text": "Đúng: The man who lives next door is a doctor.", "lv": 0}, {"t": "p", "text": "→ Chỉ được lược bỏ đại từ quan hệ khi nó làm tân ngữ trong mệnh đề xác định: The book (that) I bought yesterday is interesting. Khi nó làm chủ ngữ thì không được bỏ.", "lv": 0}, {"t": "p", "text": "Lỗi 3: Dùng “that” trong mệnh đề không xác định", "lv": 0}, {"t": "p", "text": "Sai: My brother, that lives in London, is a teacher.", "lv": 0}, {"t": "p", "text": "Đúng: My brother, who lives in London, is a teacher.", "lv": 0}, {"t": "p", "text": "→ Mệnh đề không xác định chỉ dùng who, whom, whose, which.", "lv": 0}]}], "quiz": [{"t": "The woman ___ lives next door is a lawyer.", "o": ["who", "which", "whose", "whom"], "a": 0, "e": "The woman là người, và từ quan hệ làm chủ ngữ của lives nên dùng who."}, {"t": "They visited the museum ___ was recently renovated.", "o": ["who", "which", "whom", "whose"], "a": 1, "e": "The museum là vật nên dùng which."}, {"t": "The girl ___ bag was stolen called the police.", "o": ["who", "which", "whose", "that"], "a": 2, "e": "Whose chỉ sự sở hữu: cái túi của cô gái."}, {"t": "The town ___ I grew up is small.", "o": ["which", "who", "where", "whose"], "a": 2, "e": "Where là trạng từ quan hệ chỉ nơi chốn."}, {"t": "Chọn câu đúng.", "o": ["The man lives next door is a doctor.", "The man who lives next door is a doctor.", "The man which lives next door is a doctor.", "The man whom lives next door is a doctor."], "a": 1, "e": "Đại từ quan hệ làm chủ ngữ không được bỏ, và dùng who cho người."}, {"t": "The reason ___ she failed is unknown.", "o": ["because", "why", "where", "whose"], "a": 1, "e": "Trạng từ quan hệ chỉ lý do là why."}]}, {"id": "u16", "title": "Mệnh đề xác định và không xác định", "desc": "Mệnh đề quan hệ xác định và không xác định.", "blocks": [{"t": "h", "lv": 2, "text": "Mệnh đề quan hệ/tính ngữ (Relative/Adjective Clauses)"}, {"t": "h", "lv": 3, "text": "Mệnh đề xác định và không xác định"}, {"t": "tbl", "rows": [["Tiêu chí", "Mệnh đề xác định (Defining/Restrictive)", "Mệnh đề không xác định (Non-defining/Non-restrictive)"], ["Vai trò", "Thông tin cần thiết để xác định danh từ", "Thông tin bổ sung, bỏ đi câu vẫn rõ nghĩa"], ["Dấu phẩy", "Không dùng", "Có dùng"], ["Dùng “that”?", "Được", "Không được"], ["Lược bỏ từ quan hệ?", "Được, khi nó làm tân ngữ", "Không được"], ["Ví dụ", "The book that is on the table is mine.", "My mother, who is a teacher, loves reading."]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "My brother who lives in Hanoi is a doctor. → mệnh đề xác định: người nói có nhiều anh/em trai, người sống ở Hà Nội là bác sĩ.", "lv": 0}, {"t": "p", "text": "My brother, who lives in Hanoi, is a doctor. → mệnh đề không xác định: người nói chỉ có một anh/em trai; việc sống ở Hà Nội chỉ là thông tin thêm.", "lv": 0}, {"t": "p", "text": "Dấu phẩy làm thay đổi nghĩa của câu, vì vậy cần cân nhắc kỹ.", "lv": 0}]}], "quiz": [{"t": "Chọn câu đúng.", "o": ["My brother, that lives in London, is a teacher.", "My brother, who lives in London, is a teacher.", "My brother who lives in London, is a teacher.", "My brother, who lives in London is a teacher."], "a": 1, "e": "Mệnh đề không xác định đặt giữa hai dấu phẩy và không dùng that."}, {"t": "My mother, who is a teacher, loves reading. Mệnh đề who is a teacher thuộc loại nào?", "o": ["Xác định", "Không xác định", "Mệnh đề danh từ", "Mệnh đề trạng ngữ"], "a": 1, "e": "Nó là thông tin thêm, đặt giữa hai dấu phẩy nên là mệnh đề không xác định."}, {"t": "My brother who lives in Hanoi is a doctor. Câu này gợi ý điều gì?", "o": ["Người nói chỉ có một anh em trai.", "Người nói có nhiều anh em trai.", "Người nói không có anh em trai.", "Anh ấy không sống ở Hà Nội."], "a": 1, "e": "Mệnh đề xác định giúp phân biệt người sống ở Hà Nội với các anh em khác."}, {"t": "Trong mệnh đề không xác định, từ nào KHÔNG được dùng?", "o": ["who", "which", "whose", "that"], "a": 3, "e": "Mệnh đề không xác định chỉ dùng who, whom, whose, which."}, {"t": "The book ___ is on the table is mine.", "o": ["that", "who", "whose", "whom"], "a": 0, "e": "Book là vật, mệnh đề xác định nên dùng that hoặc which."}, {"t": "Trong câu The man who lives next door is a doctor, vì sao không thể bỏ who?", "o": ["Vì who làm chủ ngữ", "Vì who làm tân ngữ", "Vì who là liên từ phụ thuộc", "Vì câu không có dấu phẩy"], "a": 0, "e": "Chỉ được bỏ đại từ quan hệ khi nó làm tân ngữ. Ở đây who là chủ ngữ của lives."}]}, {"id": "u17", "title": "Mệnh đề trạng ngữ", "desc": "Mệnh đề trạng ngữ, lỗi thường gặp và cách nhận diện, sửa lỗi mệnh đề.", "blocks": [{"t": "h", "lv": 2, "text": "Mệnh đề trạng ngữ (Adverbial Clauses)"}, {"t": "p", "text": "Mệnh đề trạng ngữ bổ nghĩa cho động từ hoặc cho cả mệnh đề chính để diễn tả thời gian, nguyên nhân, điều kiện, mục đích, kết quả, nhượng bộ, cách thức."}, {"t": "tbl", "rows": [["Loại", "Liên từ", "Ví dụ"], ["Thời gian", "when, while, before, after, since, until, as soon as", "I will call you when I arrive./After we finished dinner, we watched a movie."], ["Nguyên nhân", "because, since, as", "She stayed at home because she was sick."], ["Điều kiện", "if, unless, provided that", "If it rains, we will stay inside."], ["Mục đích", "so that, in order that", "She practices every day so that she can improve her skills."], ["Kết quả", "so … that, such … that", "He was so tired that he fell asleep."], ["Nhượng bộ", "although, though, even though", "Although it was raining, they went out."], ["Cách thức", "as if, as though", "He talked as if he knew everything."]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Đặt dấu phẩy khi mệnh đề trạng ngữ đứng đầu câu.", "lv": 0}, {"t": "p", "text": "Không cần dấu phẩy khi mệnh đề trạng ngữ đứng sau mệnh đề chính.", "lv": 0}, {"t": "p", "text": "Trong mệnh đề trạng ngữ chỉ thời gian và điều kiện, dùng thì hiện tại để nói về tương lai: I will call you when I arrive (không dùng “will arrive”).", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về mệnh đề"}, {"t": "h", "lv": 3, "text": "Lỗi về mệnh đề trạng ngữ"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Dùng “unless” kèm phủ định (phủ định kép)", "lv": 0}, {"t": "p", "text": "Sai: I will go out unless it doesn’t rain.", "lv": 0}, {"t": "p", "text": "Đúng: I will go out unless it rains./I will go out if it doesn’t rain.", "lv": 0}, {"t": "p", "text": "→ “Unless” = “if … not” (trừ khi). Thêm “not” sau “unless” sẽ làm câu ngược nghĩa.", "lv": 0}, {"t": "p", "text": "Lỗi 2: Mệnh đề phụ đứng trước nhưng thiếu dấu phẩy", "lv": 0}, {"t": "p", "text": "Sai: Because he was tired he went to bed early.", "lv": 0}, {"t": "p", "text": "Đúng: Because he was tired, he went to bed early.", "lv": 0}, {"t": "p", "text": "Lỗi 3: Dùng “will” trong mệnh đề thời gian", "lv": 0}, {"t": "p", "text": "Sai: I will call you when I will arrive.", "lv": 0}, {"t": "p", "text": "Đúng: I will call you when I arrive.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Chiến lược nhận diện và sửa lỗi mệnh đề"}, {"t": "tbl", "rows": [["Bước", "Cách làm"], ["1. Xác định loại mệnh đề", "Mệnh đề danh từ: thử thay bằng “it/something”. Mệnh đề quan hệ: tìm danh từ mà nó bổ nghĩa. Mệnh đề trạng ngữ: tìm liên từ và xác định chức năng (thời gian, nguyên nhân…)."], ["2. Kiểm tra từ nối", "Who cho người, which cho vật; chọn liên từ đúng nghĩa (if/unless/because/although)."], ["3. Kiểm tra dấu câu", "Có dấu phẩy khi mệnh đề phụ đứng trước; mệnh đề không xác định đặt giữa hai dấu phẩy."], ["4. Tránh câu quá phức tạp", "Tách câu dài thành câu ngắn hơn; mỗi câu một ý chính rõ ràng."], ["5. Đọc và viết nhiều", "Viết câu với từng loại mệnh đề; đọc sách, báo tiếng Anh để thấy cách dùng trong ngữ cảnh thực tế."]]}], "quiz": [{"t": "I will call you when I ___ .", "o": ["will arrive", "arrive", "arrived", "am arriving"], "a": 1, "e": "Trong mệnh đề thời gian dùng hiện tại để nói về tương lai: when I arrive."}, {"t": "Chọn câu đúng.", "o": ["I will go out unless it doesn't rain.", "I will go out unless it rains.", "I will go out if unless it rains.", "I will go out unless will it rain."], "a": 1, "e": "Unless đã mang nghĩa phủ định (if ... not) nên không thêm not."}, {"t": "She practices every day ___ she can improve her skills.", "o": ["so that", "although", "unless", "as if"], "a": 0, "e": "So that chỉ mục đích."}, {"t": "___ it was raining, they went out.", "o": ["Because", "Although", "So that", "Unless"], "a": 1, "e": "Trời mưa nhưng vẫn đi ra ngoài là nhượng bộ nên dùng although."}, {"t": "He talked ___ he knew everything.", "o": ["as if", "so that", "unless", "until"], "a": 0, "e": "As if chỉ cách thức, nghĩa là như thể."}, {"t": "Chọn câu đúng.", "o": ["Because he was tired he went to bed early.", "Because he was tired, he went to bed early.", "Because, he was tired he went to bed early.", "Because he was tired; he went to bed early."], "a": 1, "e": "Mệnh đề trạng ngữ đứng đầu câu thì cần dấu phẩy."}]}, {"id": "u14", "title": "Mệnh đề danh từ", "desc": "Mệnh đề danh từ và các lỗi thường gặp.", "blocks": [{"t": "p", "text": "Mệnh đề phụ thuộc là thành phần không thể thiếu của câu phức và được chia thành ba loại theo chức năng trong câu, gồm mệnh đề danh từ (làm chức năng danh từ), mệnh đề quan hệ/tính ngữ (bổ nghĩa cho danh từ) và mệnh đề trạng ngữ (bổ nghĩa cho cả mệnh đề chính)."}, {"t": "tbl", "rows": [["Loại mệnh đề", "Chức năng", "Từ mở đầu", "Ví dụ"], ["Danh từ", "Chủ ngữ, tân ngữ, bổ ngữ", "that, what, whether/if, who, where, why, how…", "What he said surprised everyone."], ["Quan hệ (tính ngữ)", "Bổ nghĩa cho danh từ đứng trước", "who, whom, whose, which, that, when, where, why", "The book that you gave me is fascinating."], ["Trạng ngữ", "Chỉ thời gian, lý do, điều kiện, mục đích, kết quả, nhượng bộ, cách thức", "when, because, if, so that, although, as if…", "After we finished dinner, we watched a movie."]]}, {"t": "h", "lv": 2, "text": "Mệnh đề danh từ (Noun Clauses)"}, {"t": "p", "text": "Mệnh đề danh từ đóng vai trò như một danh từ trong câu, tức là có thể làm chủ ngữ, tân ngữ hoặc bổ ngữ."}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Từ mở đầu: that, what, whatever, whether/if, who, whoever, whom, whomever, which, when, where, why, how", "lv": 0}, {"t": "p", "text": "Trật tự từ: Từ để hỏi + S + V (trật tự câu trần thuật, không đảo như câu hỏi)", "lv": 0}]}, {"t": "tbl", "rows": [["Chức năng", "Ví dụ", "Nghĩa"], ["Chủ ngữ", "What he said surprised everyone.", "Điều anh ấy nói đã làm mọi người ngạc nhiên."], ["Chủ ngữ", "What she said is important.", "Điều cô ấy nói là quan trọng."], ["Tân ngữ", "They believe that honesty is the best policy.", "Họ tin rằng trung thực là thượng sách."], ["Tân ngữ", "I don’t know where he lives.", "Tôi không biết anh ấy sống ở đâu."], ["Bổ ngữ", "The problem is that we don’t have enough time.", "Vấn đề là chúng ta không có đủ thời gian."]]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về mệnh đề"}, {"t": "h", "lv": 3, "text": "Lỗi về mệnh đề danh từ"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Đảo trật tự như câu hỏi", "lv": 0}, {"t": "p", "text": "Sai: I don’t know what is he doing.", "lv": 0}, {"t": "p", "text": "Đúng: I don’t know what he is doing.", "lv": 0}, {"t": "p", "text": "→ Trong mệnh đề danh từ, trật tự từ giống câu trần thuật (S + V).", "lv": 0}, {"t": "p", "text": "Lỗi 2: Thiếu từ nối mở đầu mệnh đề", "lv": 0}, {"t": "p", "text": "Sai: I wonder he will come or not.", "lv": 0}, {"t": "p", "text": "Đúng: I wonder whether he will come or not.", "lv": 0}, {"t": "p", "text": "→ Cần “whether” hoặc “if” để mở đầu mệnh đề danh từ dạng Yes/No.", "lv": 0}]}], "quiz": [{"t": "I don't know what ___ doing.", "o": ["is he", "he is", "does he", "he be"], "a": 1, "e": "Trong mệnh đề danh từ, trật tự là S + V: what he is doing."}, {"t": "Do you know who ___ ?", "o": ["is he", "he is", "does he", "he does"], "a": 1, "e": "Trong mệnh đề danh từ không đảo: who he is."}, {"t": "I wonder ___ he will come or not.", "o": ["that", "whether", "what", "which"], "a": 1, "e": "Mệnh đề danh từ dạng Yes/No cần whether hoặc if."}, {"t": "___ he said surprised everyone.", "o": ["What", "Which", "Who", "If"], "a": 0, "e": "What mở đầu mệnh đề danh từ làm chủ ngữ, nghĩa là điều mà."}, {"t": "The problem is ___ we don't have enough time.", "o": ["that", "what", "whose", "whom"], "a": 0, "e": "That mở đầu mệnh đề danh từ làm bổ ngữ: The problem is that ..."}, {"t": "Trong câu They believe that honesty is the best policy, mệnh đề that honesty is the best policy làm chức năng gì?", "o": ["Chủ ngữ", "Tân ngữ", "Bổ ngữ", "Trạng ngữ"], "a": 1, "e": "Mệnh đề đứng sau động từ believe và là điều được tin, nên làm tân ngữ."}]}, {"id": "u27", "title": "Câu điều kiện loại 0, 1, 2", "desc": "Câu điều kiện loại 0, 1, 2 và các lưu ý.", "blocks": [{"t": "p", "text": "Khi được dùng chính xác thì ba nhóm cấu trúc dưới đây giúp bài làm đáp ứng tốt hơn tiêu chí Range, gồm câu điều kiện, câu bị động và động từ khuyết thiếu."}, {"t": "h", "lv": 2, "text": "Câu điều kiện (Conditional Sentences)"}, {"t": "p", "text": "Câu điều kiện diễn tả một giả định về tình huống và kết quả của nó. Câu gồm hai mệnh đề: mệnh đề If (điều kiện) và mệnh đề chính (kết quả)."}, {"t": "tbl", "rows": [["Loại", "Cấu trúc", "Cách dùng", "Ví dụ"], ["Loại 0 (Zero)", "If + hiện tại đơn, hiện tại đơn", "Sự thật hiển nhiên, quy luật tự nhiên", "If you heat water to 100 degrees Celsius, it boils. (Nếu đun nước đến 100 độ C, nước sẽ sôi.)"], ["Loại 1 (First)", "If + hiện tại đơn, will + V", "Khả năng có thật trong tương lai", "If it rains tomorrow, we will cancel the picnic. (Nếu ngày mai trời mưa, chúng ta sẽ hủy buổi dã ngoại.)"], ["Loại 2 (Second)", "If + quá khứ đơn, would + V", "Giả định không có thật ở hiện tại hoặc tương lai", "If I were you, I would apply for that job. (Nếu là bạn thì tôi sẽ nộp đơn vào vị trí đó.)"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Câu điều kiện loại 2 dùng “were” cho mọi chủ ngữ trong văn phong trang trọng: If I were you…; If she were here…", "lv": 0}, {"t": "p", "text": "Unless = If … not: Unless you hurry, you will miss the bus. = If you don’t hurry, you will miss the bus.", "lv": 0}, {"t": "p", "text": "Không dùng “will” trong mệnh đề If. Sai: If it will rain… Đúng: If it rains…", "lv": 0}, {"t": "p", "text": "Câu điều kiện hỗn hợp kết hợp mệnh đề If của loại 3 với mệnh đề chính của loại 2.", "lv": 0}]}], "quiz": [{"t": "If you heat water to 100 degrees Celsius, it ___ .", "o": ["boils", "will boiled", "would boil", "boiled"], "a": 0, "e": "Đây là sự thật khoa học (loại 0): If + hiện tại đơn, hiện tại đơn."}, {"t": "If it ___ tomorrow, we will cancel the picnic.", "o": ["will rain", "rains", "rained", "would rain"], "a": 1, "e": "Loại 1: mệnh đề If dùng hiện tại đơn, không dùng will."}, {"t": "If I ___ you, I would apply for that job.", "o": ["am", "were", "will be", "have been"], "a": 1, "e": "Loại 2 dùng were cho mọi chủ ngữ trong văn phong trang trọng."}, {"t": "If she had more time, she ___ more.", "o": ["would travel", "will travel", "travels", "traveled"], "a": 0, "e": "Loại 2: If + quá khứ đơn, would + V."}, {"t": "Chọn câu đúng.", "o": ["If it will rain, we stay home.", "If it rains, we will stay home.", "If it rained, we will stay home.", "If it would rain, we stay home."], "a": 1, "e": "Loại 1: If + hiện tại đơn, will + V."}, {"t": "Câu điều kiện loại 2 diễn tả điều gì?", "o": ["Giả định không có thật ở hiện tại hoặc tương lai", "Sự thật hiển nhiên", "Khả năng có thật ở tương lai", "Giả định không có thật trong quá khứ"], "a": 0, "e": "Loại 2 dùng cho giả định không có thật ở hiện tại hoặc tương lai."}]}, {"id": "u28", "title": "Câu điều kiện loại 3, hỗn hợp và đảo ngữ", "desc": "Câu điều kiện loại 3, câu hỗn hợp, unless và đảo ngữ.", "blocks": [{"t": "h", "lv": 2, "text": "Câu điều kiện (Conditional Sentences)"}, {"t": "p", "text": "Câu điều kiện diễn tả một giả định về tình huống và kết quả của nó. Câu gồm hai mệnh đề: mệnh đề If (điều kiện) và mệnh đề chính (kết quả)."}, {"t": "tbl", "rows": [["Loại", "Cấu trúc", "Cách dùng", "Ví dụ"], ["Loại 3 (Third)", "If + quá khứ hoàn thành, would have + V3", "Giả định không có thật trong quá khứ", "If she had studied harder, she would have passed the exam. (Nếu học chăm chỉ hơn thì cô ấy đã vượt qua kỳ thi.)"], ["Hỗn hợp (Mixed)", "If + quá khứ hoàn thành, would + V", "Điều kiện trái với quá khứ, kết quả trái với hiện tại", "If he had taken the medicine, he would be feeling better now. (Nếu đã uống thuốc thì bây giờ anh ấy đã thấy khỏe hơn.)"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Câu điều kiện loại 2 dùng “were” cho mọi chủ ngữ trong văn phong trang trọng: If I were you…; If she were here…", "lv": 0}, {"t": "p", "text": "Unless = If … not: Unless you hurry, you will miss the bus. = If you don’t hurry, you will miss the bus.", "lv": 0}, {"t": "p", "text": "Không dùng “will” trong mệnh đề If. Sai: If it will rain… Đúng: If it rains…", "lv": 0}, {"t": "p", "text": "Câu điều kiện hỗn hợp kết hợp mệnh đề If của loại 3 với mệnh đề chính của loại 2.", "lv": 0}, {"t": "p", "text": "Cấu trúc đảo ngữ trang trọng: Should you need help, … (= If you need help)/Had she studied harder, … (= If she had studied harder).", "lv": 0}]}], "quiz": [{"t": "If she had studied harder, she ___ the exam.", "o": ["would have passed", "would pass", "will pass", "passed"], "a": 0, "e": "Loại 3: If + had + V3, would have + V3."}, {"t": "If they had left earlier, they ___ the flight.", "o": ["would not have missed", "would not miss", "will not miss", "did not miss"], "a": 0, "e": "Giả định trái với quá khứ nên dùng would not have missed."}, {"t": "If he had taken the medicine, he ___ better now.", "o": ["would be feeling", "would have felt", "will feel", "felt"], "a": 0, "e": "Câu hỗn hợp: If + had + V3, would + V (kết quả ở hiện tại)."}, {"t": "Unless you hurry, you ___ the bus.", "o": ["will miss", "would have missed", "missed", "won't miss"], "a": 0, "e": "Unless = if you don't hurry, nên vế chính là will miss."}, {"t": "___ she studied harder, she would have passed the exam. (đảo ngữ)", "o": ["Had", "Should", "Were", "Did"], "a": 0, "e": "Đảo ngữ của loại 3: Had + S + V3."}, {"t": "Câu nào tương đương với If you need help, call me?", "o": ["Should you need help, call me.", "Had you need help, call me.", "Were you need help, call me.", "Unless you need help, call me."], "a": 0, "e": "Đảo ngữ của loại 1: Should + S + V nguyên mẫu."}]}, {"id": "u29", "title": "Câu bị động", "desc": "Câu bị động: cấu trúc, các thì và lưu ý.", "blocks": [{"t": "h", "lv": 2, "text": "Câu bị động (Passive Voice)"}, {"t": "p", "text": "Câu bị động nhấn mạnh hành động hoặc đối tượng chịu tác động chứ không nhấn mạnh chủ thể thực hiện hành động."}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Object (tân ngữ của câu chủ động) + to be (chia theo thì) + Past Participle (V3) + (by + chủ thể)", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "Active: The chef cooks the meal. (Đầu bếp nấu bữa ăn.)", "lv": 0}, {"t": "li", "text": "Subject: The chef | Verb: cooks | Object: the meal", "lv": 1}, {"t": "p", "text": "Passive: The meal is cooked by the chef. (Bữa ăn do đầu bếp nấu.)", "lv": 0}]}, {"t": "tbl", "rows": [["Thì", "Cấu trúc bị động", "Ví dụ"], ["Hiện tại đơn", "is/am/are + V3", "English is spoken worldwide."], ["Hiện tại tiếp diễn", "is/am/are + being + V3", "The road is being repaired."], ["Quá khứ đơn", "was/were + V3", "The bridge was built in 1990."], ["Quá khứ tiếp diễn", "was/were + being + V3", "The car was being washed when I arrived."], ["Hiện tại hoàn thành", "has/have + been + V3", "The report has been finished."], ["Quá khứ hoàn thành", "had + been + V3", "The tickets had been sold before we arrived."], ["Tương lai đơn", "will + be + V3", "The results will be announced tomorrow."], ["Động từ khuyết thiếu", "modal + be + V3", "The problem must be solved quickly."]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Không phải lúc nào cũng cần “by + chủ thể”, đặc biệt khi chủ thể không quan trọng, không rõ hoặc đã biết: My bike was stolen. (không cần “by someone”)", "lv": 0}, {"t": "p", "text": "Chỉ động từ có tân ngữ (ngoại động từ) mới chuyển sang bị động được. Sai: The accident was happened. Đúng: The accident happened.", "lv": 0}]}], "quiz": [{"t": "English ___ all over the world.", "o": ["speaks", "is spoken", "is speaking", "spoke"], "a": 1, "e": "Tiếng Anh được nói, nên dùng bị động hiện tại đơn: is spoken."}, {"t": "The bridge ___ in 1990.", "o": ["built", "was built", "is built", "has built"], "a": 1, "e": "Mốc 1990 là quá khứ và cây cầu được xây, nên dùng was built."}, {"t": "The road ___ repaired at the moment.", "o": ["is being", "is", "has been being", "was"], "a": 0, "e": "At the moment cho thấy việc đang diễn ra: bị động hiện tại tiếp diễn is being repaired."}, {"t": "The results ___ tomorrow.", "o": ["will announce", "will be announced", "are announce", "announced"], "a": 1, "e": "Bị động tương lai đơn: will be + V3."}, {"t": "The report ___ finished, so you can read it now.", "o": ["has been", "is being", "was being", "will be"], "a": 0, "e": "Báo cáo đã xong và còn kết quả ở hiện tại: has been finished."}, {"t": "Chọn câu đúng.", "o": ["The accident was happened yesterday.", "The accident happened yesterday.", "The accident has been happened yesterday.", "The accident is happened yesterday."], "a": 1, "e": "Happen là nội động từ nên không dùng bị động."}]}, {"id": "u30", "title": "Động từ khuyết thiếu và modal perfect", "desc": "Động từ khuyết thiếu và động từ khuyết thiếu hoàn thành.", "blocks": [{"t": "h", "lv": 2, "text": "Động từ khuyết thiếu (Modal Verbs)"}, {"t": "p", "text": "Động từ khuyết thiếu diễn tả khả năng, sự cho phép, nghĩa vụ, lời khuyên, đề nghị, mức độ chắc chắn. Sau động từ khuyết thiếu luôn là động từ nguyên thể không “to”."}, {"t": "tbl", "rows": [["Động từ khuyết thiếu", "Nghĩa", "Ví dụ"], ["can/could", "có thể (khả năng, xin phép)", "She can play the piano. (Cô ấy có thể chơi piano.)"], ["may/might", "có thể (khả năng thấp hơn)", "It might rain later."], ["must", "phải (nghĩa vụ mạnh); chắc hẳn (suy luận)", "You must finish your homework. (Bạn phải hoàn thành bài tập về nhà.)"], ["should/ought to", "nên (lời khuyên)", "You should see a doctor."], ["will/would", "sẽ (tương lai, đề nghị lịch sự)", "Would you like some tea?"]]}, {"t": "h", "lv": 3, "text": "Động từ khuyết thiếu hoàn thành (Modal Perfect)"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Modal + have + V3 → diễn tả suy đoán về quá khứ, sự hối tiếc hoặc trách móc", "lv": 0}]}, {"t": "tbl", "rows": [["Cấu trúc", "Ý nghĩa", "Ví dụ"], ["must have + V3", "Chắc hẳn đã (suy luận gần như chắc chắn)", "He must have missed the train. (Anh ấy chắc hẳn đã lỡ chuyến tàu.)"], ["could/might have + V3", "Có thể đã (khả năng); đã có thể … nhưng không làm", "They could have helped us. (Họ đã có thể giúp chúng ta nhưng lại không làm.)"], ["should have + V3", "Lẽ ra nên (hối tiếc, trách móc)", "You should have told me earlier."], ["can’t have + V3", "Không thể nào đã (phủ định chắc chắn)", "She can’t have finished already; she only started an hour ago."]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Mức độ chắc chắn tăng dần: might/may/could (có thể) → should (có lẽ) → must (chắc chắn).", "lv": 0}, {"t": "p", "text": "Sau động từ khuyết thiếu không chia động từ. Sai: She must goes. Đúng: She must go.", "lv": 0}]}], "quiz": [{"t": "She can ___ the piano.", "o": ["plays", "play", "to play", "playing"], "a": 1, "e": "Sau can dùng động từ nguyên thể không to."}, {"t": function wrongList(p) {

    const text = g.q.t + (g.q.sentence ? ' ' + stripTags(g.q.sentence) : '');

  }).join('');

function donut(done, prog, none) {
  const n = done + prog + none, C = 2 * Math.PI * 48;

  const arc = (v, color) => {
    if (!v) return '';
    const len = v / n * C;
    const out = `<circle cx="60" cy="60" r="48" fill="none" stroke-width="16" style="stroke:${color}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return out;
  };
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${done} bài hoàn thành, ${prog} bài đang học, ${none} bài chưa học">
    <circle cx="60" cy="60" r="48" fill="none" stroke-width="16" style="stroke:var(--line)"/>
    ${arc(done, 'var(--ok)')}${arc(prog, 'var(--accent)')}
    <text class="dn" x="60" y="58" text-anchor="middle">${done}/${n}</text>
    <text class="dl" x="60" y="75" text-anchor="middle">hoàn thành</text></svg>`;
}
function progressChart(p) {
  const parts = PARTS.map(pt => ({ pt, its: itemsOf(pt) })).filter(x => x.its.length);
  const c = { done: 0, prog: 0, none: 0 };
  parts.forEach(x => x.its.forEach(it => c[itemState(p, it)]++));
  return `
    <div class="pg">${donut(c.done, c.prog, c.none)}
      <ul class="legend">
        <li><i class="k-done"></i>Hoàn thành: ${c.done} bài</li>
        <li><i class="k-prog"></i>Đang học: ${c.prog} bài</li>
        <li><i class="k-none"></i>Chưa học: ${c.none} bài</li>
      </ul></div>
    ${parts.map(({ pt, its }) => `
      <h4 class="ph">Phần ${pt.no}. ${pt.title}</h4>
      ${its.map(it => {
        const isT = it.kind === 'test', n = isT ? testSize(it.o) : it.o.quiz.length;
        const st = isT ? p.tests[it.o.id] : p.units[it.o.id];
        const b = st ? st.best : 0, state = itemState(p, it);
        const tick = isT ? 80 : passMark(it.o) / n * 100;
        return `<div class="ub"><div class="ub-h"><span>${isT ? 'Bài kiểm tra cuối phần' : it.o.title}</span><b>${st ? b + '/' + n : 'Chưa học'}</b></div>
          <div class="meter"><i class="${state === 'done' ? 'good' : ''}" style="width:${b / n * 100}%"></i><s style="left:${tick}%"></s></div></div>`;
      }).join('')}`).join('')}
    <p class="muted sm" style="margin:12px 0 0">Vạch đen là mức hoàn thành: bài học đúng ít nhất 75% số câu, bài kiểm tra đúng trên 80%. Đang học là đã làm nhưng chưa đạt mức hoàn thành.</p>`;
}

function authErr(msg) { const e = $('#autherr'); if (e) { e.textContent = msg; e.hidden = false; } }
function renderAuth() {
  const accs = Object.keys(ACCOUNTS);
  $('#auth').innerHTML = `
    <div class="auth-box">
      <h1>Easy Grammar</h1>
      <p>Học ngữ pháp tiếng Anh theo từng bài ngắn, có giải thích bằng tiếng Việt và theo dõi tiến độ.</p>
      <div class="auth-card">
        <div class="err" id="autherr" role="alert" hidden></div>
        ${CONFIGURED ? `
        <form data-form="login" autocomplete="on">
          <label class="fld"><span>Tên đăng nhập</span><input type="text" name="user" autocomplete="username" autocapitalize="none" required></label>
          <label class="fld"><span>Mật khẩu</span><input type="password" name="pw" autocomplete="current-password" required></label>
          <button class="btn block" type="submit">Đăng nhập</button>
        </form>` : `
        <p style="margin:0 0 6px"><b>Chưa kết nối Firebase.</b></p>
        <p class="muted" style="margin:0 0 14px">Dán cấu hình Firebase vào mục FIREBASE_CONFIG ở đầu phần script để đăng nhập thật. Trong lúc đó bạn có thể xem thử giao diện (dữ liệu chỉ lưu trong trình duyệt này).</p>
        ${accs.map(u => `<button class="btn ghost block" style="margin-bottom:8px" data-act="previewlogin" data-arg="${u}">Xem thử với tài khoản ${esc(ACCOUNTS[u].name)}</button>`).join('')}`}
      </div>
    </div>`;
  const m = authMsg || bootError; authMsg = '';
  if (m) authErr(m);
}
function loginMsg(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|user-not-found|wrong-password|invalid-email/.test(c)) return 'Tên đăng nhập hoặc mật khẩu không đúng.';
  if (c === 'auth/too-many-requests') return 'Đăng nhập sai quá nhiều lần. Hãy thử lại sau ít phút.';
  if (c === 'auth/network-request-failed') return 'Không kết nối được mạng. Hãy kiểm tra internet rồi thử lại.';
  return 'Không đăng nhập được. Vui lòng thử lại.';
}
async function doLogin(f) {
  const user = f.elements.user.value.toLowerCase().replace(/\s+/g, '');
  const pw = f.elements.pw.value;
  if (!user || !pw) return authErr('Vui lòng nhập tên đăng nhập và mật khẩu.');
  const btn = f.querySelector('button[type=submit]');
  btn.disabled = true;
  try { await Backend.login(user, pw); }
  catch (e) { authErr(loginMsg(e)); btn.disabled = false; }
}

/* ===================== TỔNG QUAN HỌC VIÊN ===================== */
/* Mục tiếp theo cần làm: bài học hoặc bài kiểm tra đầu tiên chưa hoàn thành trong các phần đã mở */
function nextItem() {
  for (const pt of PARTS) {
    if (partLocked(pt)) break;
    for (const it of itemsOf(pt)) if (!itemDone(S, it)) return { it, pt };
  }
  return null;
}
/* Lịch học: ngày nào học (mở bài hoặc trả lời câu hỏi) thì hiện một ngôi sao */
let calMonth = day().slice(0, 7);
function shiftMonth(ym, k) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + k, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function calendarHTML(days, forAdmin = false) {
  const [y, m] = calMonth.split('-').map(Number);
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;      /* T2 là cột đầu tiên */
  const dim = new Date(y, m, 0).getDate();
  const set = new Set(days), today = day();
  let cells = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(w => `<span class="cal-w">${w}</span>`).join('');
  for (let i = 0; i < lead; i++) cells += '<i class="cd empty"></i>';
  let count = 0;
  for (let d = 1; d <= dim; d++) {
    const key = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const on = set.has(key);
    if (on) count++;
    cells += `<span class="cd${on ? ' on' : ''}${key === today ? ' today' : ''}"${on ? ` aria-label="Ngày ${d}: đã học"` : ''}><b>${d}</b>${on ? '<em>★</em>' : ''}</span>`;
  }
  const isNow = calMonth === today.slice(0, 7);
  const note = set.has(today) ? 'Hôm nay bạn đã học. Ngôi sao đã được thêm vào lịch.' : 'Học một bài hoặc làm một câu quiz hôm nay để nhận ngôi sao.';
  const last = days.length ? days.slice().sort().pop().split('-').reverse().join('/') : '';
  return `
    <div class="cal-h"><h3>Lịch học</h3>
      <div class="cal-nav">
        <button data-act="calprev" aria-label="Tháng trước">&lsaquo;</button>
        <span>Tháng ${m}/${y}</span>
        <button data-act="calnext" aria-label="Tháng sau">&rsaquo;</button>
      </div></div>
    <div class="cal-g">${cells}</div>
    <p class="muted sm cal-s">${forAdmin
      ? `${isNow ? 'Tháng này' : 'Tháng ' + m} học viên đã học <b>${count}</b> ngày. ${last ? 'Lần học gần nhất: ' + last + '.' : 'Chưa có ngày học nào được ghi nhận.'}`
      : `${isNow ? 'Tháng này' : 'Tháng ' + m} bạn đã học <b>${count}</b> ngày.${isNow ? ' ' + note : ''}`}</p>`;
}

/* ===================== HIỂN THỊ NỘI DUNG LÝ THUYẾT ===================== */
function ulHTML(items) {
  let h = '<ul>', open0 = false, open1 = false;
  items.forEach(it => {
    if (it.lv === 0) { if (open1) { h += '</ul>'; open1 = false; } if (open0) h += '</li>'; h += `<li>${esc(it.text)}`; open0 = true; }
    else { if (!open0) { h += '<li>'; open0 = true; } if (!open1) { h += '<ul>'; open1 = true; } h += `<li>${esc(it.text)}</li>`; }
  });
  if (open1) h += '</ul>';
  if (open0) h += '</li>';
  return h + '</ul>';
}
/* ô có dạng (+) ... (–) ... (?) ...: xuống dòng trước mỗi dạng, giữ nguyên chữ */
function cellHTML(c) { const t = esc(c); return /^\(\+\)/.test(c) ? t.replace(/ (?=\((?:–|\?)\))/g, '<br>') : t; }
function tblHTML(rows) {
  const head = rows[0], body = rows.slice(1);
  return `<div class="tw"><table class="gt"><thead><tr>${head.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    body.map(r => `<tr>${r.map((c, i) => `<td data-l="${esc(head[i] || '')}">${cellHTML(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const boxCls = l => /^CẤU TRÚC/.test(l) ? 'struct' : /^LỖI THƯỜNG GẶP/.test(l) ? 'err' : /^VÍ DỤ/.test(l) ? 'ex' : /^QUY TẮC/.test(l) ? 'rule' : 'note';
const lineCls = t => /^Sai:/.test(t) ? 'no' : /^Đúng:/.test(t) ? 'yes' : /^Lỗi \d+:/.test(t) ? 'lb' : /^→/.test(t) ? 'ar' : '';
function boxHTML(b) {
  return `<aside class="gbox ${boxCls(b.label)}"><h5>${esc(b.label)}</h5>${b.items.map(i =>
    `<p class="gi ${i.t === 'li' ? 'li' + i.lv : ''} ${lineCls(i.text)}">${esc(i.text)}</p>`).join('')}</aside>`;
}
function blocksHTML(blocks) {
  return blocks.map(b =>
    b.t === 'h' ? (b.lv === 2 ? `<h3 class="gh2">${esc(b.text)}</h3>` : `<h4 class="gh3">${esc(b.text)}</h4>`)
    : b.t === 'p' ? `<p>${esc(b.text)}</p>`
    : b.t === 'ul' ? ulHTML(b.items)
    : b.t === 'tbl' ? tblHTML(b.rows)
    : b.t === 'box' ? boxHTML(b) : '').join('');
}

/* ===================== QUIZ VÀ BÀI KIỂM TRA ===================== */
/* Trộn thứ tự đáp án (trừ câu tìm lỗi sai, vì các đáp án gắn với đoạn gạch chân A-D) */
const prep = q => {
  if (q.sentence) return q;
  const idx = shuffle(q.o.map((_, i) => i));
  return Object.assign({}, q, { o: idx.map(i => q.o[i]), a: idx.indexOf(q.a) });
};
function startQuiz(mode, id) {
  let list;
  if (mode === 'unit') { const u = U(id); if (!u) return; list = u.quiz.map((q, i) => ({ id: `${id}:${i}`, q })); }
  else if (mode === 'test') {
    const t = TESTS.find(x => x.id === id); if (!t) return;
    if (partLocked(testPart(t))) return go({ name: 'lessons' });
    list = shuffle(t.quiz.map((q, i) => ({ id: `${id}:${i}`, q }))).slice(0, testSize(t));   /* bốc ngẫu nhiên từ ngân hàng */
  } else list = S.wrong.map(w => { const g = getQ(w); return g ? { id: w, q: g.q } : null; }).filter(Boolean);
  if (!list.length) { toast('Chưa có câu nào để làm'); return; }
  go({ name: 'quiz', mode, refId: id, items: shuffle(list).map(x => ({ id: x.id, q: prep(x.q) })), i: 0, score: 0, picked: null });
}
const quizTitle = v => v.mode === 'review' ? 'Ôn câu sai' : v.mode === 'test' ? TESTS.find(t => t.id === v.refId).title : U(v.refId).title;
function renderQuiz() {
  const v = view, it = v.items[v.i], q = it.q;
  const done = v.picked !== null, right = done && v.picked === q.a;
  $app.innerHTML = `
    <div class="narrow">
    <button class="back" data-act="quit">Thoát</button>
    <p class="count">${quizTitle(v)}, câu ${v.i + 1} trên ${v.items.length}</p>
    <div class="bar"><i style="width:${(v.i + (done ? 1 : 0)) / v.items.length * 100}%"></i></div>
    <p class="qt">${q.t}</p>
    ${q.sentence ? `<p class="sentence">${q.sentence}</p>` : ''}
    <div class="opts">
      ${q.o.map((o, k) => {
        let cls = '';
        if (done) cls = k === q.a ? 'ok' : (k === v.picked ? 'bad' : '');
        return `<button class="opt ${cls}" data-act="pick" data-arg="${k}" ${done ? 'disabled' : ''}><span class="l">${LET[k]}</span><span>${o}</span></button>`;
      }).join('')}
    </div>
    ${done ? `
      <div class="why ${right ? 'ok' : 'bad'}" id="why">
        <b>${right ? 'Chính xác' : `Chưa đúng, đáp án là ${LET[q.a]}`}</b><p>${q.e}</p>
      </div>
      <div class="btns"><button class="btn" data-act="nextq">${v.i + 1 < v.items.length ? 'Câu tiếp theo' : 'Xem kết quả'}</button></div>` : ''}
    </div>`;
  if (done) $('#why').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function pick(k) {
  const v = view;
  if (v.picked !== null) return;
  v.picked = k;
  const it = v.items[v.i];
  markStudied();
  if (k === it.q.a) { v.score++; S.wrong = S.wrong.filter(x => x !== it.id); }
  else if (!S.wrong.includes(it.id)) S.wrong.push(it.id);
  persist(); renderQuiz();
}
function nextQ() {
  const v = view;
  if (v.i + 1 < v.items.length) { v.i++; v.picked = null; renderQuiz(); window.scrollTo(0, 0); return; }
  if (v.mode === 'unit') {
    const prev = S.units[v.refId];
    S.units[v.refId] = { best: Math.max(prev ? prev.best : 0, v.score) };
  } else if (v.mode === 'test') {
    const prev = S.tests[v.refId];
    S.tests[v.refId] = { best: Math.max(prev ? prev.best : 0, v.score) };
  }
  doSave();
  go({ name: 'result', mode: v.mode, refId: v.refId, score: v.score, total: v.items.length });
}
function renderResult() {
  const v = view;
  if (v.mode === 'test') return renderTestResult();
  const pct = v.score / v.total;
  const msg = pct === 1 ? 'Trọn điểm. Bài này bạn nắm chắc rồi.'
    : pct >= 0.75 ? 'Khá tốt. Xem lại các câu sai để chắc hơn.'
    : pct >= 0.5 ? 'Tạm ổn. Đọc lại phần Lỗi hay gặp rồi làm lại quiz.'
    : 'Chưa vững. Quay lại phần Học nhanh rồi làm lại quiz.';
  const wrong = S.wrong.length;
  const u = v.mode === 'unit' ? U(v.refId) : null;
  const passed = u && isDone(S, u);
  const pt = u ? partOf(u.id) : null;
  $app.innerHTML = `
    <div class="narrow"><section class="sec">
      <h3>${v.mode === 'review' ? 'Kết quả ôn câu sai' : u.title}</h3>
      <p class="score">${v.score}/${v.total}</p>
      <p class="muted">${msg}${passed ? ' Bài này đã được tính hoàn thành.' : ''}</p>
      <div class="btns">
        ${u ? '<button class="btn" data-act="startquiz">Làm lại quiz</button>' : ''}
        ${wrong ? `<button class="btn ${u ? 'ghost' : ''}" data-act="review">Ôn câu sai (${wrong})</button>` : ''}
        ${u ? '<button class="btn ghost" data-act="tab" data-arg="learn">Xem lại bài học</button>' : ''}
        ${u && ME.role === 'student' ? `<button class="btn ghost" data-act="ask" data-arg="${u.id}">Hỏi giáo viên về bài này</button>` : ''}
        ${pt ? `<button class="btn ghost" data-act="part" data-arg="${pt.id}">Quay lại Phần ${pt.no}</button>`
          : `<button class="btn ghost" data-act="nav" data-arg="${ME.role === 'admin' ? 'students' : 'dash'}">${ME.role === 'admin' ? 'Về danh sách học viên' : 'Về tổng quan'}</button>`}
      </div>
    </section></div>`;
}
function renderTestResult() {
  const v = view, t = TESTS.find(x => x.id === v.refId), pt = testPart(t);
  const next = PARTS[PARTS.indexOf(pt) + 1];
  const pass = testPass(v.score, v.total), need = testNeed(v.total);
  const pct = Math.round(v.score / v.total * 100);
  const wrong = S.wrong.length;
  $app.innerHTML = `

      <p class="muted">${pass
        ? (next ? `Bạn đã vượt qua bài kiểm tra Phần ${pt.no}. Phần ${next.no} đã được mở khóa.` : 'Bạn đã vượt qua bài kiểm tra cuối cùng và hoàn thành toàn bộ khóa học.')
        : `Bạn cần làm lại để ${next ? 'mở khóa Phần ' + next.no : 'hoàn thành khóa học'}. Hãy ôn lại các câu sai và xem lại bài học rồi thử lại.`}</p>
      <div class="btns">
        ${pass && next ? `<button class="btn" data-act="part" data-arg="${next.id}">Sang Phần ${next.no}</button>` : ''}

function qCard(q, fresh) {

async function submitQuestion(unitId) {
  const u = U(unitId), ta = $('#qText');
  if (!u || !ta) return;
  const text = ta.value.trim();
  if (!text) return toast('Hãy viết câu hỏi trước khi gửi.');
  if (text.length > 1000) return toast('Câu hỏi quá dài (tối đa 1000 ký tự).');
  if (pendingQ() >= MAX_PENDING) return toast(`Bạn đang có ${MAX_PENDING} câu hỏi chưa được trả lời. Hãy chờ giáo viên trả lời rồi hỏi tiếp.`, 5000);
  const btn = $('[data-act="sendq"]'); if (btn) btn.disabled = true;
  try {
    await Backend.addQuestion({ uid: ME.uid, user: ME.user, unit: u.id, unitTitle: u.title, text, created: Backend.stamp(), reply: '', replied: null, seenByAdmin: false, seenByStudent: true });
    delete drafts['ask:' + u.id];
    toast('Đã gửi câu hỏi cho giáo viên.');
    go({ name: 'qa' });
  } catch (e) {
    if (btn) btn.disabled = false;
    toast('Chưa gửi được câu hỏi. Hãy kiểm tra mạng, hoặc báo giáo viên cập nhật quy tắc Firestore.', 7000);

document.addEventListener('click', e => {
  if (e.target.closest('#toast') && toastTo) { const to = toastTo; $('#toast').hidden = true; toastTo = null; go(to); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  switch (a) {
    case 'logout': doLogout(); break;
    case 'previewlogin': Backend.previewLogin(arg); break;
    case 'seeddemo': Backend.seedDemo(); toast('Đã nạp dữ liệu mẫu cho 2 học viên'); break;
    case 'nav': go({ name: arg }); break;
    case 'part': go({ name: 'part', id: arg }); break;
    case 'ask': go({ name: 'ask', id: arg }); break;
    case 'sendq': submitQuestion(arg); break;
    case 'replyq': sendReply(arg); break;
    case 'qtab': go({ name: 'questions', tab: arg }); break;
    case 'unit': markStudied(); go({ name: 'unit', id: arg, tab: 'learn' }); break;
    case 'calprev': calMonth = shiftMonth(calMonth, -1); render(); break;
    case 'calnext': calMonth = shiftMonth(calMonth, 1); render(); break;
    case 'tab': go({ name: 'unit', id: view.name === 'result' ? view.refId : view.id, tab: arg }); break;
    case 'startquiz': startQuiz('unit', view.name === 'result' ? view.refId : view.id); break;
    case 'starttest': startQuiz('test', arg); break;
    case 'review': startQuiz('review'); break;
    case 'pick': pick(+arg); break;
    case 'nextq': nextQ(); break;
    case 'quit':
      if (confirm('Thoát? Các câu đã trả lời vẫn được lưu.')) {
        doSave();
        const v = view;
        const pt = v.mode === 'unit' ? partOf(v.refId) : v.mode === 'test' ? testPart(TESTS.find(t => t.id === v.refId)) : null;
        go(pt ? { name: 'part', id: pt.id } : { name: ME.role === 'admin' ? 'students' : 'review' });
      }
      break;
    case 'viewstudent': calMonth = day().slice(0, 7); go({ name: 'student', key: arg }); break;
  }
});
/* lưu nội dung đang gõ dở */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.draft) {
    drafts[t.dataset.draft] = t.value;
    if (t.id === 'qText') $('#qCount').textContent = t.value.length + '/1000 ký tự';
  }
});
/* công tắc cài đặt thông báo */
document.addEventListener('change', async e => {
  const t = e.target;
  if (!SET || !t.dataset) return;
  if (t.dataset.set) {
    const key = t.dataset.set;
    if (key === 'browser') {
      if (t.checked) {
        if (!('Notification' in window)) { t.checked = false; return toast('Trình duyệt này không hỗ trợ thông báo hệ thống.'); }
        let p = Notification.permission;
        if (p === 'default') { try { p = await Notification.requestPermission(); } catch (_) {} }
        if (p !== 'granted') { t.checked = false; SET.browser = false; saveSettings(); return toast('Chưa được cấp quyền thông báo. Hãy cho phép trong cài đặt trình duyệt.', 5000); }
      }
      SET.browser = t.checked;
    } else SET[key] = t.checked;
    saveSettings();
    if (key === 'remind') { SET.lastRemind = ''; saveSettings(); }
  } else if (t.dataset.settime && /^\d{2}:\d{2}$/.test(t.value)) {
    SET[t.dataset.settime] = t.value; SET.lastRemind = ''; saveSettings();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'login') doLogin(e.target);
});

/* ===================== KHỞI ĐỘNG ===================== */
if (CONFIGURED && typeof firebase === 'undefined') {
  bootError = 'Không tải được Firebase. Hãy kiểm tra kết nối mạng rồi tải lại trang.';
} else {
  try { Backend.init(onAuth); }
  catch (e) { bootError = 'Cấu hình Firebase chưa đúng. Hãy kiểm tra lại FIREBASE_CONFIG.'; }
}
render();
</script>
</body>
