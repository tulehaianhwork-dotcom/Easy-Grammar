<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#1d2742; --ink-2:#4a5573; --paper:#f2f5fa; --card:#ffffff; --line:#d9e0ec;
  --mark:#ffd84d; --accent:#2c4bd6; --accent-dark:#2339ab; --accent-bg:#e6ecfb;
  --ok:#17835a; --ok-bg:#e3f4ec; --bad:#c23b2b; --bad-bg:#fbe9e6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.muted{color:var(--ink-2)}
.sm{font-size:.8125rem}
.h1{font-size:1.75rem;line-height:1.25;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.lead{margin:0 0 20px;color:var(--ink-2);max-width:60ch}
.narrow{max-width:680px}

/* Buttons */
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font-weight:600;background:var(--accent);color:#fff;text-align:center}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#e9eef7}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid #efc9c3}
.btn.danger:hover{background:var(--bad-bg)}
.btn.small{padding:7px 14px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{display:block;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* Auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-box{width:100%;max-width:420px}
.auth-box h1{font-size:1.75rem;line-height:1.25;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.auth-box>p{margin:0 0 20px;color:var(--ink-2)}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.auth-note{margin:14px 0 0;font-size:.8125rem;color:var(--ink-2)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:.875rem;font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}
.fld small{display:block;margin-top:3px;color:var(--ink-2);font-size:.8125rem}
.pick{display:flex;gap:10px;margin-bottom:14px}
.pick label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:.9375rem}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
.pick input{margin-right:8px}
.err{background:var(--bad-bg);border:1px solid #efc9c3;color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.9375rem}

/* Tabs (auth + unit) */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--ink-2);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:800;font-size:1.1rem;line-height:1.25;padding:0 10px}
.brand small{display:block;font-weight:500;font-size:.8125rem;color:var(--ink-2)}
.side nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.nv:hover{background:#eef2f9}
.nv[aria-current="page"]{background:var(--accent-bg);color:var(--accent-dark)}
.nv i{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;padding:0 8px;line-height:1.5}
.me{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;display:flex;flex-direction:column;gap:4px;font-size:.875rem}
.me span{color:var(--ink-2)}
.me .btn{margin-top:8px}
.main{padding:26px 30px 56px;width:100%;max-width:1100px}
.mtop{display:none}
.bnav{display:none}
@media (max-width:860px){
  .shell{display:block}
  .side{display:none}
  .main{padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:800}
  .mtop span{font-weight:500;font-size:.875rem;color:var(--ink-2)}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
  .bnav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:10px 4px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
  .bnav button[aria-current="page"]{color:var(--accent-dark);border-top-color:var(--accent)}
  .bnav i{font-style:normal;color:var(--bad)}
}

/* Dashboard */
.dgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.sec h3{margin:0 0 10px;font-size:1.0625rem;font-weight:700}
.sec p{margin:0 0 10px}
.sec.hl{border-left:5px solid var(--accent);border-radius:4px 12px 12px 4px}
.nx{font-size:1.35rem;font-weight:800;line-height:1.5}
.mk{background:linear-gradient(transparent 50%,var(--mark) 50% 90%,transparent 90%);padding:0 .15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700;text-align:right}
.ub{margin-bottom:14px}
.ub-h{display:flex;justify-content:space-between;gap:10px;font-size:.9375rem;margin-bottom:5px}
.meter{position:relative;height:8px;background:var(--line);border-radius:4px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter i.good{background:var(--ok)}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.chip{font-style:normal;font-weight:600;background:var(--mark);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:.75rem}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;background:transparent}
.empty h3{margin:0 0 8px;font-size:1.0625rem}
.empty ol{margin:0 0 6px;padding-left:20px}
.empty li{margin-bottom:6px}
.wq{padding:10px 0;border-bottom:1px solid var(--line)}
.wq:last-child{border-bottom:0}
.wq small{display:block;color:var(--ink-2)}
.srow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.srow:hover{border-color:#aab6d3}
.srow-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srow small{display:block;color:var(--ink-2);margin-top:2px}
.demo{margin-left:6px}
textarea.code{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.8125rem;resize:vertical;word-break:break-all;background:#fff;color:var(--ink)}


/* Dashboard học viên */
.pct-card{background:var(--ink);color:#fff;border-radius:14px;padding:22px 24px}
.pc-l{margin:0;font-weight:600;color:rgba(255,255,255,.85)}
.pc-n{margin:0 0 10px;font-size:4rem;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.pc-n span{font-size:2rem;margin-left:2px}
.pc-bar{height:14px;background:rgba(255,255,255,.2);border-radius:7px;overflow:hidden}
.pc-bar i{display:block;height:100%;background:var(--mark);border-radius:7px}
.pc-s{margin:10px 0 0;color:rgba(255,255,255,.85)}

.pg{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.donut{width:140px;height:140px;flex:none}
.donut .dn{font-size:22px;font-weight:800;fill:var(--ink);font-family:inherit}
.donut .dl{font-size:10px;fill:var(--ink-2);font-family:inherit}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:flex;align-items:center;gap:10px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.k-done{background:var(--ok)}.k-prog{background:var(--accent)}.k-none{background:var(--line)}
.ph{margin:20px 0 10px;font-size:1rem;font-weight:700}


/* Tổng quan học viên: lưới 2 cột, lịch học nằm bên phải */
.dash{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"pct cal" "next cal" "rev cal";gap:16px;align-items:start}
.dash>.pct-card{grid-area:pct}
.dash>.cal-card{grid-area:cal}
.dash>.sec.hl{grid-area:next}
.dash>.sec.rev{grid-area:rev}
.dash>.sec{margin:0}
@media (max-width:860px){.dash{grid-template-columns:1fr;grid-template-areas:"pct" "cal" "next" "rev"}}
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h h3{margin:0;font-size:1.0625rem;font-weight:700}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav span{min-width:86px;text-align:center;font-weight:600;font-size:.9375rem}
.cal-nav button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:1.25rem;line-height:1;padding:0}
.cal-nav button:hover{background:#e9eef7}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:.75rem;font-weight:600;color:var(--ink-2);padding-bottom:2px}
.cd{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:.8125rem;line-height:1.1}
.cd b{font-weight:500}
.cd em{font-style:normal;color:#b7791f;font-size:.95rem;line-height:1}
.cd.on{background:#fff4c2}
.cd.on b{font-weight:800}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-s{margin:12px 0 0}

/* Lessons list */
.row{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row:hover{border-color:#aab6d3}
.row .num{grid-row:1 / span 2;font-size:1.9rem;font-weight:800;line-height:1.1}
.row b{font-size:1.05rem;font-weight:700}
.row small{display:block;color:var(--ink-2);font-size:.875rem;line-height:1.45;margin-top:2px}
.row .meta{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8125rem;color:var(--ink-2);margin-top:4px}
.row.soon{background:transparent;border-style:dashed;cursor:default;opacity:.65}
.row.soon:hover{border-color:var(--line)}
.row.test{border-left:5px solid var(--accent);border-radius:4px 12px 12px 4px}
.row.test .num{font-size:1.15rem;padding-top:6px}

/* Unit */
.back{background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:.9375rem;font-weight:500;margin-bottom:6px}
.back:hover{color:var(--ink)}
.u-title{font-size:1.5rem;font-weight:800;line-height:1.25;margin:0 0 14px}
.sec h3.t2{font-size:1.125rem}
.formula{margin:0 0 14px !important;line-height:2}
.formula span{font-size:1.25rem;font-weight:700;padding:0 .2em;background:linear-gradient(transparent 50%,var(--mark) 50% 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sec ul,.traps ul{margin:0 0 12px;padding-left:20px}
.sec li,.traps li{margin-bottom:6px}
.ex{border-left:3px solid var(--line);padding-left:12px}
.ex p{margin:0 0 8px !important}
.ex .en{font-weight:600}
.ex .vi{color:var(--ink-2);font-size:.9375rem}
.traps{background:var(--bad-bg);border:1px solid #efc9c3;border-radius:12px;padding:18px}
.traps h3{margin:0 0 10px;font-size:1.125rem;color:var(--bad)}

/* Quiz */
.count{color:var(--ink-2);font-size:.9375rem;margin:0 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.qt{font-size:1.1875rem;font-weight:600;line-height:1.5;margin:14px 0}
.sentence{font-size:1.125rem;line-height:2;margin:-4px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.seg{border-bottom:2px solid var(--ink);padding-bottom:1px}
.seg::before{content:attr(data-l);font-size:.6875rem;font-weight:700;vertical-align:super;margin-right:3px;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{font-weight:800;color:var(--ink-2);min-width:1.1em}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .l{color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin-top:14px;border-radius:12px;padding:14px 16px}
.why.ok{background:var(--ok-bg);border:1px solid #b6dcc9}
.why.bad{background:var(--bad-bg);border:1px solid #efc9c3}
.why b{display:block;margin-bottom:4px}
.why.ok b{color:var(--ok)}
.why.bad b{color:var(--bad)}
.why p{margin:0}
.score{font-size:3.2rem;font-weight:800;line-height:1.1;margin:8px 0 4px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:.9375rem;z-index:30;max-width:90vw;text-align:center}
@media (min-width:861px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="shell" class="shell" hidden>
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="mtop" id="mtop"></div>
    <div id="app"></div>
  </main>
  <nav class="bnav" id="bnav" aria-label="Điều hướng"></nav>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== CẤU HÌNH (chỉ cần sửa ở đây) =====================
   1) Firebase Console > Project settings > Your apps > Web app: copy cấu hình dán vào FIREBASE_CONFIG.
   2) Firebase Authentication > bật Email/Password, rồi tạo 3 tài khoản bằng các email:
        hocvien1@easygrammar.app   hocvien2@easygrammar.app   admin@easygrammar.app
      (học viên chỉ cần gõ hocvien1, hocvien2 hoặc admin ở màn hình đăng nhập).
   3) Firestore Database > Rules: dán nội dung file firestore.rules đi kèm.
   Cấu hình dưới đây đã điền sẵn cho dự án easy-12d3d. Nếu để trống, app chạy chế độ xem thử (dữ liệu chỉ lưu trong trình duyệt). */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAA_irE0JLyeuH5ePR4VDkQRNpyWbm4hsI',
  authDomain: 'easy-12d3d.firebaseapp.com',
  projectId: 'easy-12d3d',
  storageBucket: 'easy-12d3d.firebasestorage.app',
  messagingSenderId: '298229286190',
  appId: '1:298229286190:web:86bac807b47ce2f34426bf'
};
const EMAIL_DOMAIN = 'easygrammar.app';   /* tên đăng nhập + @ + EMAIL_DOMAIN = email trong Firebase */
const ADMIN_USER = 'admin';               /* tên đăng nhập của tài khoản giáo viên */
const ACCOUNTS = {                        /* tên hiển thị; học viên mà giáo viên theo dõi = mọi tài khoản trừ admin */
  hocvien1: { name: 'Học viên 1' },
  hocvien2: { name: 'Học viên 2' },
  admin: { name: 'Giáo viên' }
};
const LET = ['A', 'B', 'C', 'D'];
const TEST_SIZE = 20;   /* mỗi lần làm bài kiểm tra bốc ngẫu nhiên TEST_SIZE câu từ ngân hàng câu hỏi của phần */

/* ===================== DỮ LIỆU BÀI HỌC ===================== */
const UNITS = [
  {
    id: 'u1',
    title: 'Hiện tại đơn và hiện tại tiếp diễn',
    desc: 'Phân biệt thói quen với việc đang xảy ra, và nhóm động từ không chia tiếp diễn.',
    learn: [
      {
        title: 'Hiện tại đơn',
        formula: 'S + V(s/es)',
        points: [
          'Dùng cho thói quen, sự thật hiển nhiên, lịch trình cố định.',
          'Dấu hiệu: always, usually, often, sometimes, never, every day, on Mondays.',
          'Chủ ngữ he/she/it thì thêm s/es vào động từ.',
          'Phủ định: doesn\'t/don\'t + V nguyên mẫu. Nghi vấn: Does/Do + S + V?'
        ],
        ex: [
          ['She walks to school every day.', 'Cô ấy đi bộ đến trường mỗi ngày.'],
          ['Water boils at 100°C.', 'Nước sôi ở 100 độ C.']
        ]
      },
      {
        title: 'Hiện tại tiếp diễn',
        formula: 'S + am/is/are + V-ing',
        points: [
          'Dùng cho việc đang xảy ra ngay lúc nói, hoặc đang diễn ra quanh thời điểm hiện tại.',
          'Dấu hiệu: now, at the moment, right now, Look!, Listen!, Be quiet!',
          'Phủ định: am/is/are + not + V-ing. Nghi vấn: Am/Is/Are + S + V-ing?'
        ],
        ex: [
          ['Look! The baby is sleeping.', 'Nhìn kìa! Em bé đang ngủ.'],
          ['I\'m studying for the exam this month.', 'Tháng này mình đang ôn thi.']
        ]
      },
      {
        title: 'Cách thêm đuôi',
        formula: 'watch → watches, make → making',
        points: [
          'Tận cùng s, ss, sh, ch, x, o: thêm es (watch → watches, go → goes).',
          'Phụ âm + y: đổi y thành ies (study → studies). Nguyên âm + y: chỉ thêm s (play → plays).',
          'V-ing: bỏ e cuối (make → making). Từ ngắn kết thúc bằng phụ âm, nguyên âm, phụ âm thì gấp đôi phụ âm cuối (run → running).'
        ],
        ex: [
          ['He studies English every night.', 'Anh ấy học tiếng Anh mỗi tối.'],
          ['They are running in the park.', 'Họ đang chạy trong công viên.']
        ]
      }
    ],
    traps: [
      'Không chia tiếp diễn với động từ chỉ trạng thái: know, understand, like, love, want, need, believe, belong. Nói I know, không nói I am knowing.',

/* ===================== CÁC PHẦN (theo mục lục tài liệu) =====================
   Mỗi phần chứa danh sách id bài (theo thứ tự học). Cuối mỗi phần có một bài kiểm tra (TESTS). */

  { id: 'p1', no: 1, title: `Từ loại và cấu tạo từ`, desc: `Từ loại, vị trí trong câu, các lỗi thường gặp và cấu tạo từ.`, units: ['u4', 'u5', 'u6', 'u7', 'u8'] },

  { id: 'p3', no: 3, title: `Mệnh đề`, desc: `Mệnh đề danh từ, mệnh đề quan hệ và mệnh đề trạng ngữ.`, units: ['u14', 'u15', 'u16', 'u17'] },
  { id: 'p4', no: 4, title: `Thì động từ`, desc: `Các thì hiện tại, quá khứ, tương lai và lỗi thường gặp.`, units: ['u1', 'u3', 'u18', 'u2', 'u19', 'u20', 'u21', 'u22'] },
  { id: 'p5', no: 5, title: `Hòa hợp chủ ngữ và động từ`, desc: `Chia động từ đúng theo chủ ngữ số ít và số nhiều.`, units: ['u23', 'u24', 'u25', 'u26'] },
  { id: 'p6', no: 6, title: `Cấu trúc nâng cao`, desc: `Câu điều kiện, câu bị động và động từ khuyết thiếu.`, units: ['u27', 'u28', 'u29', 'u30'] }
];

/* ===================== TIỆN ÍCH ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stripTags = s => String(s).replace(/<[^>]*>/g, '');
const day = (o = 0) => new Date(Date.now() + o * 864e5).toLocaleDateString('en-CA');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const validDay = d => typeof d === 'string' && DATE_RE.test(d) && !isNaN(Date.parse(d));
let toastTimer;
function toast(m) {
  const t = $('#toast');
  t.textContent = m; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ===================== DỮ LIỆU BÀI ===================== */
const U = id => UNITS.find(u => u.id === id);
const passMark = u => Math.ceil(u.quiz.length * 0.75);        /* bài học: đúng từ 75% */
const testSize = t => Math.min(TEST_SIZE, t.quiz.length);       /* số câu mỗi lần làm (bốc từ ngân hàng) */
const testPass = (s, n) => s * 5 > n * 4;                      /* bài kiểm tra: đúng trên 80% */
const testNeed = n => Math.floor(n * 4 / 5) + 1;               /* 20 câu: cần ít nhất 17 */
const partOf = id => PARTS.find(p => p.units.includes(id));
const partUnits = pt => pt.units.map(U).filter(Boolean);
const partTest = pt => TESTS.find(t => t.part === pt.id);
const testPart = t => PARTS.find(p => p.id === t.part);
function getQ(id) {
  const m = /^([ut]\d+):(\d+)$/.exec(id || '');
  if (!m) return null;
  const src = m[1][0] === 'u' ? UNITS.find(x => x.id === m[1]) : TESTS.find(x => x.id === m[1]);
  return src && src.quiz[+m[2]] ? { u: src, q: src.quiz[+m[2]], i: +m[2] } : null;
}

/* ===================== TIẾN ĐỘ ===================== */
const emptyP = () => ({ units: {}, tests: {}, wrong: [], days: [] });
/* Làm sạch dữ liệu đọc từ máy chủ (không tin hoàn toàn dữ liệu bên ngoài) */
function cleanP(o) {
  const p = emptyP();
  if (!o || typeof o !== 'object') return p;
  UNITS.forEach(u => { const s = o.units && o.units[u.id]; if (s && Number.isFinite(+s.best)) p.units[u.id] = { best: clamp(Math.floor(+s.best), 0, u.quiz.length) }; });
  TESTS.forEach(t => { const s = o.tests && o.tests[t.id]; if (s && Number.isFinite(+s.best)) p.tests[t.id] = { best: clamp(Math.floor(+s.best), 0, testSize(t)) }; });
  if (Array.isArray(o.wrong)) p.wrong = [...new Set(o.wrong.filter(id => typeof id === 'string' && getQ(id)))];
  /* Ngày đã học được lưu trong cùng trường units (khóa _days) để không cần đổi quy tắc Firestore */
  const rawDays = o.units && o.units._days;
  if (Array.isArray(rawDays)) p.days = [...new Set(rawDays.filter(validDay))].sort().slice(-400);
  return p;
}
const isDone = (p, u) => !!p.units[u.id] && p.units[u.id].best >= passMark(u);
const testPassed = (p, t) => !!p.tests[t.id] && testPass(p.tests[t.id].best, testSize(t));
const itemsOf = pt => [...partUnits(pt).map(u => ({ kind: 'unit', o: u })), ...(partTest(pt) ? [{ kind: 'test', o: partTest(pt) }] : [])];
const allItems = () => PARTS.flatMap(itemsOf);
const itemDone = (p, it) => it.kind === 'unit' ? isDone(p, it.o) : testPassed(p, it.o);
function itemState(p, it) {
  if (itemDone(p, it)) return 'done';
  return (it.kind === 'unit' ? p.units[it.o.id] : p.tests[it.o.id]) ? 'prog' : 'none';
}
/* Tổng số mục và % hoàn thành luôn tính từ các bài đang hiển thị trong các phần (gồm bài học và bài kiểm tra) */
function stats(p) {
  const its = allItems();
  return { total: its.length, done: its.filter(i => itemDone(p, i)).length, wrong: p.wrong.length };
}

/* Chế độ xem thử: dùng khi chưa dán cấu hình Firebase. Dữ liệu chỉ lưu trong trình duyệt này. */

async function onAuth(u) {

/* Danh sách học viên cho giáo viên: luôn hiện đủ các học viên đã khai báo trong ACCOUNTS, kể cả khi chưa đăng nhập lần nào */
function buildRoster(docs) {
  const R = {};
  Object.keys(ACCOUNTS).filter(u => u !== ADMIN_USER).forEach(u => { R[u] = { u, n: ACCOUNTS[u].name, p: emptyP(), seen: false }; });
  (docs || []).forEach(d => {
    const u = String((d && d.user) || '').toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 20);
    if (!u || u === ADMIN_USER) return;
    R[u] = { u, n: (ACCOUNTS[u] && ACCOUNTS[u].name) || u, p: cleanP(d), seen: true };
  });
  return R;
}
function startRoster() {
  ROSTER = buildRoster([]);
  unsubRoster = Backend.subscribeStudents((docs, err) => {
    if (err) { toast('Không tải được danh sách học viên. Kiểm tra lại quy tắc Firestore.'); return; }
    ROSTER = buildRoster(docs);
    if (ME && ME.role === 'admin' && (view.name === 'students' || view.name === 'student')) render();
  });
}
const rosterArr = () => Object.values(ROSTER).sort((a, b) => a.n.localeCompare(b.n, 'vi'));

/* Khóa phần: học viên phải vượt qua bài kiểm tra của phần trước. Giáo viên xem được tất cả. */
function partLocked(pt) {
  if (!ME || ME.role === 'admin') return false;
  const i = PARTS.indexOf(pt);
  if (i <= 0) return false;
  const t = partTest(PARTS[i - 1]);
  return !!t && !testPassed(S, t);
}

/* ===================== THÀNH PHẦN GIAO DIỆN DÙNG CHUNG ===================== */
function wrongList(p) {
  if (!p.wrong.length) return '<p class="muted">Không có câu nào cần ôn.</p>';
  return p.wrong.map(id => {
    const g = getQ(id);
    const text = g.q.t + (g.q.sentence ? ' ' + stripTags(g.q.sentence) : '');
    return `<div class="wq">${esc(text)}<small>${esc(g.u.title)}. Đáp án: ${esc(stripTags(g.q.o[g.q.a]))}</small></div>`;
  }).join('');
}
function donut(done, prog, none) {
  const n = done + prog + none, C = 2 * Math.PI * 48;
  let off = 0;
  const arc = (v, color) => {
    if (!v) return '';
    const len = v / n * C;
    const out = `<circle cx="60" cy="60" r="48" fill="none" stroke-width="16" style="stroke:${color}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return out;
  };
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${done} bài hoàn thành, ${prog} bài đang học, ${none} bài chưa học">
    <circle cx="60" cy="60" r="48" fill="none" stroke-width="16" style="stroke:var(--line)"/>
    ${arc(done, 'var(--ok)')}${arc(prog, 'var(--accent)')}
    <text class="dn" x="60" y="58" text-anchor="middle">${done}/${n}</text>
    <text class="dl" x="60" y="75" text-anchor="middle">hoàn thành</text></svg>`;
}
function progressChart(p) {
  const parts = PARTS.map(pt => ({ pt, its: itemsOf(pt) })).filter(x => x.its.length);
  const c = { done: 0, prog: 0, none: 0 };
  parts.forEach(x => x.its.forEach(it => c[itemState(p, it)]++));
  return `
    <div class="pg">${donut(c.done, c.prog, c.none)}
      <ul class="legend">
        <li><i class="k-done"></i>Hoàn thành: ${c.done} bài</li>
        <li><i class="k-prog"></i>Đang học: ${c.prog} bài</li>
        <li><i class="k-none"></i>Chưa học: ${c.none} bài</li>
      </ul></div>
    ${parts.map(({ pt, its }) => `
      <h4 class="ph">Phần ${pt.no}. ${pt.title}</h4>
      ${its.map(it => {
        const isT = it.kind === 'test', n = isT ? testSize(it.o) : it.o.quiz.length;
        const st = isT ? p.tests[it.o.id] : p.units[it.o.id];
        const b = st ? st.best : 0, state = itemState(p, it);
        const tick = isT ? 80 : passMark(it.o) / n * 100;
        return `<div class="ub"><div class="ub-h"><span>${isT ? 'Bài kiểm tra cuối phần' : it.o.title}</span><b>${st ? b + '/' + n : 'Chưa học'}</b></div>
          <div class="meter"><i class="${state === 'done' ? 'good' : ''}" style="width:${b / n * 100}%"></i><s style="left:${tick}%"></s></div></div>`;
      }).join('')}`).join('')}
    <p class="muted sm" style="margin:12px 0 0">Vạch đen là mức hoàn thành: bài học đúng ít nhất 75% số câu, bài kiểm tra đúng trên 80%. Đang học là đã làm nhưng chưa đạt mức hoàn thành.</p>`;
}

/* ===================== TỔNG QUAN HỌC VIÊN ===================== */
/* Mục tiếp theo cần làm: bài học hoặc bài kiểm tra đầu tiên chưa hoàn thành trong các phần đã mở */
function nextItem() {
  for (const pt of PARTS) {
    if (partLocked(pt)) break;
    for (const it of itemsOf(pt)) if (!itemDone(S, it)) return { it, pt };
  }
  return null;
}
/* Lịch học: ngày nào học (mở bài hoặc trả lời câu hỏi) thì hiện một ngôi sao */
let calMonth = day().slice(0, 7);
function shiftMonth(ym, k) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + k, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function calendarHTML(days, forAdmin = false) {
  const [y, m] = calMonth.split('-').map(Number);
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;      /* T2 là cột đầu tiên */
  const dim = new Date(y, m, 0).getDate();
  const set = new Set(days), today = day();
  let cells = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(w => `<span class="cal-w">${w}</span>`).join('');
  for (let i = 0; i < lead; i++) cells += '<i class="cd empty"></i>';
  let count = 0;
  for (let d = 1; d <= dim; d++) {
    const key = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const on = set.has(key);
    if (on) count++;
    cells += `<span class="cd${on ? ' on' : ''}${key === today ? ' today' : ''}"${on ? ` aria-label="Ngày ${d}: đã học"` : ''}><b>${d}</b>${on ? '<em>★</em>' : ''}</span>`;
  }
  const isNow = calMonth === today.slice(0, 7);
  const note = set.has(today) ? 'Hôm nay bạn đã học. Ngôi sao đã được thêm vào lịch.' : 'Học một bài hoặc làm một câu quiz hôm nay để nhận ngôi sao.';
  const last = days.length ? days.slice().sort().pop().split('-').reverse().join('/') : '';
  return `
    <div class="cal-h"><h3>Lịch học</h3>
      <div class="cal-nav">
        <button data-act="calprev" aria-label="Tháng trước">&lsaquo;</button>
        <span>Tháng ${m}/${y}</span>
        <button data-act="calnext" aria-label="Tháng sau">&rsaquo;</button>
      </div></div>
    <div class="cal-g">${cells}</div>
    <p class="muted sm cal-s">${forAdmin
      ? `${isNow ? 'Tháng này' : 'Tháng ' + m} học viên đã học <b>${count}</b> ngày. ${last ? 'Lần học gần nhất: ' + last + '.' : 'Chưa có ngày học nào được ghi nhận.'}`
      : `${isNow ? 'Tháng này' : 'Tháng ' + m} bạn đã học <b>${count}</b> ngày.${isNow ? ' ' + note : ''}`}</p>`;
}

      <p class="muted">${n} câu bốc ngẫu nhiên từ ngân hàng ${t.quiz.length} câu. Cần đúng từ ${testNeed(n)}/${n} câu (trên 80%) ${PARTS[PARTS.indexOf(nx.pt) + 1] ? 'để mở khóa Phần ' + (nx.pt.no + 1) : 'để hoàn thành khóa học'}.</p>
      <p class="muted">${st ? `Điểm tốt nhất ${st.best}/${n}.` : 'Bạn chưa làm bài kiểm tra này.'}</p>
      <div class="btns"><button class="btn" data-act="starttest" data-arg="${t.id}">Làm bài kiểm tra</button></div>`;
  }
  $app.innerHTML = `
    <h1 class="h1">Chào ${esc(ME.name)}</h1>
    <div class="dash">
      <section class="pct-card" aria-label="Phần trăm hoàn thành khóa học">
        <p class="pc-l">Hoàn thành khóa học</p>
        <p class="pc-n">${pct}<span>%</span></p>
        <div class="pc-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <p class="pc-s">${s.done}/${s.total} bài học và bài kiểm tra đã hoàn thành</p>
      </section>
      <section class="cal-card" aria-label="Lịch học">${calendarHTML(S.days)}</section>
      <section class="sec hl">${nextHTML}</section>
      <section class="sec rev">
        <h3>Ôn câu sai</h3>
        <p class="muted">${s.wrong ? `Bạn có ${s.wrong} câu cần ôn lại. Trả lời đúng thì câu đó được gỡ khỏi danh sách.` : 'Chưa có câu sai nào cần ôn.'}</p>
        <button class="btn block" data-act="review" ${s.wrong ? '' : 'disabled'}>Ôn ngay</button>
      </section>
    </div>`;
}

/* ===================== BÀI HỌC THEO PHẦN ===================== */
function renderLessons() {
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Bài học</h1>
    <p class="lead">Chọn một phần để xem các bài nhỏ bên trong. Cuối mỗi phần có bài kiểm tra 20 câu (mỗi lần là một bộ câu khác nhau): cần đúng trên 80% mới mở được phần tiếp theo.</p>
    ${PARTS.map((pt, i) => {
      if (partLocked(pt)) {
        const prev = PARTS[i - 1];
        return `<div class="row soon"><span class="num">${pt.no}</span>
          <span><b>${pt.title}</b><small>Đã khóa. Vượt qua bài kiểm tra Phần ${prev.no} để mở phần này.</small></span>
          <span class="meta"><span>Chưa mở</span></span></div>`;
      }
      const us = partUnits(pt), t = partTest(pt);
      const done = us.filter(u => isDone(S, u)).length;
      return `<button class="row" data-act="part" data-arg="${pt.id}"><span class="num">${pt.no}</span>
        <span><b>${pt.title}</b><small>${pt.desc}</small></span>
        <span class="meta">${t && testPassed(S, t) ? '<i class="chip done">Đã qua bài kiểm tra</i>' : ''}<span>${done}/${us.length} bài học hoàn thành</span></span></button>`;
    }).join('')}
    </div>`;
}

function renderPart() {
  const pt = PARTS.find(x => x.id === view.id);
  if (!pt || partLocked(pt)) return go({ name: 'lessons' });
  const t = partTest(pt), next = PARTS[PARTS.indexOf(pt) + 1];
  let testRow = '';
  if (t) {
    const n = testSize(t), st = S.tests[t.id], ok = testPassed(S, t);
    testRow = `<button class="row test" data-act="starttest" data-arg="${t.id}">
      <span class="num">KT</span>
      <span><b>${t.title}</b><small>${n} câu bốc ngẫu nhiên từ ngân hàng ${t.quiz.length} câu, mỗi lần làm là một bộ khác. Cần đúng từ ${testNeed(n)}/${n} câu (trên 80%) ${next ? 'để mở khóa Phần ' + next.no : 'để hoàn thành khóa học'}. Nên học hết các bài trên trước khi làm.</small></span>
      <span class="meta">${ok ? '<i class="chip done">Đã vượt qua</i>' : ''}<span>${st ? (ok ? '' : 'Chưa đạt. ') + 'Tốt nhất ' + st.best + '/' + n : 'Chưa làm'}</span></span></button>`;
  }
  $app.innerHTML = `
    <div class="narrow">
    <button class="back" data-act="nav" data-arg="lessons">Quay lại các phần</button>
    <h1 class="h1">Phần ${pt.no}. ${pt.title}</h1>
    <p class="lead">${pt.desc}</p>
    ${partUnits(pt).map((u, i) => {
      const st = S.units[u.id], done = isDone(S, u);
      return `<button class="row" data-act="unit" data-arg="${u.id}">
        <span class="num">${i + 1}</span>
        <span><b>${u.title}</b><small>${u.desc}</small></span>
        <span class="meta">${done ? '<i class="chip done">Đã hoàn thành</i>' : ''}<span>${st ? 'Tốt nhất ' + st.best + '/' + u.quiz.length : 'Chưa làm quiz'}</span></span>
      </button>`;
    }).join('')}
    ${testRow}
    </div>`;
}

function renderUnit() {
  const u = U(view.id), pt = u && partOf(u.id);
  if (!u || (pt && partLocked(pt))) return go({ name: 'lessons' });
  const tabs = [['learn', 'Học nhanh'], ['practice', 'Luyện tập']];
  let body = '';
  if (view.tab === 'learn') {
    body = u.learn.map(s => `
      <article class="sec">
        <h3 class="t2">${s.title}</h3>
        <p class="formula"><span>${s.formula}</span></p>
        <ul>${s.points.map(p => `<li>${p}</li>`).join('')}</ul>
        <div class="ex">${s.ex.map(x => `<p><span class="en">${x[0]}</span><br><span class="vi">${x[1]}</span></p>`).join('')}</div>
      </article>`).join('') +
      `<aside class="traps"><h3>Lỗi hay gặp</h3><ul>${u.traps.map(t => `<li>${t}</li>`).join('')}</ul></aside>
       ${u.src ? `<p class="muted sm" style="margin-top:12px">${u.src}</p>` : ''}
       <div class="btns"><button class="btn" data-act="tab" data-arg="practice">Sang luyện tập</button></div>`;
  } else {
    const st = S.units[u.id];
    body = `
      <section class="sec">
        <h3>Quiz ${u.quiz.length} câu</h3>
        <p>Chọn đáp án, xem giải thích ngay sau mỗi câu. Câu sai được lưu lại để ôn ở mục Ôn câu sai.</p>
        <p>${st ? `Điểm tốt nhất của bạn: <b>${st.best}/${u.quiz.length}</b>. Cần đạt ${passMark(u)}/${u.quiz.length} để hoàn thành bài.` : `Bạn chưa làm quiz bài này. Cần đạt ${passMark(u)}/${u.quiz.length} để hoàn thành bài.`}</p>
        <button class="btn block" data-act="startquiz">${st ? 'Làm lại quiz' : 'Bắt đầu làm quiz'}</button>
      </section>`;
  }
  $app.innerHTML = `
    <div class="narrow">
    <button class="back" data-act="${pt ? 'part' : 'nav'}" data-arg="${pt ? pt.id : 'lessons'}">${pt ? 'Quay lại Phần ' + pt.no : 'Quay lại danh sách bài'}</button>
    <h2 class="u-title">${u.title}</h2>
    <div class="tabs" role="tablist">
      ${tabs.map(t => `<button class="tab" role="tab" aria-selected="${view.tab === t[0]}" data-act="tab" data-arg="${t[0]}">${t[1]}</button>`).join('')}
    </div>
    ${body}
    </div>`;
}

function renderReview() {
  const n = S.wrong.length;
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Ôn câu sai</h1>
    <p class="lead">Các câu bạn từng làm sai (cả bài học và bài kiểm tra) được gom lại ở đây. Trả lời đúng thì câu đó được gỡ khỏi danh sách.</p>
    ${n ? `<section class="sec"><h3>${n} câu cần ôn</h3>
        ${S.wrong.map(id => { const g = getQ(id); return `<div class="wq">${esc(g.q.t + (g.q.sentence ? ' ' + stripTags(g.q.sentence) : ''))}<small>${esc(g.u.title)}</small></div>`; }).join('')}
        <div class="btns"><button class="btn" data-act="review">Bắt đầu ôn</button></div></section>`
    : `<div class="empty"><h3>Chưa có câu nào cần ôn</h3><p class="muted">Làm quiz ở một bài, câu nào sai sẽ xuất hiện ở đây.</p>
        <div class="btns"><button class="btn" data-act="nav" data-arg="lessons">Đến danh sách bài</button></div></div>`}
    </div>`;
}

/* ===================== QUIZ VÀ BÀI KIỂM TRA ===================== */
/* Trộn thứ tự đáp án (trừ câu tìm lỗi sai, vì các đáp án gắn với đoạn gạch chân A-D) */
const prep = q => {
  if (q.sentence) return q;
  const idx = shuffle(q.o.map((_, i) => i));
  return Object.assign({}, q, { o: idx.map(i => q.o[i]), a: idx.indexOf(q.a) });
};
function startQuiz(mode, id) {
  let list;
  if (mode === 'unit') { const u = U(id); if (!u) return; list = u.quiz.map((q, i) => ({ id: `${id}:${i}`, q })); }
  else if (mode === 'test') {
    const t = TESTS.find(x => x.id === id); if (!t) return;
    if (partLocked(testPart(t))) return go({ name: 'lessons' });
    list = shuffle(t.quiz.map((q, i) => ({ id: `${id}:${i}`, q }))).slice(0, testSize(t));   /* bốc ngẫu nhiên từ ngân hàng */
  } else list = S.wrong.map(w => { const g = getQ(w); return g ? { id: w, q: g.q } : null; }).filter(Boolean);
  if (!list.length) { toast('Chưa có câu nào để làm'); return; }
  go({ name: 'quiz', mode, refId: id, items: shuffle(list).map(x => ({ id: x.id, q: prep(x.q) })), i: 0, score: 0, picked: null });
}
const quizTitle = v => v.mode === 'review' ? 'Ôn câu sai' : v.mode === 'test' ? TESTS.find(t => t.id === v.refId).title : U(v.refId).title;
function renderQuiz() {
  const v = view, it = v.items[v.i], q = it.q;
  const done = v.picked !== null, right = done && v.picked === q.a;
  $app.innerHTML = `
    <div class="narrow">
    <button class="back" data-act="quit">Thoát</button>
    <p class="count">${quizTitle(v)}, câu ${v.i + 1} trên ${v.items.length}</p>
    <div class="bar"><i style="width:${(v.i + (done ? 1 : 0)) / v.items.length * 100}%"></i></div>
    <p class="qt">${q.t}</p>
    ${q.sentence ? `<p class="sentence">${q.sentence}</p>` : ''}
    <div class="opts">
      ${q.o.map((o, k) => {
        let cls = '';
        if (done) cls = k === q.a ? 'ok' : (k === v.picked ? 'bad' : '');
        return `<button class="opt ${cls}" data-act="pick" data-arg="${k}" ${done ? 'disabled' : ''}><span class="l">${LET[k]}</span><span>${o}</span></button>`;
      }).join('')}
    </div>
    ${done ? `
      <div class="why ${right ? 'ok' : 'bad'}" id="why">
        <b>${right ? 'Chính xác' : `Chưa đúng, đáp án là ${LET[q.a]}`}</b><p>${q.e}</p>
      </div>
      <div class="btns"><button class="btn" data-act="nextq">${v.i + 1 < v.items.length ? 'Câu tiếp theo' : 'Xem kết quả'}</button></div>` : ''}
    </div>`;
  if (done) $('#why').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function pick(k) {
  const v = view;
  if (v.picked !== null) return;
  v.picked = k;
  const it = v.items[v.i];
  markStudied();
  if (k === it.q.a) { v.score++; S.wrong = S.wrong.filter(x => x !== it.id); }
  else if (!S.wrong.includes(it.id)) S.wrong.push(it.id);
  persist(); renderQuiz();
}
function nextQ() {
  const v = view;
  if (v.i + 1 < v.items.length) { v.i++; v.picked = null; renderQuiz(); window.scrollTo(0, 0); return; }
  if (v.mode === 'unit') {
    const prev = S.units[v.refId];
    S.units[v.refId] = { best: Math.max(prev ? prev.best : 0, v.score) };
  } else if (v.mode === 'test') {
    const prev = S.tests[v.refId];
    S.tests[v.refId] = { best: Math.max(prev ? prev.best : 0, v.score) };
  }
  doSave();
  go({ name: 'result', mode: v.mode, refId: v.refId, score: v.score, total: v.items.length });
}
function renderResult() {
  const v = view;
  if (v.mode === 'test') return renderTestResult();
  const pct = v.score / v.total;
  const msg = pct === 1 ? 'Trọn điểm. Bài này bạn nắm chắc rồi.'
    : pct >= 0.75 ? 'Khá tốt. Xem lại các câu sai để chắc hơn.'
    : pct >= 0.5 ? 'Tạm ổn. Đọc lại phần Lỗi hay gặp rồi làm lại quiz.'
    : 'Chưa vững. Quay lại phần Học nhanh rồi làm lại quiz.';
  const wrong = S.wrong.length;
  const u = v.mode === 'unit' ? U(v.refId) : null;
  const passed = u && isDone(S, u);
  const pt = u ? partOf(u.id) : null;
  $app.innerHTML = `
    <div class="narrow"><section class="sec">
      <h3>${v.mode === 'review' ? 'Kết quả ôn câu sai' : u.title}</h3>
      <p class="score">${v.score}/${v.total}</p>
      <p class="muted">${msg}${passed ? ' Bài này đã được tính hoàn thành.' : ''}</p>
      <div class="btns">
        ${u ? '<button class="btn" data-act="startquiz">Làm lại quiz</button>' : ''}
        ${wrong ? `<button class="btn ${u ? 'ghost' : ''}" data-act="review">Ôn câu sai (${wrong})</button>` : ''}
        ${u ? '<button class="btn ghost" data-act="tab" data-arg="learn">Xem lại bài học</button>' : ''}
        ${pt ? `<button class="btn ghost" data-act="part" data-arg="${pt.id}">Quay lại Phần ${pt.no}</button>`
          : `<button class="btn ghost" data-act="nav" data-arg="${ME.role === 'admin' ? 'students' : 'dash'}">${ME.role === 'admin' ? 'Về danh sách học viên' : 'Về tổng quan'}</button>`}
      </div>
    </section></div>`;
}
function renderTestResult() {
  const v = view, t = TESTS.find(x => x.id === v.refId), pt = testPart(t);
  const next = PARTS[PARTS.indexOf(pt) + 1];
  const pass = testPass(v.score, v.total), need = testNeed(v.total);
  const pct = Math.round(v.score / v.total * 100);
  const wrong = S.wrong.length;
  $app.innerHTML = `
    <div class="narrow"><section class="sec">
      <h3>${t.title}</h3>
      <p class="score">${v.score}/${v.total}</p>
      <p class="muted" style="margin-bottom:6px"><b>${pass ? 'Đạt' : 'Chưa đạt'}</b>: ${pct}% số câu đúng. Cần đúng từ ${need}/${v.total} câu (trên 80%).</p>
      <p class="muted">${pass
        ? (next ? `Bạn đã vượt qua bài kiểm tra Phần ${pt.no}. Phần ${next.no} đã được mở khóa.` : 'Bạn đã vượt qua bài kiểm tra cuối cùng và hoàn thành toàn bộ khóa học.')
        : `Bạn cần làm lại để ${next ? 'mở khóa Phần ' + next.no : 'hoàn thành khóa học'}. Hãy ôn lại các câu sai và xem lại bài học rồi thử lại.`}</p>
      <div class="btns">
        ${pass && next ? `<button class="btn" data-act="part" data-arg="${next.id}">Sang Phần ${next.no}</button>` : ''}
        ${!pass ? `<button class="btn" data-act="starttest" data-arg="${t.id}">Làm lại bài kiểm tra</button>` : ''}
        ${wrong ? `<button class="btn ghost" data-act="review">Ôn câu sai (${wrong})</button>` : ''}
        <button class="btn ghost" data-act="part" data-arg="${pt.id}">Quay lại Phần ${pt.no}</button>
      </div>
    </section></div>`;
}

/* ===================== GIÁO VIÊN: HỌC VIÊN ===================== */
function renderStudents() {
  const R = rosterArr();
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Học viên</h1>
    <p class="lead">Chọn một học viên để xem tiến trình học và các câu đang sai.</p>
    ${R.map(r => {
      const s = stats(r.p);
      return `<button class="srow" data-act="viewstudent" data-arg="${esc(r.u)}">
        <span class="srow-h"><b>${esc(r.n)}</b></span>
        <small>${r.seen ? `${s.done}/${s.total} bài hoàn thành, ${s.wrong} câu đang sai` : 'Chưa đăng nhập lần nào'}</small>
      </button>`;
    }).join('')}
    ${Backend.mode === 'preview' ? '<div class="btns"><button class="btn ghost" data-act="seeddemo">Nạp dữ liệu mẫu để xem thử</button></div>' : ''}
    </div>`;
}

  if (!r) return go({ name: 'students' });

    <div class="narrow">

/* ===================== TÀI KHOẢN ===================== */
function renderAccount() {
  $app.innerHTML = `
    <div class="narrow">
    <h1 class="h1">Tài khoản</h1>
    <p class="lead">Thông tin đăng nhập của bạn.</p>
    <section class="sec"><h3>Thông tin</h3>
      <dl class="kv">
        <div><dt>Họ tên</dt><dd>${esc(ME.name)}</dd></div>
        <div><dt>Tên đăng nhập</dt><dd>${esc(ME.user)}</dd></div>
        <div><dt>Loại tài khoản</dt><dd>${ME.role === 'admin' ? 'Giáo viên' : 'Học viên'}</dd></div>
      </dl></section>
    <section class="sec"><h3>Phiên đăng nhập</h3>
      <div class="btns" style="margin-top:0"><button class="btn ghost" data-act="logout">Đăng xuất</button></div></section>
    </div>`;
}

/* ===================== SỰ KIỆN ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  switch (a) {
    case 'logout': doLogout(); break;
    case 'previewlogin': Backend.previewLogin(arg); break;
    case 'seeddemo': Backend.seedDemo(); toast('Đã nạp dữ liệu mẫu cho 2 học viên'); break;
    case 'nav': go({ name: arg }); break;
    case 'part': go({ name: 'part', id: arg }); break;
    case 'unit': markStudied(); go({ name: 'unit', id: arg, tab: 'learn' }); break;
    case 'calprev': calMonth = shiftMonth(calMonth, -1); render(); break;
    case 'calnext': calMonth = shiftMonth(calMonth, 1); render(); break;
    case 'tab': go({ name: 'unit', id: view.name === 'result' ? view.refId : view.id, tab: arg }); break;
    case 'startquiz': startQuiz('unit', view.name === 'result' ? view.refId : view.id); break;
    case 'starttest': startQuiz('test', arg); break;
    case 'review': startQuiz('review'); break;
    case 'pick': pick(+arg); break;
    case 'nextq': nextQ(); break;
    case 'quit':
      if (confirm('Thoát? Các câu đã trả lời vẫn được lưu.')) {
        doSave();
        const v = view;
        const pt = v.mode === 'unit' ? partOf(v.refId) : v.mode === 'test' ? testPart(TESTS.find(t => t.id === v.refId)) : null;
        go(pt ? { name: 'part', id: pt.id } : { name: ME.role === 'admin' ? 'students' : 'review' });
      }
      break;
    case 'viewstudent': calMonth = day().slice(0, 7); go({ name: 'student', key: arg }); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'login') doLogin(e.target);
});

/* ===================== KHỞI ĐỘNG ===================== */
if (CONFIGURED && typeof firebase === 'undefined') {
  bootError = 'Không tải được Firebase. Hãy kiểm tra kết nối mạng rồi tải lại trang.';
} else {
  try { Backend.init(onAuth); }
  catch (e) { bootError = 'Cấu hình Firebase chưa đúng. Hãy kiểm tra lại FIREBASE_CONFIG.'; }
}
render();
</script>
