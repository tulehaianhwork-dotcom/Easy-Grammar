<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#1d2742; --ink-2:#4a5573; --paper:#f2f5fa; --card:#ffffff; --line:#d9e0ec;
  --mark:#ffd84d; --accent:#2c4bd6; --accent-dark:#2339ab; --accent-bg:#e6ecfb;
  --ok:#17835a; --ok-bg:#e3f4ec; --bad:#c23b2b; --bad-bg:#fbe9e6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.muted{color:var(--ink-2)}
.sm{font-size:.8125rem}
.h1{font-size:1.75rem;line-height:1.25;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.lead{margin:0 0 20px;color:var(--ink-2);max-width:60ch}
.narrow{max-width:680px}

/* Buttons */
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font-weight:600;background:var(--accent);color:#fff;text-align:center}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#e9eef7}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid #efc9c3}
.btn.danger:hover{background:var(--bad-bg)}
.btn.small{padding:7px 14px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{display:block;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* Auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-box{width:100%;max-width:420px}
.auth-box h1{font-size:1.75rem;line-height:1.25;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.auth-box>p{margin:0 0 20px;color:var(--ink-2)}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.auth-note{margin:14px 0 0;font-size:.8125rem;color:var(--ink-2)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:.875rem;font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}
.fld small{display:block;margin-top:3px;color:var(--ink-2);font-size:.8125rem}
.pick{display:flex;gap:10px;margin-bottom:14px}
.pick label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:.9375rem}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
.pick input{margin-right:8px}
.err{background:var(--bad-bg);border:1px solid #efc9c3;color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.9375rem}

/* Tabs (auth + unit) */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--ink-2);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:800;font-size:1.1rem;line-height:1.25;padding:0 10px}
.brand small{display:block;font-weight:500;font-size:.8125rem;color:var(--ink-2)}
.side nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.nv:hover{background:#eef2f9}
.nv[aria-current="page"]{background:var(--accent-bg);color:var(--accent-dark)}
.nv i{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;padding:0 8px;line-height:1.5}
.me{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;display:flex;flex-direction:column;gap:4px;font-size:.875rem}
.me span{color:var(--ink-2)}
.me .btn{margin-top:8px}
.main{padding:26px 30px 56px;width:100%;max-width:1100px}
.mtop{display:none}
.bnav{display:none}
@media (max-width:860px){
  .shell{display:block}
  .side{display:none}
  .main{padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:800}
  .mtop span{font-weight:500;font-size:.875rem;color:var(--ink-2)}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
  .bnav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:10px 4px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
  .bnav button[aria-current="page"]{color:var(--accent-dark);border-top-color:var(--accent)}
  .bnav i{font-style:normal;color:var(--bad)}
}

/* Dashboard */
.dgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.sec h3{margin:0 0 10px;font-size:1.0625rem;font-weight:700}
.sec p{margin:0 0 10px}
.sec.hl{border-left:5px solid var(--accent);border-radius:4px 12px 12px 4px}
.nx{font-size:1.35rem;font-weight:800;line-height:1.5}
.mk{background:linear-gradient(transparent 50%,var(--mark) 50% 90%,transparent 90%);padding:0 .15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700;text-align:right}
.ub{margin-bottom:14px}
.ub-h{display:flex;justify-content:space-between;gap:10px;font-size:.9375rem;margin-bottom:5px}
.meter{position:relative;height:8px;background:var(--line);border-radius:4px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter i.good{background:var(--ok)}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.chip{font-style:normal;font-weight:600;background:var(--mark);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:.75rem}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;background:transparent}
.empty h3{margin:0 0 8px;font-size:1.0625rem}
.empty ol{margin:0 0 6px;padding-left:20px}
.empty li{margin-bottom:6px}
.wq{padding:10px 0;border-bottom:1px solid var(--line)}
.wq:last-child{border-bottom:0}
.wq small{display:block;color:var(--ink-2)}
.srow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.srow:hover{border-color:#aab6d3}
.srow-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srow small{display:block;color:var(--ink-2);margin-top:2px}
.demo{margin-left:6px}
textarea.code{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.8125rem;resize:vertical;word-break:break-all;background:#fff;color:var(--ink)}


/* Dashboard học viên */
.pct-card{background:var(--ink);color:#fff;border-radius:14px;padding:22px 24px}
.pc-l{margin:0;font-weight:600;color:rgba(255,255,255,.85)}
.pc-n{margin:0 0 10px;font-size:4rem;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.pc-n span{font-size:2rem;margin-left:2px}
.pc-bar{height:14px;background:rgba(255,255,255,.2);border-radius:7px;overflow:hidden}
.pc-bar i{display:block;height:100%;background:var(--mark);border-radius:7px}
.pc-s{margin:10px 0 0;color:rgba(255,255,255,.85)}

.pg{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.donut{width:140px;height:140px;flex:none}
.donut .dn{font-size:22px;font-weight:800;fill:var(--ink);font-family:inherit}
.donut .dl{font-size:10px;fill:var(--ink-2);font-family:inherit}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:flex;align-items:center;gap:10px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.k-done{background:var(--ok)}.k-prog{background:var(--accent)}.k-none{background:var(--line)}
.ph{margin:20px 0 10px;font-size:1rem;font-weight:700}


/* Tổng quan học viên: lưới 2 cột, lịch học nằm bên phải */
.dash{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"pct cal" "next cal" "rev cal";gap:16px;align-items:start}
.dash>.pct-card{grid-area:pct}
.dash>.cal-card{grid-area:cal}
.dash>.sec.hl{grid-area:next}
.dash>.sec.rev{grid-area:rev}
.dash>.sec{margin:0}
@media (max-width:860px){.dash{grid-template-columns:1fr;grid-template-areas:"pct" "cal" "next" "rev"}}
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h h3{margin:0;font-size:1.0625rem;font-weight:700}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav span{min-width:86px;text-align:center;font-weight:600;font-size:.9375rem}
.cal-nav button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:1.25rem;line-height:1;padding:0}
.cal-nav button:hover{background:#e9eef7}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:.75rem;font-weight:600;color:var(--ink-2);padding-bottom:2px}
.cd{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:.8125rem;line-height:1.1}
.cd b{font-weight:500}
.cd em{font-style:normal;color:#b7791f;font-size:.95rem;line-height:1}
.cd.on{background:#fff4c2}
.cd.on b{font-weight:800}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-s{margin:12px 0 0}

/* Lessons list */
.row{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row:hover{border-color:#aab6d3}
.row .num{grid-row:1 / span 2;font-size:1.9rem;font-weight:800;line-height:1.1}
.row b{font-size:1.05rem;font-weight:700}
.row small{display:block;color:var(--ink-2);font-size:.875rem;line-height:1.45;margin-top:2px}
.row .meta{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8125rem;color:var(--ink-2);margin-top:4px}
.row.soon{background:transparent;border-style:dashed;cursor:default;opacity:.65}
.row.soon:hover{border-color:var(--line)}
.row.test{border-left:5px solid var(--accent);border-radius:4px 12px 12px 4px}
.row.test .num{font-size:1.15rem;padding-top:6px}

/* Unit */
.back{background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:.9375rem;font-weight:500;margin-bottom:6px}
.back:hover{color:var(--ink)}
.u-title{font-size:1.5rem;font-weight:800;line-height:1.25;margin:0 0 14px}
.sec h3.t2{font-size:1.125rem}
.formula{margin:0 0 14px !important;line-height:2}
.formula span{font-size:1.25rem;font-weight:700;padding:0 .2em;background:linear-gradient(transparent 50%,var(--mark) 50% 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sec ul,.traps ul{margin:0 0 12px;padding-left:20px}
.sec li,.traps li{margin-bottom:6px}
.ex{border-left:3px solid var(--line);padding-left:12px}
.ex p{margin:0 0 8px !important}
.ex .en{font-weight:600}
.ex .vi{color:var(--ink-2);font-size:.9375rem}
.traps{background:var(--bad-bg);border:1px solid #efc9c3;border-radius:12px;padding:18px}
.traps h3{margin:0 0 10px;font-size:1.125rem;color:var(--bad)}

/* Quiz */
.count{color:var(--ink-2);font-size:.9375rem;margin:0 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.qt{font-size:1.1875rem;font-weight:600;line-height:1.5;margin:14px 0}
.sentence{font-size:1.125rem;line-height:2;margin:-4px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.seg{border-bottom:2px solid var(--ink);padding-bottom:1px}
.seg::before{content:attr(data-l);font-size:.6875rem;font-weight:700;vertical-align:super;margin-right:3px;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{font-weight:800;color:var(--ink-2);min-width:1.1em}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .l{color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin-top:14px;border-radius:12px;padding:14px 16px}
.why.ok{background:var(--ok-bg);border:1px solid #b6dcc9}
.why.bad{background:var(--bad-bg);border:1px solid #efc9c3}
.why b{display:block;margin-bottom:4px}
.why.ok b{color:var(--ok)}
.why.bad b{color:var(--bad)}
.why p{margin:0}
.score{font-size:3.2rem;font-weight:800;line-height:1.1;margin:8px 0 4px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:.9375rem;z-index:30;max-width:90vw;text-align:center}
@media (min-width:861px){.toast{bottom:28px}}
.toast.link{cursor:pointer}
.banners{margin-bottom:16px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff4c2;border:1px solid #ecd978;border-radius:12px;padding:12px 16px;margin-bottom:10px}
.banner.info{background:var(--accent-bg);border-color:#c3d0f5}
.ask{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1.5px dashed #aab6d3;border-radius:12px;padding:14px 16px;margin:14px 0 0}
.ask div{display:flex;flex-direction:column;gap:2px}
.ask span{color:var(--ink-2);font-size:.875rem}
.qa-i{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.qa-i.new{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.qa-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qa-q{white-space:pre-wrap;margin:8px 0 10px}
.qa-a{background:var(--ok-bg);border:1px solid #b6dcc9;border-radius:10px;padding:10px 12px;margin-top:6px}
.qa-a small{color:var(--ok);font-weight:600}
.qa-a p{white-space:pre-wrap;margin:4px 0 0}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.swrow:last-of-type{border-bottom:0}
.swrow small{display:block;color:var(--ink-2);font-size:.8125rem;line-height:1.45;margin-top:2px;font-weight:400}
input.sw{-webkit-appearance:none;appearance:none;flex:none;width:46px;height:26px;border-radius:13px;background:#b9c3da;position:relative;cursor:pointer;border:0;transition:background .15s}
input.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
input.sw:checked{background:var(--accent)}
input.sw:checked::after{transform:translateX(20px)}
.timeinp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
/* Nội dung lý thuyết */
.gl p{margin:0 0 10px}
.gl ul{margin:0 0 12px;padding-left:22px}
.gl li{margin-bottom:5px}
.gl li ul{margin:4px 0 6px}
h3.gh2{font-size:1.2rem;font-weight:800;line-height:1.35;margin:26px 0 10px}
h3.gh2:first-child{margin-top:4px}
h4.gh3{font-size:1.05rem;font-weight:700;line-height:1.4;margin:20px 0 8px;color:var(--accent-dark)}
.tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:#fff}
table.gt{border-collapse:collapse;width:100%;font-size:.9375rem;line-height:1.5}
table.gt th{background:#eef2f9;text-align:left;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
table.gt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.gt tr:last-child td{border-bottom:0}
table.gt td:first-child{font-weight:600}
@media (max-width:640px){
  table.gt thead{display:none}
  table.gt,table.gt tbody,table.gt tr,table.gt td{display:block;width:100%}
  table.gt tr{padding:8px 0;border-bottom:1px solid var(--line)}
  table.gt tr:last-child{border-bottom:0}
  table.gt td{border:0;padding:3px 12px}
  table.gt td::before{content:attr(data-l);display:block;font-size:.75rem;font-weight:700;color:var(--ink-2)}
}
.gbox{background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:4px 10px 10px 4px;padding:12px 16px;margin:0 0 16px}
.gbox>h5{margin:0 0 8px;font-size:.75rem;font-weight:800;letter-spacing:.05em;color:var(--ink-2)}
.gbox.err{background:var(--bad-bg);border-color:#efc9c3;border-left-color:var(--bad)}
.gbox.err>h5{color:var(--bad)}
.gbox.ex{border-left-color:var(--ok)}
.gbox.rule{border-left-color:#7a8bb8}
.gbox.struct .gi{font-weight:700;background:linear-gradient(transparent 55%,var(--mark) 55% 92%,transparent 92%);display:table;padding:0 .2em;margin-bottom:6px}
.gi{margin:0 0 6px;line-height:1.55}
.gi.li0::before,.gi.li1::before{content:'\2022';margin-right:8px;color:var(--ink-2)}
.gi.li1{margin-left:22px}
.gi.lb{font-weight:700;margin-top:10px}
.gi.lb:first-of-type{margin-top:0}
.gi.no{color:var(--bad)}
.gi.yes{color:var(--ok)}
.gi.ar{color:var(--ink-2);font-size:.9375rem}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="shell" class="shell" hidden>
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="mtop" id="mtop"></div>
    <div id="app"></div>
  </main>
  <nav class="bnav" id="bnav" aria-label="Điều hướng"></nav>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== CẤU HÌNH (chỉ cần sửa ở đây) =====================
   1) Firebase Console > Project settings > Your apps > Web app: copy cấu hình dán vào FIREBASE_CONFIG.
   2) Firebase Authentication > bật Email/Password, rồi tạo 3 tài khoản bằng các email:

Every morning, Lan goes to school.</i> → chủ ngữ vẫn là Lan.", "lv": 0}, {"t": "p", "text": "Một câu tiếng Anh đầy đủ bắt buộc phải có động từ. <i>She very beautiful.</i> là SAI; phải là <i>She is very beautiful.</i>", "lv": 0}]}], "quiz": [{"t": "Chủ ngữ của câu “My sister works in a bank.” là gì?", "o": ["My sister", "works", "in a bank", "bank"], "a": 0, "e": "Hỏi “Ai works?” → My sister. Đó là chủ ngữ."}, {"t": "Động từ của câu “The students are very happy.” là gì?", "o": ["students", "are", "very", "happy"], "a": 1, "e": "Are là động từ be. Trong câu này không có động từ chỉ hành động nào khác."}, {"t": "Câu nào sau đây ĐỦ thành phần?", "o": ["She very tall.", "She is very tall.", "Very tall she.", "Is she very tall"], "a": 1, "e": "Câu tiếng Anh bắt buộc có động từ. “She is very tall.” có động từ is."}, {"t": "Tân ngữ của câu “Nam loves English songs.” là gì?", "o": ["Nam", "loves", "English songs", "English"], "a": 2, "e": "Hỏi “loves cái gì?” → English songs. Đó là tân ngữ."}, {"t": "Chủ ngữ của câu “Every morning, my father drinks coffee.” là gì?", "o": ["Every morning", "my father", "drinks", "coffee"], "a": 1, "e": "Every morning chỉ là trạng ngữ thời gian. Ai drinks? → my father."}, {"t": "“The cat on the sofa ___ very old.”", "o": ["be", "is", "are", "being"], "a": 1, "e": "Chủ ngữ là The cat (số ít) nên dùng is. Cụm on the sofa chỉ là phần chen ngang."}, {"t": "Câu “She sleeps.” thiếu thành phần nào không?", "o": ["Thiếu tân ngữ", "Thiếu động từ", "Không thiếu gì", "Thiếu chủ ngữ"], "a": 2, "e": "Sleep là động từ không cần tân ngữ, nên câu S + V đã đầy đủ."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">My friends</span> <span class=\"seg\" data-l=\"B\">is</span> <span class=\"seg\" data-l=\"C\">very</span> <span class=\"seg\" data-l=\"D\">kind</span>.", "o": ["My friends", "is", "very", "kind"], "a": 1, "e": "Chủ ngữ My friends là số nhiều nên phải dùng are, không dùng is."}, {"t": "Bổ ngữ trong câu “He became a doctor.” là gì?", "o": ["He", "became", "a doctor", "doctor became"], "a": 2, "e": "Sau became là bổ ngữ tả chủ ngữ He: a doctor."}, {"t": "Câu nào SAI?", "o": ["Lan and Nam study English.", "Lan studies English.", "Lan study English.", "Lan is studying English."], "a": 2, "e": "Chủ ngữ Lan số ít nên động từ phải thêm -s: studies."}]}, {"id": "n2", "title": "Ba động từ trụ cột: be, do, have", "desc": "Cách dùng am/is/are/was/were, do/does/did, have/has/had ở thể khẳng định, phủ định và nghi vấn.", "blocks": [{"t": "p", "text": "Ba động từ be, do, have xuất hiện trong hầu hết mọi câu tiếng Anh. Chúng vừa là động từ chính, vừa là trợ động từ giúp tạo câu phủ định và câu hỏi."}, {"t": "h", "lv": 2, "text": "Bảng chia ba động từ"}, {"t": "tbl", "rows": [["Chủ ngữ", "BE (hiện tại)", "BE (quá khứ)", "DO", "HAVE"], ["I", "am", "was", "do", "have"], ["You / We / They", "are", "were", "do", "have"], ["He / She / It", "is", "was", "does", "has"], ["Quá khứ chung", "—", "—", "did", "had"]]}, {"t": "h", "lv": 2, "text": "Tạo câu phủ định và câu hỏi"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Có BE → thêm not sau be, đảo be lên trước để hỏi. She is busy. → She is not busy. → Is she busy?", "lv": 0}, {"t": "p", "text": "Không có BE → mượn DO/DOES/DID. She works. → She does not work. → Does she work?", "lv": 0}, {"t": "p", "text": "Sau do/does/did, động từ chính luôn ở dạng NGUYÊN THỂ.", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I am a student. → I am not a student. → Am I a student? (Tôi là học sinh.)", "lv": 0}, {"t": "p", "text": "They play football. → They do not play football. → Do they play football? (Họ chơi bóng đá.)", "lv": 0}, {"t": "p", "text": "He has a car. → He does not have a car. → Does he have a car? (Anh ấy có một chiếc ô tô.)", "lv": 0}, {"t": "p", "text": "She went home. → She did not go home. → Did she go home? (Cô ấy đã về nhà.)", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Lỗi kinh điển"}, {"t": "tbl", "rows": [["Câu sai", "Câu đúng", "Vì sao"], ["She doesn’t goes.", "She doesn’t go.", "Sau does, động từ về nguyên thể"], ["Did you went?", "Did you go?", "Did đã mang nghĩa quá khứ rồi"], ["He don’t like it.", "He doesn’t like it.", "He đi với does"], ["She is work here.", "She works here.", "Không dùng be + động từ thường"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Have còn mang nghĩa “ăn, uống, trải qua”: <i>have breakfast</i> (ăn sáng), <i>have a good time</i> (có khoảng thời gian vui).", "lv": 0}, {"t": "p", "text": "Have got = have (có), dùng nhiều trong văn nói: <i>I’ve got two brothers.</i>", "lv": 0}]}], "quiz": [{"t": "She ___ a doctor.", "o": ["am", "is", "are", "be"], "a": 1, "e": "She là ngôi thứ ba số ít nên dùng is."}, {"t": "They ___ not like coffee.", "o": ["does", "do", "is", "are"], "a": 1, "e": "They đi với do. Dạng phủ định: do not like."}, {"t": "___ he live in Hanoi?", "o": ["Do", "Does", "Is", "Are"], "a": 1, "e": "He là ngôi thứ ba số ít, động từ thường live nên mượn Does."}, {"t": "He ___ breakfast at 7 every morning.", "o": ["have", "has", "is", "having"], "a": 1, "e": "He đi với has."}, {"t": "Chọn câu ĐÚNG.", "o": ["She doesn’t goes to school.", "She doesn’t go to school.", "She don’t go to school.", "She not go to school."], "a": 1, "e": "Sau doesn’t, động từ chính ở dạng nguyên thể: go."}, {"t": "Did you ___ to the party?", "o": ["went", "go", "going", "goes"], "a": 1, "e": "Did đã mang nghĩa quá khứ nên động từ chính về nguyên thể: go."}, {"t": "We ___ at home yesterday.", "o": ["are", "is", "were", "was"], "a": 2, "e": "We số nhiều, thời gian quá khứ yesterday → were."}, {"t": "___ you a teacher?", "o": ["Do", "Does", "Are", "Have"], "a": 2, "e": "Câu có be (a teacher là bổ ngữ) nên đảo be lên đầu: Are."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">My brother</span> <span class=\"seg\" data-l=\"B\">don't</span> <span class=\"seg\" data-l=\"C\">like</span> <span class=\"seg\" data-l=\"D\">football</span>.", "o": ["My brother", "don't", "like", "football"], "a": 1, "e": "My brother là ngôi thứ ba số ít nên phải dùng doesn’t."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">is</span> <span class=\"seg\" data-l=\"C\">work</span> <span class=\"seg\" data-l=\"D\">in a bank</span>.", "o": ["She", "is", "work", "in a bank"], "a": 2, "e": "Work là động từ thường, không đi kèm is. Phải viết She works in a bank."}]}, {"id": "n3", "title": "Chia động từ: thêm -s/-es, -ed, -ing", "desc": "Ba quy tắc biến đổi động từ quan trọng nhất và cách phát âm, viết đúng chính tả.", "blocks": [{"t": "p", "text": "Phần lớn lỗi sai trong đề thi đến từ việc chia sai đuôi động từ. Chỉ cần nắm ba bảng dưới đây là xử lý được hầu hết các trường hợp."}, {"t": "h", "lv": 2, "text": "1. Thêm -s / -es (dùng cho he, she, it ở hiện tại đơn)"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số động từ", "+ s", "work → works, play → plays"], ["Tận cùng -s, -sh, -ch, -x, -o", "+ es", "watch → watches, go → goes, fix → fixes"], ["Phụ âm + y", "đổi y → ies", "study → studies, carry → carries"], ["Nguyên âm + y", "+ s", "play → plays, buy → buys"]]}, {"t": "h", "lv": 2, "text": "2. Thêm -ed (quá khứ của động từ có quy tắc)"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số động từ", "+ ed", "work → worked"], ["Tận cùng -e", "+ d", "live → lived, hope → hoped"], ["Phụ âm + y", "đổi y → ied", "study → studied, try → tried"], ["1 âm tiết: nguyên âm + 1 phụ âm", "gấp đôi phụ âm + ed", "stop → stopped, plan → planned"]]}, {"t": "h", "lv": 2, "text": "3. Thêm -ing"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số động từ", "+ ing", "work → working"], ["Tận cùng -e câm", "bỏ e + ing", "make → making, write → writing"], ["1 âm tiết: nguyên âm + 1 phụ âm", "gấp đôi phụ âm + ing", "run → running, sit → sitting"], ["Tận cùng -ie", "đổi ie → y + ing", "lie → lying, die → dying"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "She studies English every day. (Cô ấy học tiếng Anh mỗi ngày.)", "lv": 0}, {"t": "p", "text": "They stopped the car. (Họ đã dừng xe lại.)", "lv": 0}, {"t": "p", "text": "He is writing a letter. (Anh ấy đang viết một lá thư.)", "lv": 0}, {"t": "p", "text": "The baby is lying on the bed. (Em bé đang nằm trên giường.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Không gấp đôi phụ âm nếu tận cùng là w, x, y: <i>play → played</i>, <i>fix → fixed</i>.", "lv": 0}, {"t": "p", "text": "Have là ngoại lệ: he/she/it → <b>has</b>, không phải “haves”.", "lv": 0}]}], "quiz": [{"t": "study → ngôi thứ ba số ít là gì?", "o": ["studys", "studies", "studyes", "studied"], "a": 1, "e": "Phụ âm d + y nên đổi y thành ies: studies."}, {"t": "go → ngôi thứ ba số ít là gì?", "o": ["gos", "goes", "goies", "going"], "a": 1, "e": "Tận cùng -o thì thêm es: goes."}, {"t": "stop → dạng quá khứ là gì?", "o": ["stoped", "stopped", "stopt", "stopping"], "a": 1, "e": "Một âm tiết, nguyên âm o + một phụ âm p nên gấp đôi p rồi thêm ed."}, {"t": "make → dạng V-ing là gì?", "o": ["makeing", "making", "makking", "maked"], "a": 1, "e": "Bỏ e câm rồi thêm ing: making."}, {"t": "play → dạng quá khứ là gì?", "o": ["plaied", "played", "playd", "plaed"], "a": 1, "e": "Nguyên âm a + y nên giữ nguyên y, chỉ thêm ed."}, {"t": "run → dạng V-ing là gì?", "o": ["runing", "running", "runnning", "runed"], "a": 1, "e": "Một âm tiết, gấp đôi n rồi thêm ing."}, {"t": "lie → dạng V-ing là gì?", "o": ["lieing", "lying", "liing", "lyeing"], "a": 1, "e": "Tận cùng -ie thì đổi thành y + ing: lying."}, {"t": "He ___ TV every evening.", "o": ["watch", "watchs", "watches", "watching"], "a": 2, "e": "Tận cùng -ch nên thêm es: watches."}, {"t": "fix → dạng quá khứ là gì?", "o": ["fixxed", "fixed", "fixt", "fixied"], "a": 1, "e": "Tận cùng -x thì không gấp đôi, chỉ thêm ed."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">My mother</span> <span class=\"seg\" data-l=\"B\">carrys</span> <span class=\"seg\" data-l=\"C\">the bag</span> <span class=\"seg\" data-l=\"D\">every day</span>.", "o": ["My mother", "carrys", "the bag", "every day"], "a": 1, "e": "Phụ âm r + y nên đổi y thành ies: carries."}]}, {"id": "n4", "title": "Động từ bất quy tắc thường gặp", "desc": "Bảng động từ bất quy tắc hay ra thi nhất, chia theo nhóm dễ nhớ.", "blocks": [{"t": "p", "text": "Động từ bất quy tắc không thêm -ed mà đổi hẳn hình dạng. Thay vì học thuộc lộn xộn, hãy nhóm chúng theo kiểu biến đổi."}, {"t": "h", "lv": 2, "text": "Nhóm 1 — Không đổi (V = V2 = V3)"}, {"t": "tbl", "rows": [["Nguyên thể", "Quá khứ", "Quá khứ phân từ", "Nghĩa"], ["cut", "cut", "cut", "cắt"], ["put", "put", "put", "đặt, để"], ["let", "let", "let", "cho phép"], ["cost", "cost", "cost", "trị giá"], ["read", "read", "read", "đọc (đọc khác nhau)"]]}, {"t": "h", "lv": 2, "text": "Nhóm 2 — V2 = V3"}, {"t": "tbl", "rows": [["Nguyên thể", "V2 / V3", "Nghĩa"], ["buy", "bought", "mua"], ["bring", "brought", "mang"], ["teach", "taught", "dạy"], ["think", "thought", "nghĩ"], ["find", "found", "tìm thấy"], ["keep", "kept", "giữ"], ["leave", "left", "rời đi"], ["meet", "met", "gặp"], ["say", "said", "nói"], ["tell", "told", "kể"]]}, {"t": "h", "lv": 2, "text": "Nhóm 3 — V, V2, V3 khác nhau cả ba"}, {"t": "tbl", "rows": [["Nguyên thể", "Quá khứ", "Quá khứ phân từ", "Nghĩa"], ["be", "was/were", "been", "thì, là"], ["go", "went", "gone", "đi"], ["do", "did", "done", "làm"], ["see", "saw", "seen", "nhìn thấy"], ["give", "gave", "given", "đưa, cho"], ["take", "took", "taken", "lấy"], ["write", "wrote", "written", "viết"], ["speak", "spoke", "spoken", "nói"], ["break", "broke", "broken", "làm vỡ"], ["know", "knew", "known", "biết"], ["begin", "began", "begun", "bắt đầu"], ["drink", "drank", "drunk", "uống"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I bought a new phone last week. (Tôi đã mua một chiếc điện thoại mới tuần trước.)", "lv": 0}, {"t": "p", "text": "She has written three letters. (Cô ấy đã viết ba lá thư.)", "lv": 0}, {"t": "p", "text": "They went to Da Nang in 2023. (Họ đã đi Đà Nẵng năm 2023.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "V2 dùng cho quá khứ đơn; V3 dùng sau have/has/had và trong câu bị động.", "lv": 0}, {"t": "p", "text": "Cẩn thận cặp dễ nhầm: <i>lie – lay – lain</i> (nằm) và <i>lay – laid – laid</i> (đặt).", "lv": 0}]}], "quiz": [{"t": "I ___ a new book yesterday.", "o": ["buy", "bought", "buyed", "buying"], "a": 1, "e": "Yesterday là dấu hiệu quá khứ, buy có V2 là bought."}, {"t": "She has ___ the letter already.", "o": ["write", "wrote", "written", "writing"], "a": 2, "e": "Sau has dùng V3: written."}, {"t": "V3 của “go” là gì?", "o": ["went", "gone", "goed", "going"], "a": 1, "e": "go – went – gone."}, {"t": "They ___ me a present last Tet.", "o": ["give", "gave", "given", "giving"], "a": 1, "e": "Last Tet là quá khứ nên dùng V2: gave."}, {"t": "V2 của “teach” là gì?", "o": ["teached", "taught", "teacht", "teaches"], "a": 1, "e": "teach – taught – taught."}, {"t": "The glass was ___ by my brother.", "o": ["break", "broke", "broken", "breaking"], "a": 2, "e": "Câu bị động dùng V3: broken."}, {"t": "He ___ the door and left.", "o": ["shut", "shutted", "shuts", "shutting"], "a": 0, "e": "Shut thuộc nhóm không đổi hình dạng."}, {"t": "V3 của “speak” là gì?", "o": ["spoke", "spoken", "speaked", "speaking"], "a": 1, "e": "speak – spoke – spoken."}, {"t": "We have ___ each other since 2020.", "o": ["know", "knew", "known", "knowing"], "a": 2, "e": "Sau have dùng V3: known."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">has</span> <span class=\"seg\" data-l=\"C\">drank</span> <span class=\"seg\" data-l=\"D\">all the milk</span>.", "o": ["She", "has", "drank", "all the milk"], "a": 2, "e": "Sau has phải dùng V3 là drunk, không dùng V2 drank."}]}, {"id": "n5", "title": "Danh từ số ít, số nhiều và a / an / the", "desc": "Quy tắc tạo số nhiều và cách chọn mạo từ a, an, the cho người mới bắt đầu.", "blocks": [{"t": "p", "text": "Danh từ tiếng Anh luôn phải trả lời hai câu hỏi: một hay nhiều, và đã xác định hay chưa xác định. Trả lời đúng hai câu này là dùng đúng số nhiều và mạo từ."}, {"t": "h", "lv": 2, "text": "Tạo danh từ số nhiều"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số", "+ s", "book → books, pen → pens"], ["Tận cùng -s, -sh, -ch, -x, -o", "+ es", "box → boxes, tomato → tomatoes"], ["Phụ âm + y", "y → ies", "city → cities, baby → babies"], ["Tận cùng -f, -fe", "đổi thành -ves", "leaf → leaves, knife → knives"], ["Bất quy tắc", "đổi hẳn", "man → men, child → children, foot → feet, tooth → teeth"]]}, {"t": "h", "lv": 2, "text": "Chọn a hay an"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "a + từ bắt đầu bằng ÂM phụ âm: a book, a university (đọc là /ju/), a European country", "lv": 0}, {"t": "p", "text": "an + từ bắt đầu bằng ÂM nguyên âm: an apple, an hour (h câm), an honest man", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Khi nào dùng THE"}, {"t": "tbl", "rows": [["Dùng the khi", "Ví dụ"], ["Đã nhắc đến trước đó", "I saw a dog. <b>The</b> dog was black."], ["Cả người nói và người nghe đều biết", "Close <b>the</b> door, please."], ["Vật duy nhất trên đời", "<b>the</b> sun, <b>the</b> moon, <b>the</b> earth"], ["Trước so sánh nhất, số thứ tự", "<b>the</b> best, <b>the</b> first"], ["Trước tên sông, biển, dãy núi, nhóm đảo", "<b>the</b> Mekong, <b>the</b> Pacific"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I have a cat. The cat is very cute. (Tôi có một con mèo. Con mèo đó rất dễ thương.)", "lv": 0}, {"t": "p", "text": "She is an engineer. (Cô ấy là một kỹ sư.)", "lv": 0}, {"t": "p", "text": "He is the tallest student in my class. (Anh ấy là học sinh cao nhất lớp tôi.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "KHÔNG dùng the trước: tên riêng (Lan, Vietnam), bữa ăn (have breakfast), môn thể thao (play football), môn học (study math).", "lv": 0}, {"t": "p", "text": "Danh từ không đếm được (water, money, information, advice) không có số nhiều và không dùng a/an.", "lv": 0}]}], "quiz": [{"t": "Số nhiều của “child” là gì?", "o": ["childs", "childes", "children", "childrens"], "a": 2, "e": "Child là danh từ bất quy tắc: children."}, {"t": "Số nhiều của “knife” là gì?", "o": ["knifes", "knives", "knifies", "knife"], "a": 1, "e": "Tận cùng -fe đổi thành -ves: knives."}, {"t": "She is ___ honest girl.", "o": ["a", "an", "the", "không điền gì"], "a": 1, "e": "Honest có h câm, bắt đầu bằng âm nguyên âm nên dùng an."}, {"t": "He studies at ___ university in Hanoi.", "o": ["a", "an", "the", "không điền gì"], "a": 0, "e": "University đọc là /ju/, âm phụ âm nên dùng a."}, {"t": "I bought a book. ___ book is very interesting.", "o": ["A", "An", "The", "không điền gì"], "a": 2, "e": "Danh từ đã được nhắc đến ở câu trước nên dùng the."}, {"t": "Số nhiều của “city” là gì?", "o": ["citys", "cities", "cityes", "citi"], "a": 1, "e": "Phụ âm t + y nên đổi y thành ies."}, {"t": "Chọn câu ĐÚNG.", "o": ["I have many informations.", "I have much information.", "I have an information.", "I have informations."], "a": 1, "e": "Information là danh từ không đếm được, không có số nhiều và dùng much."}, {"t": "We usually have ___ breakfast at 6.", "o": ["a", "an", "the", "không điền gì"], "a": 3, "e": "Trước tên bữa ăn không dùng mạo từ."}, {"t": "___ sun rises in the east.", "o": ["A", "An", "The", "không điền gì"], "a": 2, "e": "Mặt trời là vật duy nhất nên dùng the."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">There</span> <span class=\"seg\" data-l=\"B\">are</span> <span class=\"seg\" data-l=\"C\">three</span> <span class=\"seg\" data-l=\"D\">tooths</span> in the box.", "o": ["There", "are", "three", "tooths"], "a": 3, "e": "Tooth là danh từ bất quy tắc, số nhiều là teeth."}]}, {"id": "u4", "title": "Từ loại và vị trí trong câu", "desc": "Tám từ loại chính và mẹo nhìn vị trí chỗ trống để chọn đúng loại từ.", "blocks": [{"t": "p", "text": "Đề thi rất hay cho một chỗ trống và bốn đáp án cùng gốc từ. Mẹo xử lý không phải là dịch nghĩa, mà là nhìn xem chỗ trống đứng ở vị trí nào."}, {"t": "h", "lv": 2, "text": "Tám từ loại chính"}, {"t": "tbl", "rows": [["Từ loại", "Chức năng", "Ví dụ"], ["Danh từ (noun)", "Gọi tên người, vật, ý tưởng", "teacher, city, freedom"], ["Đại từ (pronoun)", "Thay thế danh từ", "he, she, it, they, who"], ["Động từ (verb)", "Chỉ hành động hoặc trạng thái", "run, think, is/am/are"], ["Tính từ (adjective)", "Tả danh từ", "happy, large, blue"], ["Trạng từ (adverb)", "Tả động từ, tính từ, trạng từ khác", "quickly, very, always"], ["Giới từ (preposition)", "Nối danh từ với phần còn lại", "in, on, at, between"], ["Liên từ (conjunction)", "Nối từ, cụm, mệnh đề", "and, but, because, although"], ["Mạo từ (article)", "Xác định hay không xác định", "a, an, the"]]}, {"t": "h", "lv": 2, "text": "Bảng vàng: nhìn vị trí, chọn từ loại"}, {"t": "tbl", "rows": [["Chỗ trống đứng ở đâu", "Điền loại từ gì", "Ví dụ"], ["Sau a / the / my / her…", "Danh từ", "her <b>decision</b>"], ["Trước một danh từ", "Tính từ", "a <b>successful</b> woman"], ["Sau be, feel, seem, become, look", "Tính từ", "She feels <b>happy</b>."], ["Sau một động từ thường", "Trạng từ", "She drives <b>carefully</b>."], ["Trước tính từ hoặc trạng từ khác", "Trạng từ", "<b>extremely</b> important"], ["Sau can, must, will, should", "Động từ nguyên thể không to", "She must <b>go</b> now."]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "She is a talented singer. (Cô ấy là một ca sĩ tài năng.) → trước danh từ singer nên dùng tính từ.", "lv": 0}, {"t": "p", "text": "She sings beautifully. (Cô ấy hát rất hay.) → sau động từ sings nên dùng trạng từ.", "lv": 0}, {"t": "p", "text": "Her decision was difficult. (Quyết định của cô ấy thật khó khăn.) → sau her nên dùng danh từ.", "lv": 0}, {"t": "p", "text": "It is extremely important. (Điều đó cực kỳ quan trọng.) → trước tính từ important nên dùng trạng từ.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Một số từ đuôi -ly nhưng là TÍNH TỪ: friendly, lovely, lonely, likely. Ví dụ: <i>a friendly man</i>.", "lv": 0}, {"t": "p", "text": "Fast, hard, late, early vừa là tính từ vừa là trạng từ: <i>a fast car</i> / <i>He runs fast.</i>", "lv": 0}, {"t": "p", "text": "Hardly nghĩa là “hầu như không”, khác hẳn hard: <i>I hardly know him.</i> (Tôi hầu như không biết anh ta.)", "lv": 0}]}], "quiz": [{"t": "She is a ___ singer.", "o": ["talent", "talented", "talentedly", "talents"], "a": 1, "e": "Trước danh từ singer cần tính từ: talented."}, {"t": "She sings ___ .", "o": ["beautiful", "beauty", "beautifully", "beautify"], "a": 2, "e": "Bổ nghĩa cho động từ sings nên dùng trạng từ."}, {"t": "She feels ___ today.", "o": ["happy", "happily", "happiness", "to happy"], "a": 0, "e": "Feel là động từ liên kết nên sau nó dùng tính từ."}, {"t": "Her ___ to leave was difficult.", "o": ["decide", "decision", "decisive", "decisively"], "a": 1, "e": "Sau tính từ sở hữu her cần danh từ."}, {"t": "It is ___ important to check your answers.", "o": ["extreme", "extremely", "extremity", "extremes"], "a": 1, "e": "Trước tính từ important cần trạng từ."}, {"t": "She must ___ now.", "o": ["goes", "going", "go", "to go"], "a": 2, "e": "Sau must dùng động từ nguyên thể không to."}, {"t": "Từ nào là TÍNH TỪ?", "o": ["quickly", "lovely", "carefully", "always"], "a": 1, "e": "Lovely có đuôi -ly nhưng là tính từ."}, {"t": "The ___ of the building took two years.", "o": ["construct", "construction", "constructive", "constructively"], "a": 1, "e": "Sau the cần danh từ."}, {"t": "He works very ___ .", "o": ["hard", "hardly", "harder than", "hardness"], "a": 0, "e": "Hard là trạng từ nghĩa “chăm chỉ”; hardly nghĩa “hầu như không”."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">My brother</span> <span class=\"seg\" data-l=\"B\">drives</span> <span class=\"seg\" data-l=\"C\">very</span> <span class=\"seg\" data-l=\"D\">careful</span> to school.", "o": ["My brother", "drives", "very", "careful"], "a": 3, "e": "Careful bổ nghĩa cho động từ drives nên phải là trạng từ carefully."}]}, {"id": "u5", "title": "Danh từ, mạo từ và đại từ", "desc": "Danh từ đếm được và không đếm được, cách dùng a/an/the và các loại đại từ.", "blocks": [{"t": "p", "text": "Ba nhóm từ này luôn đi cùng nhau trong câu, nên thường được hỏi chung trong một câu đề thi."}, {"t": "h", "lv": 2, "text": "Đếm được và không đếm được"}, {"t": "tbl", "rows": [["Loại", "Đặc điểm", "Đi với", "Ví dụ"], ["Đếm được", "Có số nhiều", "a/an, many, few, a number of", "book, student, idea"], ["Không đếm được", "Không có số nhiều", "much, little, a great deal of", "water, money, information, advice, news"], ["Dùng cho cả hai", "", "some, any, a lot of, plenty of", "some books / some water"]]}, {"t": "h", "lv": 2, "text": "Mạo từ: chọn nhanh"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "a/an → nhắc lần đầu, chưa xác định: I met a doctor yesterday.", "lv": 0}, {"t": "p", "text": "the → đã xác định, cả hai bên đều biết: The doctor was very kind.", "lv": 0}, {"t": "p", "text": "không mạo từ → danh từ số nhiều hoặc không đếm được nói chung: Books are expensive. / Water is important.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Các loại đại từ"}, {"t": "tbl", "rows": [["Loại", "Danh sách", "Ví dụ"], ["Chủ ngữ", "I, you, he, she, it, we, they", "<b>She</b> is my friend."], ["Tân ngữ", "me, you, him, her, it, us, them", "I saw <b>her</b> yesterday."], ["Sở hữu (trước danh từ)", "my, your, his, her, its, our, their", "<b>my</b> book"], ["Sở hữu (đứng một mình)", "mine, yours, his, hers, ours, theirs", "This book is <b>mine</b>."], ["Phản thân", "myself, yourself, himself…", "She did it <b>herself</b>."]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I need some advice. (Tôi cần vài lời khuyên.) → advice không đếm được, không thêm s.", "lv": 0}, {"t": "p", "text": "There are many students in the class. (Có nhiều học sinh trong lớp.)", "lv": 0}, {"t": "p", "text": "This bag is hers, not mine. (Cái túi này là của cô ấy, không phải của tôi.)", "lv": 0}, {"t": "p", "text": "He hurt himself while cooking. (Anh ấy tự làm mình bị thương khi nấu ăn.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Các danh từ hay bị nhầm là đếm được: <b>advice, information, furniture, luggage, equipment, news, money</b> → đều KHÔNG đếm được.", "lv": 0}, {"t": "p", "text": "Its = của nó (sở hữu). It’s = it is. Đây là lỗi sai rất hay ra thi.", "lv": 0}]}], "quiz": [{"t": "I need some ___ about the course.", "o": ["informations", "information", "an information", "informations’"], "a": 1, "e": "Information là danh từ không đếm được."}, {"t": "There aren’t ___ students in the room.", "o": ["much", "many", "a little", "a great deal of"], "a": 1, "e": "Students đếm được số nhiều nên dùng many."}, {"t": "This pen isn’t mine. It’s ___ .", "o": ["her", "she", "hers", "herself"], "a": 2, "e": "Đứng một mình, không có danh từ theo sau nên dùng hers."}, {"t": "She cut ___ while cooking.", "o": ["her", "hers", "herself", "she"], "a": 2, "e": "Chủ ngữ và tân ngữ cùng là một người nên dùng đại từ phản thân."}, {"t": "The dog wagged ___ tail.", "o": ["it’s", "its", "its’", "it is"], "a": 1, "e": "Its là tính từ sở hữu; it’s là it is."}, {"t": "I met ___ old man on the bus.", "o": ["a", "an", "the", "không điền gì"], "a": 1, "e": "Old bắt đầu bằng âm nguyên âm nên dùng an."}, {"t": "___ is important for our health.", "o": ["A water", "The waters", "Water", "Waters"], "a": 2, "e": "Nói chung về nước, danh từ không đếm được, không dùng mạo từ."}, {"t": "My parents gave ___ a new phone.", "o": ["I", "me", "my", "mine"], "a": 1, "e": "Sau động từ gave cần đại từ tân ngữ: me."}, {"t": "Chọn câu ĐÚNG.", "o": ["He has many money.", "He has much money.", "He has a money.", "He has moneys."], "a": 1, "e": "Money không đếm được nên dùng much."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">gave</span> <span class=\"seg\" data-l=\"C\">I</span> <span class=\"seg\" data-l=\"D\">a book</span> yesterday.", "o": ["She", "gave", "I", "a book"], "a": 2, "e": "Sau động từ gave phải dùng đại từ tân ngữ me, không dùng I."}]}, {"id": "u6", "title": "Động từ, tính từ và trạng từ", "desc": "Phân loại động từ, trật tự tính từ và cách tạo, đặt vị trí trạng từ.", "blocks": [{"t": "p", "text": "Nhóm này quyết định phần “thịt” của câu: hành động gì, tính chất ra sao, diễn ra như thế nào."}, {"t": "h", "lv": 2, "text": "Ba loại động từ cần phân biệt"}, {"t": "tbl", "rows": [["Loại", "Đặc điểm", "Ví dụ"], ["Động từ thường", "Chỉ hành động, cần do/does/did để hỏi và phủ định", "work, play, study"], ["Động từ liên kết", "Theo sau là TÍNH TỪ, không phải trạng từ", "be, become, seem, look, feel, taste, sound"], ["Trợ động từ / khuyết thiếu", "Theo sau là động từ nguyên thể", "can, must, will, should, may"]]}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Động từ liên kết + tính từ: The soup tastes <b>good</b>. (KHÔNG dùng well)", "lv": 0}, {"t": "p", "text": "Động từ thường + trạng từ: He plays football <b>well</b>.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Trật tự tính từ khi có nhiều tính từ"}, {"t": "p", "text": "Thứ tự chuẩn: Ý kiến – Kích cỡ – Tuổi – Hình dáng – Màu sắc – Nguồn gốc – Chất liệu – Mục đích + danh từ."}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "a beautiful small old round brown Vietnamese wooden dining table", "lv": 0}, {"t": "p", "text": "Thực tế đề thi thường chỉ hỏi 2–3 tính từ: <i>a nice new car</i>, <i>a big black dog</i>.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Tạo và đặt trạng từ"}, {"t": "tbl", "rows": [["Cách tạo", "Ví dụ"], ["tính từ + ly", "quick → quickly, careful → carefully"], ["tận cùng -y → ily", "happy → happily, easy → easily"], ["tận cùng -le → ly", "simple → simply, terrible → terribly"], ["bất quy tắc", "good → well, fast → fast, hard → hard"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Trạng từ tần suất (always, usually, often, sometimes, never) đứng TRƯỚC động từ thường nhưng SAU động từ be: <i>She always comes late.</i> / <i>She is always late.</i>", "lv": 0}, {"t": "p", "text": "<i>He looks good</i> = trông đẹp. <i>He looks well</i> = trông khoẻ mạnh. Cả hai đều đúng nhưng khác nghĩa.", "lv": 0}]}], "quiz": [{"t": "The soup tastes ___ .", "o": ["well", "good", "goodly", "better than"], "a": 1, "e": "Taste là động từ liên kết nên theo sau là tính từ good."}, {"t": "He plays the guitar ___ .", "o": ["good", "well", "goodly", "nice"], "a": 1, "e": "Bổ nghĩa cho động từ thường plays nên dùng trạng từ well."}, {"t": "She ___ comes to class late.", "o": ["always", "is always", "always is", "be always"], "a": 0, "e": "Trạng từ tần suất đứng trước động từ thường comes."}, {"t": "She ___ late for the meeting.", "o": ["always is", "is always", "always", "be always"], "a": 1, "e": "Với động từ be, trạng từ tần suất đứng sau be."}, {"t": "Trạng từ của “happy” là gì?", "o": ["happyly", "happily", "happyly", "happiness"], "a": 1, "e": "Tận cùng -y đổi thành -ily: happily."}, {"t": "I bought a ___ car.", "o": ["new nice red", "nice new red", "red nice new", "new red nice"], "a": 1, "e": "Thứ tự: ý kiến (nice) – tuổi (new) – màu (red)."}, {"t": "Trạng từ của “simple” là gì?", "o": ["simplely", "simply", "simpley", "simpleness"], "a": 1, "e": "Tận cùng -le thì bỏ e thêm y: simply."}, {"t": "The music sounds ___ .", "o": ["wonderfully", "wonderful", "wonder", "wonders"], "a": 1, "e": "Sound là động từ liên kết nên theo sau là tính từ."}, {"t": "He runs very ___ .", "o": ["fastly", "fast", "fastly", "faster"], "a": 1, "e": "Fast vừa là tính từ vừa là trạng từ, không có dạng fastly."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">The cake</span> <span class=\"seg\" data-l=\"B\">tastes</span> <span class=\"seg\" data-l=\"C\">deliciously</span> <span class=\"seg\" data-l=\"D\">to me</span>.", "o": ["The cake", "tastes", "deliciously", "to me"], "a": 2, "e": "Taste là động từ liên kết nên phải dùng tính từ delicious."}]}, {"id": "u7", "title": "Giới từ chỉ thời gian và nơi chốn", "desc": "Cách chọn in, on, at và các giới từ hay ra thi khác.", "blocks": [{"t": "p", "text": "Giới từ hầu như không dịch sát được sang tiếng Việt, nên cách học hiệu quả nhất là nhớ theo công thức “to – nhỏ dần”."}, {"t": "h", "lv": 2, "text": "in / on / at chỉ thời gian"}, {"t": "tbl", "rows": [["Giới từ", "Dùng cho", "Ví dụ"], ["in", "Tháng, năm, mùa, buổi trong ngày", "in May, in 2024, in summer, in the morning"], ["on", "Ngày, thứ, ngày lễ cụ thể", "on Monday, on July 5th, on Christmas Day"], ["at", "Giờ, thời điểm chính xác", "at 7 o’clock, at noon, at night, at the weekend"]]}, {"t": "h", "lv": 2, "text": "in / on / at chỉ nơi chốn"}, {"t": "tbl", "rows": [["Giới từ", "Dùng cho", "Ví dụ"], ["in", "Không gian có ranh giới, thành phố, nước", "in the room, in Hanoi, in Vietnam"], ["on", "Bề mặt, đường phố, phương tiện công cộng", "on the table, on Le Loi Street, on the bus"], ["at", "Một điểm cụ thể, địa chỉ số nhà", "at the bus stop, at 25 Tran Phu Street, at home"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I was born in 2005, in May, on May 5th, at 6 a.m. (Càng cụ thể thì giới từ càng “nhỏ”.)", "lv": 0}, {"t": "p", "text": "She lives in Hanoi, on Hang Bai Street, at number 30.", "lv": 0}, {"t": "p", "text": "He is waiting at the bus stop. (Anh ấy đang đợi ở bến xe buýt.)", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Giới từ khác hay ra thi"}, {"t": "tbl", "rows": [["Giới từ", "Nghĩa", "Ví dụ"], ["for + khoảng thời gian", "trong bao lâu", "for two years"], ["since + mốc thời gian", "từ khi nào", "since 2020"], ["during + danh từ", "trong suốt", "during the holiday"], ["between A and B", "giữa hai vật", "between the bank and the shop"], ["among", "giữa nhiều vật", "among the students"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Sau giới từ, động từ luôn ở dạng V-ing: <i>He is good at <b>playing</b> chess.</i>", "lv": 0}, {"t": "p", "text": "Cụm cố định hay thi: <i>in time</i> (kịp giờ) / <i>on time</i> (đúng giờ), <i>at the end of</i> (vào cuối) / <i>in the end</i> (cuối cùng thì).", "lv": 0}]}], "quiz": [{"t": "I usually get up ___ 6 o’clock.", "o": ["in", "on", "at", "for"], "a": 2, "e": "Giờ cụ thể dùng at."}, {"t": "My birthday is ___ July.", "o": ["in", "on", "at", "during"], "a": 0, "e": "Tháng dùng in."}, {"t": "We will meet ___ Monday.", "o": ["in", "on", "at", "for"], "a": 1, "e": "Thứ trong tuần dùng on."}, {"t": "She has lived here ___ 2019.", "o": ["for", "since", "in", "during"], "a": 1, "e": "2019 là mốc thời gian nên dùng since."}, {"t": "He has worked here ___ five years.", "o": ["since", "for", "in", "at"], "a": 1, "e": "Five years là khoảng thời gian nên dùng for."}, {"t": "The book is ___ the table.", "o": ["in", "on", "at", "among"], "a": 1, "e": "Bề mặt dùng on."}, {"t": "He is good at ___ English.", "o": ["speak", "speaks", "speaking", "to speak"], "a": 2, "e": "Sau giới từ at dùng V-ing."}, {"t": "The shop is ___ the bank and the school.", "o": ["among", "between", "in", "during"], "a": 1, "e": "Giữa hai vật dùng between."}, {"t": "They live ___ Vietnam.", "o": ["at", "on", "in", "for"], "a": 2, "e": "Tên nước dùng in."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">was</span> <span class=\"seg\" data-l=\"C\">born</span> <span class=\"seg\" data-l=\"D\">in July 5th</span>.", "o": ["She", "was", "born", "in July 5th"], "a": 3, "e": "Ngày cụ thể phải dùng on: on July 5th."}]}, {"id": "u7b", "title": "Liên từ nối câu", "desc": "FANBOYS, liên từ phụ thuộc và các cặp liên từ tương quan.", "blocks": [{"t": "p", "text": "Liên từ là chất keo nối các phần của câu. Chọn sai liên từ là sai nghĩa, nên đề thi rất hay khai thác."}, {"t": "h", "lv": 2, "text": "Nhóm 1 — Liên từ đẳng lập: FANBOYS"}, {"t": "tbl", "rows": [["Liên từ", "Nghĩa", "Ví dụ"], ["for", "bởi vì", "He stayed home, for he was sick."], ["and", "và", "I like tea and coffee."], ["nor", "cũng không", "She doesn’t smoke, nor does she drink."], ["but", "nhưng", "He is poor but happy."], ["or", "hoặc", "You can call or text me."], ["yet", "tuy nhiên", "It was cold, yet he went out."], ["so", "vì vậy", "It rained, so we stayed in."]]}, {"t": "h", "lv": 2, "text": "Nhóm 2 — Liên từ phụ thuộc"}, {"t": "tbl", "rows": [["Ý nghĩa", "Liên từ", "Ví dụ"], ["Nguyên nhân", "because, since, as", "She left because she was tired."], ["Tương phản", "although, though, even though, while", "Although it rained, we went out."], ["Thời gian", "when, while, before, after, as soon as", "Call me when you arrive."], ["Điều kiện", "if, unless, as long as", "Unless you hurry, you’ll be late."], ["Mục đích", "so that, in order that", "He studies hard so that he can pass."]]}, {"t": "h", "lv": 2, "text": "Nhóm 3 — Cặp liên từ tương quan"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "both A and B → Both Lan and Nam are students.", "lv": 0}, {"t": "p", "text": "either A or B → You can either stay or leave.", "lv": 0}, {"t": "p", "text": "neither A nor B → Neither he nor I am ready.", "lv": 0}, {"t": "p", "text": "not only A but also B → She is not only smart but also kind.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "KHÔNG dùng hai liên từ cùng lúc. Sai: <i>Although it rained, but we went out.</i> Đúng: bỏ một trong hai.", "lv": 0}, {"t": "p", "text": "<b>Because</b> + mệnh đề (có S + V); <b>because of</b> + danh từ. Tương tự: <b>although</b> + mệnh đề; <b>despite / in spite of</b> + danh từ.", "lv": 0}]}], "quiz": [{"t": "He was tired, ___ he kept working.", "o": ["so", "but", "because", "and"], "a": 1, "e": "Hai vế tương phản nên dùng but."}, {"t": "___ it was raining, we went out.", "o": ["Because", "Although", "So", "And"], "a": 1, "e": "Vế sau trái ngược vế trước nên dùng Although."}, {"t": "She was absent ___ her illness.", "o": ["because", "because of", "although", "so"], "a": 1, "e": "Her illness là danh từ nên dùng because of."}, {"t": "___ Lan ___ Nam can speak French.", "o": ["Both / and", "Either / and", "Neither / or", "Not only / and"], "a": 0, "e": "Cặp chuẩn là both… and…"}, {"t": "Neither he ___ I am responsible.", "o": ["or", "nor", "and", "but"], "a": 1, "e": "Đi với neither là nor."}, {"t": "Chọn câu ĐÚNG.", "o": ["Although he was ill, but he came.", "Although he was ill, he came.", "Because he was ill, so he came.", "Despite he was ill, he came."], "a": 1, "e": "Không dùng hai liên từ cùng lúc; despite phải đi với danh từ."}, {"t": "Call me ___ you arrive.", "o": ["so", "but", "as soon as", "although"], "a": 2, "e": "Diễn tả thời gian nên dùng as soon as."}, {"t": "She is not only beautiful ___ also intelligent.", "o": ["and", "but", "or", "nor"], "a": 1, "e": "Cặp chuẩn là not only… but also…"}, {"t": "___ you study hard, you will fail.", "o": ["If", "Unless", "Because", "Although"], "a": 1, "e": "Unless nghĩa là “nếu không”, hợp nghĩa với vế sau."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">In spite of</span> <span class=\"seg\" data-l=\"B\">he was tired</span> <span class=\"seg\" data-l=\"C\">,</span> <span class=\"seg\" data-l=\"D\">he kept working</span>.", "o": ["In spite of", "he was tired", ",", "he kept working"], "a": 1, "e": "In spite of phải đi với danh từ; đứng trước mệnh đề phải dùng Although."}]}, {"id": "u8", "title": "Cấu tạo từ và cách xử lý câu word form", "desc": "Tiền tố, hậu tố thường gặp và quy trình bốn bước giải câu điền dạng từ.", "blocks": [{"t": "p", "text": "Câu word form là dạng ăn điểm chắc nhất nếu bạn thuộc bảng hậu tố. Không cần hiểu hết nghĩa câu vẫn chọn được đáp án đúng."}, {"t": "h", "lv": 2, "text": "Hậu tố — nhìn đuôi biết từ loại"}, {"t": "tbl", "rows": [["Từ loại", "Hậu tố thường gặp", "Ví dụ"], ["Danh từ", "-tion, -sion, -ment, -ness, -ity, -ance, -ence, -er, -or, -ist", "decision, movement, happiness, ability, teacher"], ["Tính từ", "-ful, -less, -able, -ible, -ive, -ous, -al, -y, -ic", "useful, careless, comfortable, active, famous"], ["Động từ", "-ize, -ify, -en, -ate", "modernize, simplify, widen, activate"], ["Trạng từ", "-ly", "quickly, carefully"]]}, {"t": "h", "lv": 2, "text": "Tiền tố — nhìn đầu biết nghĩa"}, {"t": "tbl", "rows": [["Tiền tố", "Nghĩa", "Ví dụ"], ["un-, in-, im-, il-, ir-, dis-", "phủ định", "unhappy, impossible, illegal, irregular, dislike"], ["re-", "lại", "rewrite, rebuild"], ["mis-", "sai", "misunderstand"], ["over- / under-", "quá mức / chưa đủ", "overwork, underestimate"], ["pre- / post-", "trước / sau", "prepare, postwar"]]}, {"t": "h", "lv": 2, "text": "Quy trình 4 bước giải câu word form"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Bước 1: Che hết đáp án, nhìn chỗ trống đứng ở vị trí nào trong câu.", "lv": 0}, {"t": "p", "text": "Bước 2: Dựa vào bảng vị trí ở bài u4, xác định cần DANH TỪ, TÍNH TỪ, ĐỘNG TỪ hay TRẠNG TỪ.", "lv": 0}, {"t": "p", "text": "Bước 3: Chọn đáp án có hậu tố khớp với từ loại đó.", "lv": 0}, {"t": "p", "text": "Bước 4: Kiểm tra nghĩa khẳng định hay phủ định để quyết định có cần tiền tố un-, im-, dis- hay không.", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "His ___ was a surprise. (resign) → sau his cần danh từ → resignation.", "lv": 0}, {"t": "p", "text": "The test was ___ difficult. (extreme) → trước tính từ cần trạng từ → extremely.", "lv": 0}, {"t": "p", "text": "It is ___ to finish in one day. (possible) → nghĩa câu là không thể → impossible.", "lv": 0}, {"t": "p", "text": "They want to ___ the system. (modern) → sau to cần động từ → modernize.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Hai danh từ cùng gốc nhưng khác nghĩa rất hay ra thi: <i>economy</i> (nền kinh tế) – <i>economics</i> (kinh tế học) – <i>economist</i> (nhà kinh tế).", "lv": 0}, {"t": "p", "text": "Bẫy người và vật: <i>employer</i> (chủ) – <i>employee</i> (nhân viên); <i>interested</i> (cảm thấy thích) – <i>interesting</i> (gây thích thú).", "lv": 0}]}], "quiz": [{"t": "His ___ surprised everyone. (resign)", "o": ["resign", "resigned", "resignation", "resignedly"], "a": 2, "e": "Sau his cần danh từ: resignation."}, {"t": "It is ___ to finish in one day. (possible)", "o": ["possible", "impossible", "possibly", "possibility"], "a": 1, "e": "Nghĩa câu là không thể nên dùng tiền tố phủ định im-."}, {"t": "The government wants to ___ the industry. (modern)", "o": ["modern", "modernly", "modernize", "modernity"], "a": 2, "e": "Sau to cần động từ: modernize."}, {"t": "She answered the question ___ . (correct)", "o": ["correct", "correctly", "correction", "corrective"], "a": 1, "e": "Bổ nghĩa cho động từ answered nên dùng trạng từ."}, {"t": "He is an ___ of the company. (employ)", "o": ["employ", "employer", "employee", "employment"], "a": 2, "e": "Là người làm thuê trong công ty nên dùng employee."}, {"t": "The film was very ___ . (interest)", "o": ["interest", "interested", "interesting", "interestingly"], "a": 2, "e": "Vật gây thích thú nên dùng interesting."}, {"t": "Từ nào là ĐỘNG TỪ?", "o": ["simplify", "simplicity", "simple", "simply"], "a": 0, "e": "Hậu tố -ify tạo động từ."}, {"t": "This machine is very ___ . (use)", "o": ["use", "useful", "usefully", "usefulness"], "a": 1, "e": "Sau be very cần tính từ: useful."}, {"t": "He ___ what I said. (understand)", "o": ["misunderstood", "understanding", "understandable", "understandably"], "a": 0, "e": "Cần động từ chia quá khứ; mis- nghĩa là hiểu sai."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">The</span> <span class=\"seg\" data-l=\"B\">develop</span> <span class=\"seg\" data-l=\"C\">of the city</span> <span class=\"seg\" data-l=\"D\">was fast</span>.", "o": ["The", "develop", "of the city", "was fast"], "a": 1, "e": "Sau mạo từ The cần danh từ: development."}]}, {"id": "u1", "title": "Hiện tại đơn và hiện tại tiếp diễn", "desc": "Thì hiện tại đơn và hiện tại tiếp diễn, cùng các lỗi thường gặp.", "blocks": [{"t": "h", "lv": 2, "text": "Tổng quan về thì động từ"}, {"t": "h", "lv": 3, "text": "Thì hiện tại (Present Tenses)"}, {"t": "tbl", "rows": [["Thì", "Cách dùng", "Cấu trúc", "Ví dụ"], ["Hiện tại đơn (Present Simple)", "Thói quen, sự thật hiển nhiên, lịch trình", "(+) S + V(s/es) (–) S + do/does + not + V (?) Do/Does + S + V?", "She works every day. They do not play football. Does he like coffee?"], ["Hiện tại tiếp diễn (Present Continuous)", "Hành động đang diễn ra lúc nói; kế hoạch tương lai gần đã sắp xếp", "S + am/is/are + V-ing", "I am studying now. They are meeting us tomorrow."]]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về thì và cách sửa"}, {"t": "h", "lv": 3, "text": "Hiện tại đơn"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Quên “s/es” ở ngôi thứ ba số ít", "lv": 0}, {"t": "p", "text": "Sai: He like coffee.", "lv": 0}, {"t": "p", "text": "Đúng: He likes coffee.", "lv": 0}, {"t": "p", "text": "→ Chủ ngữ he/she/it: động từ thường thêm “s” (He plays) hoặc “es” với động từ tận cùng bằng ch, sh, s, x, z, o (She watches, He goes).", "lv": 0}, {"t": "p", "text": "Lỗi 2: Dùng hiện tại đơn cho hành động đang diễn ra", "lv": 0}, {"t": "p", "text": "Sai: They work right now.", "lv": 0}, {"t": "p", "text": "Đúng: They are working right now.", "lv": 0}, {"t": "p", "text": "Lỗi 3: Dùng hiện tại đơn cho kế hoạch tương lai đã sắp xếp", "lv": 0}, {"t": "p", "text": "Sai: I go to the dentist tomorrow.", "lv": 0}, {"t": "p", "text": "Đúng: I am going to the dentist tomorrow.", "lv": 0}]}, {"t": "h", "lv": 3, "text": "Hiện tại tiếp diễn"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Dùng với động từ chỉ trạng thái", "lv": 0}, {"t": "p", "text": "Sai: She is knowing the answer.", "lv": 0}, {"t": "p", "text": "Đúng: She knows the answer.", "lv": 0}, {"t": "p", "text": "→ Động từ chỉ trạng thái (state verbs) không dùng ở thì tiếp diễn: know, like, love, hate, need, want, believe, understand, own.", "lv": 0}, {"t": "p", "text": "Lỗi 2: Thiếu “to be”", "lv": 0}, {"t": "p", "text": "Sai: They playing soccer.", "lv": 0}, {"t": "p", "text": "Đúng: They are playing soccer.", "lv": 0}, {"t": "p", "text": "Lỗi 3: Dùng tiếp diễn cho thói quen", "lv": 0}, {"t": "p", "text": "Sai: He is eating breakfast at 7 AM every day.", "lv": 0}, {"t": "p", "text": "Đúng: He eats breakfast at 7 AM every day.", "lv": 0}]}], "quiz": [{"t": "My brother ___ football every Sunday morning.", "o": ["play", "plays", "is playing", "playing"], "a": 1, "e": "Every Sunday morning là dấu hiệu của thói quen, nên dùng hiện tại đơn. Chủ ngữ my brother là ngôi thứ ba số ít nên động từ thêm s."}, {"t": "Be quiet! The baby ___ .", "o": ["sleeps", "sleep", "is sleeping", "sleeping"], "a": 2, "e": "Be quiet! báo hiệu việc đang xảy ra ngay lúc nói, nên dùng hiện tại tiếp diễn: is sleeping."}, {"t": "I ___ what you mean.", "o": ["am understanding", "understand", "understands", "understanding"], "a": 1, "e": "Understand là động từ chỉ trạng thái nên không chia tiếp diễn. Chủ ngữ I đi với understand (không thêm s)."}, {"t": "She usually ___ to school by bike, but today she ___ the bus.", "o": ["goes / takes", "is going / is taking", "goes / is taking", "go / is taking"], "a": 2, "e": "Usually chỉ thói quen nên dùng goes. Today (hôm nay, khác thường lệ) và việc đang diễn ra nên dùng is taking."}, {"t": "Water ___ at 100 degrees Celsius.", "o": ["boil", "is boiling", "boils", "boiling"], "a": 2, "e": "Đây là sự thật khoa học nên dùng hiện tại đơn. Water là ngôi thứ ba số ít nên thêm s: boils."}, {"t": "Look! It ___ heavily outside.", "o": ["rains", "rain", "is raining", "raining"], "a": 2, "e": "Look! báo hiệu việc đang diễn ra ngay lúc nói, nên dùng hiện tại tiếp diễn: is raining."}, {"t": "Chọn câu đúng.", "o": ["He don't like coffee.", "He doesn't likes coffee.", "He doesn't like coffee.", "He not like coffee."], "a": 2, "e": "Chủ ngữ he đi với doesn't, và sau doesn't động từ về nguyên mẫu: doesn't like."}, {"t": "Tìm phần sai trong câu.", "sentence": "My sister <span class=\"seg\" data-l=\"A\">is wanting</span> <span class=\"seg\" data-l=\"B\">to buy</span> a new phone because <span class=\"seg\" data-l=\"C\">her old one</span> <span class=\"seg\" data-l=\"D\">doesn't work well</span>.", "o": ["is wanting", "to buy", "her old one", "doesn't work well"], "a": 0, "e": "Want là động từ chỉ trạng thái nên không chia tiếp diễn. Sửa thành wants."}]}, {"id": "u2", "title": "Quá khứ đơn và quá khứ tiếp diễn", "desc": "Thì quá khứ đơn và quá khứ tiếp diễn, cùng các lỗi thường gặp.", "blocks": [{"t": "h", "lv": 2, "text": "Tổng quan về thì động từ"}, {"t": "h", "lv": 3, "text": "Thì quá khứ (Past Tenses)"}, {"t": "tbl", "rows": [["Thì", "Cách dùng", "Cấu trúc", "Ví dụ"], ["Quá khứ đơn (Past Simple)", "Hành động đã xảy ra và kết thúc trong quá khứ", "(+) S + V2/V-ed (–) S + did not + V (?) Did + S + V?", "He went to the store yesterday. She did not eat breakfast. Did they arrive on time?"], ["Quá khứ tiếp diễn (Past Continuous)", "Hành động đang diễn ra tại một thời điểm cụ thể trong quá khứ", "S + was/were + V-ing", "I was reading a book at 8 PM last night."]]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về thì và cách sửa"}, {"t": "h", "lv": 3, "text": "Quá khứ đơn"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Dùng hiện tại cho hành động đã hoàn thành", "lv": 0}, {"t": "p", "text": "Sai: She studies last night.", "lv": 0}, {"t": "p", "text": "Đúng: She studied last night.", "lv": 0}, {"t": "p", "text": "Lỗi 2: Quên “-ed” ở động từ có quy tắc", "lv": 0}, {"t": "p", "text": "Sai: They walk to school yesterday.", "lv": 0}, {"t": "p", "text": "Đúng: They walked to school yesterday.", "lv": 0}, {"t": "p", "text": "Lỗi 3: Sai động từ bất quy tắc", "lv": 0}, {"t": "p", "text": "Sai: He buyed a new car.", "lv": 0}, {"t": "p", "text": "Đúng: He bought a new car.", "lv": 0}, {"t": "p", "text": "→ “Buy” là động từ bất quy tắc: buy – bought – bought.", "lv": 0}]}, {"t": "h", "lv": 3, "text": "Quá khứ tiếp diễn"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Không dùng thì tiếp diễn cho hành động đang diễn ra lúc có hành động khác xen vào", "lv": 0}, {"t": "p", "text": "Sai: When I arrived, they played football.", "lv": 0}, {"t": "p", "text": "Đúng: When I arrived, they were playing football.", "lv": 0}, {"t": "p", "text": "→ Hành động đang diễn ra (were playing) dùng quá khứ tiếp diễn, còn hành động xen vào (arrived) dùng quá khứ đơn.", "lv": 0}, {"t": "p", "text": "Lỗi 2: Dùng tiếp diễn cho hành động ngắn, hoàn tất", "lv": 0}, {"t": "p", "text": "Sai: He was slipping and was falling.", "lv": 0}, {"t": "p", "text": "Đúng: He slipped and fell.", "lv": 0}]}], "quiz": [{"t": "We ___ to Da Nang last summer.", "o": ["go", "goes", "went", "have gone"], "a": 2, "e": "Last summer là mốc quá khứ rõ ràng nên dùng quá khứ đơn. Quá khứ của go là went."}, {"t": "She ___ her homework yesterday.", "o": ["didn't do", "didn't did", "doesn't do", "not did"], "a": 0, "e": "Yesterday nên dùng quá khứ đơn. Phủ định là didn't + động từ nguyên mẫu: didn't do."}, {"t": "___ you see the match last night?", "o": ["Do", "Did", "Were", "Have"], "a": 1, "e": "Last night là mốc quá khứ, câu hỏi dùng Did + S + V nguyên mẫu."}, {"t": "I ___ TV when the phone rang.", "o": ["watched", "was watching", "am watching", "watch"], "a": 1, "e": "Việc đang diễn ra (xem TV) thì có việc xen vào (điện thoại reo). Việc đang diễn ra chia quá khứ tiếp diễn: was watching."}, {"t": "While we ___ dinner, the lights went out.", "o": ["had", "were having", "have", "are having"], "a": 1, "e": "While đi với việc đang diễn ra, còn went out là việc xen vào. Dùng quá khứ tiếp diễn: were having."}, {"t": "Last week I ___ a new pair of shoes.", "o": ["buyed", "bought", "buy", "buught"], "a": 1, "e": "Buy là động từ bất quy tắc: buy – bought. Last week cho biết cần quá khứ đơn."}, {"t": "When I was young, I ___ in a small village.", "o": ["live", "lives", "lived", "am living"], "a": 2, "e": "When I was young nói về một giai đoạn đã qua, nên dùng quá khứ đơn: lived."}, {"t": "Tìm phần sai trong câu.", "sentence": "She <span class=\"seg\" data-l=\"A\">didn't went</span> <span class=\"seg\" data-l=\"B\">to school</span> <span class=\"seg\" data-l=\"C\">because</span> she <span class=\"seg\" data-l=\"D\">was ill</span>.", "o": ["didn't went", "to school", "because", "was ill"], "a": 0, "e": "Sau didn't, động từ về nguyên mẫu. Sửa thành didn't go."}]}, {"id": "u3", "title": "Hiện tại hoàn thành", "desc": "Thì hiện tại hoàn thành và các lỗi thường gặp.", "blocks": [{"t": "h", "lv": 2, "text": "Tổng quan về thì động từ"}, {"t": "h", "lv": 3, "text": "Thì hiện tại (Present Tenses)"}, {"t": "tbl", "rows": [["Thì", "Cách dùng", "Cấu trúc", "Ví dụ"], ["Hiện tại hoàn thành (Present Perfect)", "Hành động đã xảy ra, còn kết quả ở hiện tại; trải nghiệm", "S + have/has + V3/V-ed", "She has visited London twice. We have finished our work."]]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về thì và cách sửa"}, {"t": "h", "lv": 3, "text": "Hiện tại hoàn thành"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text": "Lỗi 1: Dùng với mốc thời gian quá khứ xác định", "lv": 0}, {"t": "p", "text": "Sai: She has visited Paris last year.", "lv": 0}, {"t": "p", "text": "Đúng: She visited Paris last year.", "lv": 0}, {"t": "p", "text": "→ Có mốc quá khứ xác định (last year, in 2019, … ago) → quá khứ đơn.", "lv": 0}, {"t": "p", "text": "Lỗi 2: Sai dạng phân từ của động từ bất quy tắc", "lv": 0}, {"t": "p", "text": "Sai: They have eat lunch.", "lv": 0}, {"t": "p", "text": "Đúng: They have eaten lunch.", "lv": 0}, {"t": "p", "text": "Lỗi 3: Không phân biệt kết quả và quá trình", "lv": 0}, {"t": "p", "text": "→ I have lived here for five years. → nhấn mạnh khoảng thời gian/kết quả.", "lv": 0}, {"t": "p", "text": "→ I have been living here for five years. → nhấn mạnh quá trình liên tục, còn tiếp diễn.", "lv": 0}, {"t": "p", "text": "→ Cả hai câu đều đúng ngữ pháp; chọn thì theo ý muốn nhấn mạnh.", "lv": 0}]}], "quiz": [{"t": "I ___ English for five years.", "o": ["learn", "learned", "have learned", "am learning"], "a": 2, "e": "For five years cho thấy việc học bắt đầu từ trước và còn kéo dài đến nay, nên dùng hiện tại hoàn thành."}, {"t": "She has lived here ___ 2015.", "o": ["for", "since", "ago", "in"], "a": 1, "e": "2015 là mốc thời gian nên dùng since. For dùng với khoảng thời gian."}, {"t": "We ___ him yesterday.", "o": ["have seen", "saw", "has seen", "see"], "a": 1, "e": "Yesterday là mốc quá khứ rõ ràng nên dùng quá khứ đơn: saw."}, {"t": "Have you ___ been to Hue?", "o": ["ever", "yet", "already", "since"], "a": 0, "e": "Have you ever been to...? là mẫu hỏi về trải nghiệm. Ever nghĩa là từng."}, {"t": "I haven't finished my homework ___ .", "o": ["yet", "already", "ever", "ago"], "a": 0, "e": "Yet đi với câu phủ định và câu hỏi của hiện tại hoàn thành, thường đứng cuối câu."}, {"t": "He ___ in Hanoi two years ago.", "o": ["has lived", "lived", "have lived", "lives"], "a": 1, "e": "Two years ago là mốc quá khứ rõ ràng nên dùng quá khứ đơn: lived."}, {"t": "Mai is not at home. She ___ to the supermarket.", "o": ["has been", "has gone", "went", "goes"], "a": 1, "e": "Mai không có ở nhà, nghĩa là cô ấy đã đi và chưa về. Dùng has gone to. Has been to là đã đến rồi và đã về."}, {"t": "Tìm phần sai trong câu.", "sentence": "I <span class=\"seg\" data-l=\"A\">have met</span> <span class=\"seg\" data-l=\"B\">my best friend</span> <span class=\"seg\" data-l=\"C\">last week</span> <span class=\"seg\" data-l=\"D\">at the airport</span>.", "o": ["h nglish for two years.", "o": ["has been learning", "is learning", "learned", "will learn"], "a": 0, "e": "For two years và việc học còn tiếp tục nên dùng has been learning."}, {"t": "Chọn câu đúng.", "o": ["She has been work here.", "She has been working here.", "She have been working here.", "She has working here."], "a": 1, "e": "Cấu trúc: have/has + been + V-ing, và she đi với has."}, {"t": "I have been living here for five years nhấn mạnh điều gì?", "o": ["Quá trình liên tục còn tiếp diễn", "Hành động đã kết thúc", "Hành động trong tương lai", "Một thói quen đã bỏ"], "a": 0, "e": "Thể hoàn thành tiếp diễn nhấn mạnh quá trình kéo dài liên tục đến hiện tại."}, {"t": "Chọn câu đúng.", "o": ["I have been knowing him for years.", "I have known him for years.", "I am knowing him for years.", "I know him since years."], "a": 1, "e": "Know là động từ chỉ trạng thái nên không dùng thể tiếp diễn."}, {"t": "He ___ for three hours.", "o": ["have been studying", "has been studying", "has be studying", "have studying"], "a": 1, "e": "He đi với has, và cấu trúc là has been + V-ing."}]}, {"id": "u19", "title": "Quá khứ hoàn thành và quá khứ hoàn thành tiếp diễn", "desc": "Thì quá khứ hoàn thành và quá khứ hoàn thành tiếp diễn, cùng lỗi thường gặp.", "blocks": [{"t": "h", "lv": 2, "text": "Tổng quan về thì động từ"}, {"t": "h", "lv": 3, "text": "Thì quá khứ (Past Tenses)"}, {"t": "tbl", "rows": [["Thì", "Cách dùng", "Cấu trúc", "Ví dụ"], ["Quá khứ hoàn thành (Past Perfect)", "Hành động xảy ra trước một hành động khác trong quá khứ", "S + had + V3/V-ed", "When we arrived, they had left."], ["Quá khứ hoàn thành tiếp diễn (Past Perfect Continuous)", "Hành động diễn ra liên tục trước một thời điểm trong quá khứ", "S + had been + V-ing", "They had been waiting for hours before the train arrived."]]}, {"t": "h", "lv": 2, "text": "Lỗi thường gặp về thì và cách sửa"}, {"t": "h", "lv": 3, "text": "Quá khứ hoàn thành"}, {"t": "box", "label": "LỖI THƯỜNG GẶP", "items": [{"t": "p", "text":
