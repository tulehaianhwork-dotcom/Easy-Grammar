<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Grammar</title>
<meta name="theme-color" content="#F4F6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* ---------- CHẾ ĐỘ SÁNG: nền kem xanh, chữ xám than, nhấn xanh rừng ---------- */
:root{
  color-scheme:light;
  --ink:#2B3434;        /* chữ chính: xám than, không dùng đen tuyền */
  --ink-2:#5C6B6B;      /* chữ phụ: xám rêu nhẹ */
  --paper:#F4F6F0;      /* nền: xanh rêu nhạt, thay cho trắng gắt */
  --card:#FFFFFF;       /* khối nội dung nổi trên nền */
  --line:#DDE3DA;       /* đường kẻ, viền */
  --line-2:#C7D0C4;     /* viền đậm hơn khi rê chuột */
  --soft:#EAEEE4;       /* nền phụ: đầu bảng, nút phụ khi rê chuột */       /* màu dạ quang đánh dấu công thức */    /* nền vàng nhạt cho lịch học, băng thông báo */
  --accent:#2D6A4F;     /* nút chính: xanh lá rừng */
  --accent-dark:#235740;
  --accent-bg:#E3EFE8;
  --accent-line:#BFD8CB;
  --on-accent:#FFFFFF;  /* chữ trên nút chính */
  --ok:#2F7A2A;         /* làm đúng: xanh lá dịu, đã chỉnh để đạt tương phản 4.5:1 */
  --ok-bg:#E8F3E6; --ok-line:#BBDCB6;
  --bad:#A8403C;        /* làm sai: đỏ gạch, đã chỉnh để đạt tương phản 4.5:1 */
  --bad-bg:#F7E9E8; --bad-line:#E3C3C1;
  --sw-off:#BFC8BF;     /* nền công tắc khi tắt */
}
/* ---------- CHẾ ĐỘ TỐI: nền xám đá, chữ trắng đục, nhấn xanh mint ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#E2E8F0; --ink-2:#94A3B8;
    --paper:#12161A; --card:#1E252B;
    --line:#2C353D; --line-2:#3E4A54; --soft:#263038;
    --accent:#45A077; --accent-dark:#7FD3AC; --accent-bg:#1C2B25; --accent-line:#2F4A3C;
    --on-accent:#0B132B;
    --ok:#81C784; --ok-bg:#1B2A1E; --ok-line:#2F4733;
    --bad:#E57373; --bad-bg:#2C1E1E; --bad-line:#4A3030;
    --sw-off:#3E4A54;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E2E8F0; --ink-2:#94A3B8;
  --paper:#12161A; --card:#1E252B;
  --line:#2C353D; --line-2:#3E4A54; --soft:#263038;
  --accent:#45A077; --accent-dark:#7FD3AC; --accent-bg:#1C2B25; --accent-line:#2F4A3C;
  --on-accent:#0B132B;
  --ok:#81C784; --ok-bg:#1B2A1E; --ok-line:#2F4733;
  --bad:#E57373; --bad-bg:#2C1E1E; --bad-line:#4A3030;
  --sw-off:#3E4A54;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter','Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:var(--fs,16.5px);line-height:1.65;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
/* tiêu đề dùng Be Vietnam Pro cho dáng chữ Việt chắc khỏe */
.h1,.u-title,.brand,.auth-box h1,.sec h3,h3.gh2,h4.gh3,.nx,.score,.pc-n{font-family:'Be Vietnam Pro','Inter',sans-serif}
/* phần lý thuyết đọc dài dùng chữ có chân cho đỡ mỏi mắt */
.gl p,.gl li,.gi{font-family:'Lora',Georgia,serif;font-size:1.02rem;line-height:1.75}
.gl .tw,table.gt{font-family:'Inter',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.muted{color:var(--ink-2)}
.sm{font-size:.8125rem}
.h1{font-size:1.75rem;line-height:1.25;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.lead{margin:0 0 20px;color:var(--ink-2);max-width:60ch}
.narrow{max-width:680px}

/* Buttons */
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font-weight:600;background:var(--accent);color:var(--on-accent);text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--bad-line)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.small{padding:7px 14px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{display:block;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* Auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-box{width:100%;max-width:420px}
.auth-box h1{font-size:1.75rem;line-height:1.25;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.auth-box>p{margin:0 0 20px;color:var(--ink-2)}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.auth-note{margin:14px 0 0;font-size:.8125rem;color:var(--ink-2)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:.875rem;font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:var(--card);color:var(--ink)}
.fld small{display:block;margin-top:3px;color:var(--ink-2);font-size:.8125rem}
.pick{display:flex;gap:10px;margin-bottom:14px}
.pick label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:.9375rem}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
.pick input{margin-right:8px}
.err{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.9375rem}

/* Tabs (auth + unit) */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--ink-2);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--soft);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:800;font-size:1.1rem;line-height:1.25;padding:0 10px}
.brand small{display:block;font-weight:500;font-size:.8125rem;color:var(--ink-2)}
.side nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.nv:hover{background:var(--soft)}
.nv[aria-current="page"]{background:var(--accent-bg);color:var(--accent-dark)}
.nv i{font-style:normal;background:var(--bad);color:var(--card);border-radius:999px;font-size:.75rem;padding:0 8px;line-height:1.5}
.me{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;display:flex;flex-direction:column;gap:4px;font-size:.875rem}
.me span{color:var(--ink-2)}
.me .btn{margin-top:8px}
.main{padding:26px 30px 56px;width:100%;max-width:1100px}
.mtop{display:none}
.bnav{display:none}
@media (max-width:860px){
  .shell{display:block}
  .side{display:none}
  .main{padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:800}
  .mtop span{font-weight:500;font-size:.875rem;color:var(--ink-2)}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
  .bnav button{flex:1;min-width:0;background:none;border:0;border-top:3px solid transparent;padding:9px 2px;font-size:.6875rem;line-height:1.25;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav button[aria-current="page"]{color:var(--accent-dark);border-top-color:var(--accent)}
  .bnav i{font-style:normal;color:var(--bad)}
}

/* Dashboard */
.dgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.sec h3{margin:0 0 10px;font-size:1.0625rem;font-weight:700}
.sec p{margin:0 0 10px}
.sec.hl{border-left:5px solid var(--accent);border-radius:4px 12px 12px 4px}
.nx{font-size:1.35rem;font-weight:800;line-height:1.5}
.mk{color:var(--accent-dark);font-weight:800}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700;text-align:right}
.ub{margin-bottom:14px}
.ub-h{display:flex;justify-content:space-between;gap:10px;font-size:.9375rem;margin-bottom:5px}
.meter{position:relative;height:8px;background:var(--line);border-radius:4px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter i.good{background:var(--ok)}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.chip{font-style:normal;font-weight:600;background:var(--soft);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.75rem}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;background:transparent}
.empty h3{margin:0 0 8px;font-size:1.0625rem}
.empty ol{margin:0 0 6px;padding-left:20px}
.empty li{margin-bottom:6px}
.wq{padding:10px 0;border-bottom:1px solid var(--line)}
.wq:last-child{border-bottom:0}
.wq small{display:block;color:var(--ink-2)}
.srow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.srow:hover{border-color:var(--line-2)}
.srow-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srow small{display:block;color:var(--ink-2);margin-top:2px}
.demo{margin-left:6px}
textarea.code{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.8125rem;resize:vertical;word-break:break-all;background:var(--card);color:var(--ink)}


/* Dashboard học viên */
/* không dùng mảng màu đặc lớn: gây chói mắt, nhất là ở chế độ tối */
.pct-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);color:var(--ink);border-radius:4px 14px 14px 4px;padding:22px 24px}
.pc-l{margin:0;font-weight:600;color:var(--ink-2)}
.pc-n{margin:0 0 10px;font-size:3.4rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--accent-dark)}
.pc-n span{font-size:2rem;margin-left:2px}
.pc-bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.pc-bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.pc-s{margin:10px 0 0;color:var(--ink-2)}

.pg{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.donut{width:140px;height:140px;flex:none}
.donut .dn{font-size:22px;font-weight:800;fill:var(--ink);font-family:inherit}
.donut .dl{font-size:10px;fill:var(--ink-2);font-family:inherit}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:flex;align-items:center;gap:10px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.k-done{background:var(--ok)}.k-prog{background:var(--accent)}.k-none{background:var(--line)}
.ph{margin:20px 0 10px;font-size:1rem;font-weight:700}


/* Tổng quan học viên: lưới 2 cột, lịch học nằm bên phải */
.dash{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"pct cal" "next cal" "rev cal";gap:16px;align-items:start}
.dash>.pct-card{grid-area:pct}
.dash>.cal-card{grid-area:cal}
.dash>.sec.hl{grid-area:next}
.dash>.sec.rev{grid-area:rev}
.dash>.sec{margin:0}
@media (max-width:860px){.dash{grid-template-columns:1fr;grid-template-areas:"pct" "cal" "next" "rev"}}
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h h3{margin:0;font-size:1.0625rem;font-weight:700}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav span{min-width:86px;text-align:center;font-weight:600;font-size:.9375rem}
.cal-nav button{width:32px;height:32px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:1.25rem;line-height:1;padding:0}
.cal-nav button:hover{background:var(--soft)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:.75rem;font-weight:600;color:var(--ink-2);padding-bottom:2px}
.cd{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:.8125rem;line-height:1.1}
.cd b{font-weight:500}
.cd em{font-style:normal;color:var(--accent);font-size:.95rem;line-height:1}
.cd.on{background:var(--accent-bg)}
.cd.on b{font-weight:800}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-s{margin:12px 0 0}

/* Lessons list */
.row{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row:hover{border-color:var(--line-2)}
.row .num{grid-row:1 / span 2;font-size:1.9rem;font-weight:800;line-height:1.1}
.row b{font-size:1.05rem;font-weight:700}
.row small{display:block;color:var(--ink-2);font-size:.875rem;line-height:1.45;margin-top:2px}
.row .meta{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8125rem;color:var(--ink-2);margin-top:4px}
.row.soon{background:transparent;border-style:dashed;cursor:default;opacity:.65}
.row.soon:hover{border-color:var(--line)}
.row.test{border-left:5px solid var(--accent);border-radius:4px 12px 12px 4px}
.row.test .num{font-size:1.15rem;padding-top:6px}

/* Unit */
.back{background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:.9375rem;font-weight:500;margin-bottom:6px}
.back:hover{color:var(--ink)}
.u-title{font-size:1.5rem;font-weight:800;line-height:1.25;margin:0 0 14px}
.sec h3.t2{font-size:1.125rem}
.formula{margin:0 0 14px !important;line-height:2}
.formula span{font-size:1.25rem;font-weight:700;padding:2px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent-dark)}
.sec ul,.traps ul{margin:0 0 12px;padding-left:20px}
.sec li,.traps li{margin-bottom:6px}
.ex{border-left:3px solid var(--line);padding-left:12px}
.ex p{margin:0 0 8px !important}
.ex .en{font-weight:600}
.ex .vi{color:var(--ink-2);font-size:.9375rem}
.traps{background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:12px;padding:18px}
.traps h3{margin:0 0 10px;font-size:1.125rem;color:var(--bad)}

/* Quiz */
.count{color:var(--ink-2);font-size:.9375rem;margin:0 0 8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 6px}
/* thanh tiến độ bám đầu màn hình để luôn biết còn bao nhiêu câu */
.qhead{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 8px;margin-bottom:6px}
@media (max-width:860px){.qhead{top:calc(env(safe-area-inset-top,0px))}}
.bar i{display:block;height:100%;background:var(--accent)}
.qt{font-size:1.1875rem;font-weight:600;line-height:1.5;margin:14px 0}
.sentence{font-size:1.125rem;line-height:2;margin:-4px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.seg{border-bottom:2px solid var(--ink);padding-bottom:1px}
.seg::before{content:attr(data-l);font-size:.6875rem;font-weight:700;vertical-align:super;margin-right:3px;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{font-weight:800;color:var(--ink-2);min-width:1.1em}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .l{color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin-top:14px;border-radius:12px;padding:14px 16px}
.why.ok{background:var(--ok-bg);border:1px solid var(--ok-line)}
.why.bad{background:var(--bad-bg);border:1px solid var(--bad-line)}
.why b{display:block;margin-bottom:4px}
.why.ok b{color:var(--ok)}
.why.bad b{color:var(--bad)}
.why p{margin:0}
.score{font-size:3.2rem;font-weight:800;line-height:1.1;margin:8px 0 4px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-size:.9375rem;z-index:30;max-width:90vw;text-align:center}
@media (min-width:861px){.toast{bottom:28px}}
.toast.link{cursor:pointer}
.banners{margin-bottom:16px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.banner.info{background:var(--accent-bg);border-color:var(--accent-line)}
.ask{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1.5px dashed var(--line-2);border-radius:12px;padding:14px 16px;margin:14px 0 0}
.ask div{display:flex;flex-direction:column;gap:2px}
.ask span{color:var(--ink-2);font-size:.875rem}
.qa-i{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.qa-i.new{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.qa-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qa-q{white-space:pre-wrap;margin:8px 0 10px}
.qa-a{background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:10px;padding:10px 12px;margin-top:6px}
.qa-a small{color:var(--ok);font-weight:600}
.qa-a p{white-space:pre-wrap;margin:4px 0 0}

o.", "Sau does, động từ về nguyên thể"], ["Did you went?", "Did you go?", "Did đã mang nghĩa quá khứ rồi"], ["He don’t like it.", "He doesn’t like it.", "He đi với does"], ["She is work here.", "She works here.", "Không dùng be + động từ thường"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Have còn mang nghĩa “ăn, uống, trải qua”: have breakfast (ăn sáng), have a good time (có khoảng thời gian vui).", "lv": 0}, {"t": "p", "text": "Have got = have (có), dùng nhiều trong văn nói: I’ve got two brothers.", "lv": 0}]}], "quiz": [{"t": "She ___ a doctor.", "o": ["am", "is", "are", "be"], "a": 1, "e": "She là ngôi thứ ba số ít nên dùng is."}, {"t": "They ___ not like coffee.", "o": ["does", "do", "is", "are"], "a": 1, "e": "They đi với do. Dạng phủ định: do not like."}, {"t": "___ he live in Hanoi?", "o": ["Do", "Does", "Is", "Are"], "a": 1, "e": "He là ngôi thứ ba số ít, động từ thường live nên mượn Does."}, {"t": "He ___ breakfast at 7 every morning.", "o": ["have", "has", "is", "having"], "a": 1, "e": "He đi với has."}, {"t": "Chọn câu ĐÚNG.", "o": ["She doesn’t goes to school.", "She doesn’t go to school.", "She don’t go to school.", "She not go to school."], "a": 1, "e": "Sau doesn’t, động từ chính ở dạng nguyên thể: go."}, {"t": "Did you ___ to the party?", "o": ["went", "go", "going", "goes"], "a": 1, "e": "Did đã mang nghĩa quá khứ nên động từ chính về nguyên thể: go."}, {"t": "We ___ at home yesterday.", "o": ["are", "is", "were", "was"], "a": 2, "e": "We số nhiều, thời gian quá khứ yesterday → were."}, {"t": "___ you a teacher?", "o": ["Do", "Does", "Are", "Have"], "a": 2, "e": "Câu có be (a teacher là bổ ngữ) nên đảo be lên đầu: Are."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">My brother</span> <span class=\"seg\" data-l=\"B\">don't</span> <span class=\"seg\" data-l=\"C\">like</span> <span class=\"seg\" data-l=\"D\">football</span>.", "o": ["My brother", "don't", "like", "football"], "a": 1, "e": "My brother là ngôi thứ ba số ít nên phải dùng doesn’t."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">is</span> <span class=\"seg\" data-l=\"C\">work</span> <span class=\"seg\" data-l=\"D\">in a bank</span>.", "o": ["She", "is", "work", "in a bank"], "a": 2, "e": "Work là động từ thường, không đi kèm is. Phải viết She works in a bank."}]}, {"id": "n3", "title": "Chia động từ: thêm -s/-es, -ed, -ing", "desc": "Ba quy tắc biến đổi động từ quan trọng nhất và cách phát âm, viết đúng chính tả.", "blocks": [{"t": "p", "text": "Phần lớn lỗi sai trong đề thi đến từ việc chia sai đuôi động từ. Chỉ cần nắm ba bảng dưới đây là xử lý được hầu hết các trường hợp."}, {"t": "h", "lv": 2, "text": "1. Thêm -s / -es (dùng cho he, she, it ở hiện tại đơn)"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số động từ", "+ s", "work → works, play → plays"], ["Tận cùng -s, -sh, -ch, -x, -o", "+ es", "watch → watches, go → goes, fix → fixes"], ["Phụ âm + y", "đổi y → ies", "study → studies, carry → carries"], ["Nguyên âm + y", "+ s", "play → plays, buy → buys"]]}, {"t": "h", "lv": 2, "text": "2. Thêm -ed (quá khứ của động từ có quy tắc)"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số động từ", "+ ed", "work → worked"], ["Tận cùng -e", "+ d", "live → lived, hope → hoped"], ["Phụ âm + y", "đổi y → ied", "study → studied, try → tried"], ["1 âm tiết: nguyên âm + 1 phụ âm", "gấp đôi phụ âm + ed", "stop → stopped, plan → planned"]]}, {"t": "h", "lv": 2, "text": "3. Thêm -ing"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số động từ", "+ ing", "work → working"], ["Tận cùng -e câm", "bỏ e + ing", "make → making, write → writing"], ["1 âm tiết: nguyên âm + 1 phụ âm", "gấp đôi phụ âm + ing", "run → running, sit → sitting"], ["Tận cùng -ie", "đổi ie → y + ing", "lie → lying, die → dying"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "She studies English every day. (Cô ấy học tiếng Anh mỗi ngày.)", "lv": 0}, {"t": "p", "text": "They stopped the car. (Họ đã dừng xe lại.)", "lv": 0}, {"t": "p", "text": "He is writing a letter. (Anh ấy đang viết một lá thư.)", "lv": 0}, {"t": "p", "text": "The baby is lying on the bed. (Em bé đang nằm trên giường.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Không gấp đôi phụ âm nếu tận cùng là w, x, y: play → played, fix → fixed.", "lv": 0}, {"t": "p", "text": "Have là ngoại lệ: he/she/it → has, không phải “haves”.", "lv": 0}]}], "quiz": [{"t": "study → ngôi thứ ba số ít là gì?", "o": ["studys", "studies", "studyes", "studied"], "a": 1, "e": "Phụ âm d + y nên đổi y thành ies: studies."}, {"t": "go → ngôi thứ ba số ít là gì?", "o": ["gos", "goes", "goies", "going"], "a": 1, "e": "Tận cùng -o thì thêm es: goes."}, {"t": "stop → dạng quá khứ là gì?", "o": ["stoped", "stopped", "stopt", "stopping"], "a": 1, "e": "Một âm tiết, nguyên âm o + một phụ âm p nên gấp đôi p rồi thêm ed."}, {"t": "make → dạng V-ing là gì?", "o": ["makeing", "making", "makking", "maked"], "a": 1, "e": "Bỏ e câm rồi thêm ing: making."}, {"t": "play → dạng quá khứ là gì?", "o": ["plaied", "played", "playd", "plaed"], "a": 1, "e": "Nguyên âm a + y nên giữ nguyên y, chỉ thêm ed."}, {"t": "run → dạng V-ing là gì?", "o": ["runing", "running", "runnning", "runed"], "a": 1, "e": "Một âm tiết, gấp đôi n rồi thêm ing."}, {"t": "lie → dạng V-ing là gì?", "o": ["lieing", "lying", "liing", "lyeing"], "a": 1, "e": "Tận cùng -ie thì đổi thành y + ing: lying."}, {"t": "He ___ TV every evening.", "o": ["watch", "watchs", "watches", "watching"], "a": 2, "e": "Tận cùng -ch nên thêm es: watches."}, {"t": "fix → dạng quá khứ là gì?", "o": ["fixxed", "fixed", "fixt", "fixied"], "a": 1, "e": "Tận cùng -x thì không gấp đôi, chỉ thêm ed."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">My mother</span> <span class=\"seg\" data-l=\"B\">carrys</span> <span class=\"seg\" data-l=\"C\">the bag</span> <span class=\"seg\" data-l=\"D\">every day</span>.", "o": ["My mother", "carrys", "the bag", "every day"], "a": 1, "e": "Phụ âm r + y nên đổi y thành ies: carries."}]}, {"id": "n4", "title": "Động từ bất quy tắc thường gặp", "desc": "Bảng động từ bất quy tắc hay ra thi nhất, chia theo nhóm dễ nhớ.", "blocks": [{"t": "p", "text": "Động từ bất quy tắc không thêm -ed mà đổi hẳn hình dạng. Thay vì học thuộc lộn xộn, hãy nhóm chúng theo kiểu biến đổi."}, {"t": "h", "lv": 2, "text": "Nhóm 1 — Không đổi (V = V2 = V3)"}, {"t": "tbl", "rows": [["Nguyên thể", "Quá khứ", "Quá khứ phân từ", "Nghĩa"], ["cut", "cut", "cut", "cắt"], ["put", "put", "put", "đặt, để"], ["let", "let", "let", "cho phép"], ["cost", "cost", "cost", "trị giá"], ["read", "read", "read", "đọc (đọc khác nhau)"]]}, {"t": "h", "lv": 2, "text": "Nhóm 2 — V2 = V3"}, {"t": "tbl", "rows": [["Nguyên thể", "V2 / V3", "Nghĩa"], ["buy", "bought", "mua"], ["bring", "brought", "mang"], ["teach", "taught", "dạy"], ["think", "thought", "nghĩ"], ["find", "found", "tìm thấy"], ["keep", "kept", "giữ"], ["leave", "left", "rời đi"], ["meet", "met", "gặp"], ["say", "said", "nói"], ["tell", "told", "kể"]]}, {"t": "h", "lv": 2, "text": "Nhóm 3 — V, V2, V3 khác nhau cả ba"}, {"t": "tbl", "rows": [["Nguyên thể", "Quá khứ", "Quá khứ phân từ", "Nghĩa"], ["be", "was/were", "been", "thì, là"], ["go", "went", "gone", "đi"], ["do", "did", "done", "làm"], ["see", "saw", "seen", "nhìn thấy"], ["give", "gave", "given", "đưa, cho"], ["take", "took", "taken", "lấy"], ["write", "wrote", "written", "viết"], ["speak", "spoke", "spoken", "nói"], ["break", "broke", "broken", "làm vỡ"], ["know", "knew", "known", "biết"], ["begin", "began", "begun", "bắt đầu"], ["drink", "drank", "drunk", "uống"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I bought a new phone last week. (Tôi đã mua một chiếc điện thoại mới tuần trước.)", "lv": 0}, {"t": "p", "text": "She has written three letters. (Cô ấy đã viết ba lá thư.)", "lv": 0}, {"t": "p", "text": "They went to Da Nang in 2023. (Họ đã đi Đà Nẵng năm 2023.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "V2 dùng cho quá khứ đơn; V3 dùng sau have/has/had và trong câu bị động.", "lv": 0}, {"t": "p", "text": "Cẩn thận cặp dễ nhầm: lie – lay – lain (nằm) và lay – laid – laid (đặt).", "lv": 0}]}], "quiz": [{"t": "I ___ a new book yesterday.", "o": ["buy", "bought", "buyed", "buying"], "a": 1, "e": "Yesterday là dấu hiệu quá khứ, buy có V2 là bought."}, {"t": "She has ___ the letter already.", "o": ["write", "wrote", "written", "writing"], "a": 2, "e": "Sau has dùng V3: written."}, {"t": "V3 của “go” là gì?", "o": ["went", "gone", "goed", "going"], "a": 1, "e": "go – went – gone."}, {"t": "They ___ me a present last Tet.", "o": ["give", "gave", "given", "giving"], "a": 1, "e": "Last Tet là quá khứ nên dùng V2: gave."}, {"t": "V2 của “teach” là gì?", "o": ["teached", "taught", "teacht", "teaches"], "a": 1, "e": "teach – taught – taught."}, {"t": "The glass was ___ by my brother.", "o": ["break", "broke", "broken", "breaking"], "a": 2, "e": "Câu bị động dùng V3: broken."}, {"t": "He ___ the door and left.", "o": ["shut", "shutted", "shuts", "shutting"], "a": 0, "e": "Shut thuộc nhóm không đổi hình dạng."}, {"t": "V3 của “speak” là gì?", "o": ["spoke", "spoken", "speaked", "speaking"], "a": 1, "e": "speak – spoke – spoken."}, {"t": "We have ___ each other since 2020.", "o": ["know", "knew", "known", "knowing"], "a": 2, "e": "Sau have dùng V3: known."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">has</span> <span class=\"seg\" data-l=\"C\">drank</span> <span class=\"seg\" data-l=\"D\">all the milk</span>.", "o": ["She", "has", "drank", "all the milk"], "a": 2, "e": "Sau has phải dùng V3 là drunk, không dùng V2 drank."}]}, {"id": "n5", "title": "Danh từ số ít, số nhiều và a / an / the", "desc": "Quy tắc tạo số nhiều và cách chọn mạo từ a, an, the cho người mới bắt đầu.", "blocks": [{"t": "p", "text": "Danh từ tiếng Anh luôn phải trả lời hai câu hỏi: một hay nhiều, và đã xác định hay chưa xác định. Trả lời đúng hai câu này là dùng đúng số nhiều và mạo từ."}, {"t": "h", "lv": 2, "text": "Tạo danh từ số nhiều"}, {"t": "tbl", "rows": [["Trường hợp", "Cách làm", "Ví dụ"], ["Đa số", "+ s", "book → books, pen → pens"], ["Tận cùng -s, -sh, -ch, -x, -o", "+ es", "box → boxes, tomato → tomatoes"], ["Phụ âm + y", "y → ies", "city → cities, baby → babies"], ["Tận cùng -f, -fe", "đổi thành -ves", "leaf → leaves, knife → knives"], ["Bất quy tắc", "đổi hẳn", "man → men, child → children, foot → feet, tooth → teeth"]]}, {"t": "h", "lv": 2, "text": "Chọn a hay an"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "a + từ bắt đầu bằng ÂM phụ âm: a book, a university (đọc là /ju/), a European country", "lv": 0}, {"t": "p", "text": "an + từ bắt đầu bằng ÂM nguyên âm: an apple, an hour (h câm), an honest man", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Khi nào dùng THE"}, {"t": "tbl", "rows": [["Dùng the khi", "Ví dụ"], ["Đã nhắc đến trước đó", "I saw a dog. The dog was black."], ["Cả người nói và người nghe đều biết", "Close the door, please."], ["Vật duy nhất trên đời", "the sun, the moon, the earth"], ["Trước so sánh nhất, số thứ tự", "the best, the first"], ["Trước tên sông, biển, dãy núi, nhóm đảo", "the Mekong, the Pacific"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I have a cat. The cat is very cute. (Tôi có một con mèo. Con mèo đó rất dễ thương.)", "lv": 0}, {"t": "p", "text": "She is an engineer. (Cô ấy là một kỹ sư.)", "lv": 0}, {"t": "p", "text": "He is the tallest student in my class. (Anh ấy là học sinh cao nhất lớp tôi.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "KHÔNG dùng the trước: tên riêng (Lan, Vietnam), bữa ăn (have breakfast), môn thể thao (play football), môn học (study math).", "lv": 0}, {"t": "p", "text": "Danh từ không đếm được (water, money, information, advice) không có số nhiều và không dùng a/an.", "lv": 0}]}], "quiz": [{"t": "Số nhiều của “child” là gì?", "o": ["childs", "childes", "children", "childrens"], "a": 2, "e": "Child là danh từ bất quy tắc: children."}, {"t": "Số nhiều của “knife” là gì?", "o": ["knifes", "knives", "knifies", "knife"], "a": 1, "e": "Tận cùng -fe đổi thành -ves: knives."}, {"t": "She is ___ honest girl.", "o": ["a", "an", "the", "không điền gì"], "a": 1, "e": "Honest có h câm, bắt đầu bằng âm nguyên âm nên dùng an."}, {"t": "He studies at ___ university in Hanoi.", "o": ["a", "an", "the", "không điền gì"], "a": 0, "e": "University đọc là /ju/, âm phụ âm nên dùng a."}, {"t": "I bought a book. ___ book is very interesting.", "o": ["A", "An", "The", "không điền gì"], "a": 2, "e": "Danh từ đã được nhắc đến ở câu trước nên dùng the."}, {"t": "Số nhiều của “city” là gì?", "o": ["citys", "cities", "cityes", "citi"], "a": 1, "e": "Phụ âm t + y nên đổi y thành ies."}, {"t": "Chọn câu ĐÚNG.", "o": ["I have many informations.", "I have much information.", "I have an information.", "I have informations."], "a": 1, "e": "Information là danh từ không đếm được, không có số nhiều và dùng much."}, {"t": "We usually have ___ breakfast at 6.", "o": ["a", "an", "the", "không điền gì"], "a": 3, "e": "Trước tên bữa ăn không dùng mạo từ."}, {"t": "___ sun rises in the east.", "o": ["A", "An", "The", "không điền gì"], "a": 2, "e": "Mặt trời là vật duy nhất nên dùng the."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">There</span> <span class=\"seg\" data-l=\"B\">are</span> <span class=\"seg\" data-l=\"C\">three</span> <span class=\"seg\" data-l=\"D\">tooths</span> in the box.", "o": ["There", "are", "three", "tooths"], "a": 3, "e": "Tooth là danh từ bất quy tắc, số nhiều là teeth."}]}, {"id": "u4", "title": "Từ loại và vị trí trong câu", "desc": "Tám từ loại chính và mẹo nhìn vị trí chỗ trống để chọn đúng loại từ.", "blocks": [{"t": "p", "text": "Đề thi rất hay cho một chỗ trống và bốn đáp án cùng gốc từ. Mẹo xử lý không phải là dịch nghĩa, mà là nhìn xem chỗ trống đứng ở vị trí nào."}, {"t": "h", "lv": 2, "text": "Tám từ loại chính"}, {"t": "tbl", "rows": [["Từ loại", "Chức năng", "Ví dụ"], ["Danh từ (noun)", "Gọi tên người, vật, ý tưởng", "teacher, city, freedom"], ["Đại từ (pronoun)", "Thay thế danh từ", "he, she, it, they, who"], ["Động từ (verb)", "Chỉ hành động hoặc trạng thái", "run, think, is/am/are"], ["Tính từ (adjective)", "Tả danh từ", "happy, large, blue"], ["Trạng từ (adverb)", "Tả động từ, tính từ, trạng từ khác", "quickly, very, always"], ["Giới từ (preposition)", "Nối danh từ với phần còn lại", "in, on, at, between"], ["Liên từ (conjunction)", "Nối từ, cụm, mệnh đề", "and, but, because, although"], ["Mạo từ (article)", "Xác định hay không xác định", "a, an, the"]]}, {"t": "h", "lv": 2, "text": "Bảng vàng: nhìn vị trí, chọn từ loại"}, {"t": "tbl", "rows": [["Chỗ trống đứng ở đâu", "Điền loại từ gì", "Ví dụ"], ["Sau a / the / my / her…", "Danh từ", "her decision"], ["Trước một danh từ", "Tính từ", "a successful woman"], ["Sau be, feel, seem, become, look", "Tính từ", "She feels happy."], ["Sau một động từ thường", "Trạng từ", "She drives carefully."], ["Trước tính từ hoặc trạng từ khác", "Trạng từ", "extremely important"], ["Sau can, must, will, should", "Động từ nguyên thể không to", "She must go now."]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "She is a talented singer. (Cô ấy là một ca sĩ tài năng.) → trước danh từ singer nên dùng tính từ.", "lv": 0}, {"t": "p", "text": "She sings beautifully. (Cô ấy hát rất hay.) → sau động từ sings nên dùng trạng từ.", "lv": 0}, {"t": "p", "text": "Her decision was difficult. (Quyết định của cô ấy thật khó khăn.) → sau her nên dùng danh từ.", "lv": 0}, {"t": "p", "text": "It is extremely important. (Điều đó cực kỳ quan trọng.) → trước tính từ important nên dùng trạng từ.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Một số từ đuôi -ly nhưng là TÍNH TỪ: friendly, lovely, lonely, likely. Ví dụ: a friendly man.", "lv": 0}, {"t": "p", "text": "Fast, hard, late, early vừa là tính từ vừa là trạng từ: a fast car / He runs fast.", "lv": 0}, {"t": "p", "text": "Hardly nghĩa là “hầu như không”, khác hẳn hard: I hardly know him. (Tôi hầu như không biết anh ta.)", "lv": 0}]}], "quiz": [{"t": "She is a ___ singer.", "o": ["talent", "talented", "talentedly", "talents"], "a": 1, "e": "Trước danh từ singer cần tính từ: talented."}, {"t": "She sings ___ .", "o": ["beautiful", "beauty", "beautifully", "beautify"], "a": 2, "e": "Bổ nghĩa cho động từ sings nên dùng trạng từ."}, {"t": "She feels ___ today.", "o": ["happy", "happily", "happiness", "to happy"], "a": 0, "e": "Feel là động từ liên kết nên sau nó dùng tính từ."}, {"t": "Her ___ to leave was difficult.", "o": ["decide", "decision", "decisive", "decisively"], "a": 1, "e": "Sau tính từ sở hữu her cần danh từ."}, {"t": "It is ___ important to check your answers.", "o": ["extreme", "extremely", "extremity", "extremes"], "a": 1, "e": "Trước tính từ important cần trạng từ."}, {"t": "She must ___ now.", "o": ["goes", "going", "go", "to go"], "a": 2, "e": "Sau must dùng động từ nguyên thể không to."}, {"t": "Từ nào là TÍNH TỪ?", "o": ["quickly", "lovely", "carefully", "always"], "a": 1, "e": "Lovely có đuôi -ly nhưng là tính từ."}, {"t": "The ___ of the building took two years.", "o": ["construct", "construction", "constructive", "constructively"], "a": 1, "e": "Sau the cần danh từ."}, {"t": "He works very ___ .", "o": ["hard", "hardly", "harder than", "hardness"], "a": 0, "e": "Hard là trạng từ nghĩa “chăm chỉ”; hardly nghĩa “hầu như không”."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">My brother</span> <span class=\"seg\" data-l=\"B\">drives</span> <span class=\"seg\" data-l=\"C\">very</span> <span class=\"seg\" data-l=\"D\">careful</span> to school.", "o": ["My brother", "drives", "very", "careful"], "a": 3, "e": "Careful bổ nghĩa cho động từ drives nên phải là trạng từ carefully."}]}, {"id": "u5", "title": "Danh từ, mạo từ và đại từ", "desc": "Danh từ đếm được và không đếm được, cách dùng a/an/the và các loại đại từ.", "blocks": [{"t": "p", "text": "Ba nhóm từ này luôn đi cùng nhau trong câu, nên thường được hỏi chung trong một câu đề thi."}, {"t": "h", "lv": 2, "text": "Đếm được và không đếm được"}, {"t": "tbl", "rows": [["Loại", "Đặc điểm", "Đi với", "Ví dụ"], ["Đếm được", "Có số nhiều", "a/an, many, few, a number of", "book, student, idea"], ["Không đếm được", "Không có số nhiều", "much, little, a great deal of", "water, money, information, advice, news"], ["Dùng cho cả hai", "", "some, any, a lot of, plenty of", "some books / some water"]]}, {"t": "h", "lv": 2, "text": "Mạo từ: chọn nhanh"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "a/an → nhắc lần đầu, chưa xác định: I met a doctor yesterday.", "lv": 0}, {"t": "p", "text": "the → đã xác định, cả hai bên đều biết: The doctor was very kind.", "lv": 0}, {"t": "p", "text": "không mạo từ → danh từ số nhiều hoặc không đếm được nói chung: Books are expensive. / Water is important.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Các loại đại từ"}, {"t": "tbl", "rows": [["Loại", "Danh sách", "Ví dụ"], ["Chủ ngữ", "I, you, he, she, it, we, they", "She is my friend."], ["Tân ngữ", "me, you, him, her, it, us, them", "I saw her yesterday."], ["Sở hữu (trước danh từ)", "my, your, his, her, its, our, their", "my book"], ["Sở hữu (đứng một mình)", "mine, yours, his, hers, ours, theirs", "This book is mine."], ["Phản thân", "myself, yourself, himself…", "She did it herself."]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I need some advice. (Tôi cần vài lời khuyên.) → advice không đếm được, không thêm s.", "lv": 0}, {"t": "p", "text": "There are many students in the class. (Có nhiều học sinh trong lớp.)", "lv": 0}, {"t": "p", "text": "This bag is hers, not mine. (Cái túi này là của cô ấy, không phải của tôi.)", "lv": 0}, {"t": "p", "text": "He hurt himself while cooking. (Anh ấy tự làm mình bị thương khi nấu ăn.)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Các danh từ hay bị nhầm là đếm được: advice, information, furniture, luggage, equipment, news, money → đều KHÔNG đếm được.", "lv": 0}, {"t": "p", "text": "Its = của nó (sở hữu). It’s = it is. Đây là lỗi sai rất hay ra thi.", "lv": 0}]}], "quiz": [{"t": "I need some ___ about the course.", "o": ["informations", "information", "an information", "informations’"], "a": 1, "e": "Information là danh từ không đếm được."}, {"t": "There aren’t ___ students in the room.", "o": ["much", "many", "a little", "a great deal of"], "a": 1, "e": "Students đếm được số nhiều nên dùng many."}, {"t": "This pen isn’t mine. It’s ___ .", "o": ["her", "she", "hers", "herself"], "a": 2, "e": "Đứng một mình, không có danh từ theo sau nên dùng hers."}, {"t": "She cut ___ while cooking.", "o": ["her", "hers", "herself", "she"], "a": 2, "e": "Chủ ngữ và tân ngữ cùng là một người nên dùng đại từ phản thân."}, {"t": "The dog wagged ___ tail.", "o": ["it’s", "its", "its’", "it is"], "a": 1, "e": "Its là tính từ sở hữu; it’s là it is."}, {"t": "I met ___ old man on the bus.", "o": ["a", "an", "the", "không điền gì"], "a": 1, "e": "Old bắt đầu bằng âm nguyên âm nên dùng an."}, {"t": "___ is important for our health.", "o": ["A water", "The waters", "Water", "Waters"], "a": 2, "e": "Nói chung về nước, danh từ không đếm được, không dùng mạo từ."}, {"t": "My parents gave ___ a new phone.", "o": ["I", "me", "my", "mine"], "a": 1, "e": "Sau động từ gave cần đại từ tân ngữ: me."}, {"t": "Chọn câu ĐÚNG.", "o": ["He has many money.", "He has much money.", "He has a money.", "He has moneys."], "a": 1, "e": "Money không đếm được nên dùng much."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">gave</span> <span class=\"seg\" data-l=\"C\">I</span> <span class=\"seg\" data-l=\"D\">a book</span> yesterday.", "o": ["She", "gave", "I", "a book"], "a": 2, "e": "Sau động từ gave phải dùng đại từ tân ngữ me, không dùng I."}]}, {"id": "u6", "title": "Động từ, tính từ và trạng từ", "desc": "Phân loại động từ, trật tự tính từ và cách tạo, đặt vị trí trạng từ.", "blocks": [{"t": "p", "text": "Nhóm này quyết định phần “thịt” của câu: hành động gì, tính chất ra sao, diễn ra như thế nào."}, {"t": "h", "lv": 2, "text": "Ba loại động từ cần phân biệt"}, {"t": "tbl", "rows": [["Loại", "Đặc điểm", "Ví dụ"], ["Động từ thường", "Chỉ hành động, cần do/does/did để hỏi và phủ định", "work, play, study"], ["Động từ liên kết", "Theo sau là TÍNH TỪ, không phải trạng từ", "be, become, seem, look, feel, taste, sound"], ["Trợ động từ / khuyết thiếu", "Theo sau là động từ nguyên thể", "can, must, will, should, may"]]}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Động từ liên kết + tính từ: The soup tastes good. (KHÔNG dùng well)", "lv": 0}, {"t": "p", "text": "Động từ thường + trạng từ: He plays football well.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Trật tự tính từ khi có nhiều tính từ"}, {"t": "p", "text": "Thứ tự chuẩn: Ý kiến – Kích cỡ – Tuổi – Hình dáng – Màu sắc – Nguồn gốc – Chất liệu – Mục đích + danh từ."}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "a beautiful small old round brown Vietnamese wooden dining table", "lv": 0}, {"t": "p", "text": "Thực tế đề thi thường chỉ hỏi 2–3 tính từ: a nice new car, a big black dog.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Tạo và đặt trạng từ"}, {"t": "tbl", "rows": [["Cách tạo", "Ví dụ"], ["tính từ + ly", "quick → quickly, careful → carefully"], ["tận cùng -y → ily", "happy → happily, easy → easily"], ["tận cùng -le → ly", "simple → simply, terrible → terribly"], ["bất quy tắc", "good → well, fast → fast, hard → hard"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Trạng từ tần suất (always, usually, often, sometimes, never) đứng TRƯỚC động từ thường nhưng SAU động từ be: She always comes late. / She is always late.", "lv": 0}, {"t": "p", "text": "He looks good = trông đẹp. He looks well = trông khoẻ mạnh. Cả hai đều đúng nhưng khác nghĩa.", "lv": 0}]}], "quiz": [{"t": "The soup tastes ___ .", "o": ["well", "good", "goodly", "better than"], "a": 1, "e": "Taste là động từ liên kết nên theo sau là tính từ good."}, {"t": "He plays the guitar ___ .", "o": ["good", "well", "goodly", "nice"], "a": 1, "e": "Bổ nghĩa cho động từ thường plays nên dùng trạng từ well."}, {"t": "She ___ comes to class late.", "o": ["always", "is always", "always is", "be always"], "a": 0, "e": "Trạng từ tần suất đứng trước động từ thường comes."}, {"t": "She ___ late for the meeting.", "o": ["always is", "is always", "always", "be always"], "a": 1, "e": "Với động từ be, trạng từ tần suất đứng sau be."}, {"t": "Trạng từ của “happy” là gì?", "o": ["happyly", "happily", "happyly", "happiness"], "a": 1, "e": "Tận cùng -y đổi thành -ily: happily."}, {"t": "I bought a ___ car.", "o": ["new nice red", "nice new red", "red nice new", "new red nice"], "a": 1, "e": "Thứ tự: ý kiến (nice) – tuổi (new) – màu (red)."}, {"t": "Trạng từ của “simple” là gì?", "o": ["simplely", "simply", "simpley", "simpleness"], "a": 1, "e": "Tận cùng -le thì bỏ e thêm y: simply."}, {"t": "The music sounds ___ .", "o": ["wonderfully", "wonderful", "wonder", "wonders"], "a": 1, "e": "Sound là động từ liên kết nên theo sau là tính từ."}, {"t": "He runs very ___ .", "o": ["fastly", "fast", "fastly", "faster"], "a": 1, "e": "Fast vừa là tính từ vừa là trạng từ, không có dạng fastly."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">The cake</span> <span class=\"seg\" data-l=\"B\">tastes</span> <span class=\"seg\" data-l=\"C\">deliciously</span> <span class=\"seg\" data-l=\"D\">to me</span>.", "o": ["The cake", "tastes", "deliciously", "to me"], "a": 2, "e": "Taste là động từ liên kết nên phải dùng tính từ delicious."}]}, {"id": "u7", "title": "Giới từ chỉ thời gian và nơi chốn", "desc": "Cách chọn in, on, at và các giới từ hay ra thi khác.", "blocks": [{"t": "p", "text": "Giới từ hầu như không dịch sát được sang tiếng Việt, nên cách học hiệu quả nhất là nhớ theo công thức “to – nhỏ dần”."}, {"t": "h", "lv": 2, "text": "in / on / at chỉ thời gian"}, {"t": "tbl", "rows": [["Giới từ", "Dùng cho", "Ví dụ"], ["in", "Tháng, năm, mùa, buổi trong ngày", "in May, in 2024, in summer, in the morning"], ["on", "Ngày, thứ, ngày lễ cụ thể", "on Monday, on July 5th, on Christmas Day"], ["at", "Giờ, thời điểm chính xác", "at 7 o’clock, at noon, at night, at the weekend"]]}, {"t": "h", "lv": 2, "text": "in / on / at chỉ nơi chốn"}, {"t": "tbl", "rows": [["Giới từ", "Dùng cho", "Ví dụ"], ["in", "Không gian có ranh giới, thành phố, nước", "in the room, in Hanoi, in Vietnam"], ["on", "Bề mặt, đường phố, phương tiện công cộng", "on the table, on Le Loi Street, on the bus"], ["at", "Một điểm cụ thể, địa chỉ số nhà", "at the bus stop, at 25 Tran Phu Street, at home"]]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "I was born in 2005, in May, on May 5th, at 6 a.m. (Càng cụ thể thì giới từ càng “nhỏ”.)", "lv": 0}, {"t": "p", "text": "She lives in Hanoi, on Hang Bai Street, at number 30.", "lv": 0}, {"t": "p", "text": "He is waiting at the bus stop. (Anh ấy đang đợi ở bến xe buýt.)", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Giới từ khác hay ra thi"}, {"t": "tbl", "rows": [["Giới từ", "Nghĩa", "Ví dụ"], ["for + khoảng thời gian", "trong bao lâu", "for two years"], ["since + mốc thời gian", "từ khi nào", "since 2020"], ["during + danh từ", "trong suốt", "during the holiday"], ["between A and B", "giữa hai vật", "between the bank and the shop"], ["among", "giữa nhiều vật", "among the students"]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Sau giới từ, động từ luôn ở dạng V-ing: He is good at playing chess.", "lv": 0}, {"t": "p", "text": "Cụm cố định hay thi: in time (kịp giờ) / on time (đúng giờ), at the end of (vào cuối) / in the end (cuối cùng thì).", "lv": 0}]}], "quiz": [{"t": "I usually get up ___ 6 o’clock.", "o": ["in", "on", "at", "for"], "a": 2, "e": "Giờ cụ thể dùng at."}, {"t": "My birthday is ___ July.", "o": ["in", "on", "at", "during"], "a": 0, "e": "Tháng dùng in."}, {"t": "We will meet ___ Monday.", "o": ["in", "on", "at", "for"], "a": 1, "e": "Thứ trong tuần dùng on."}, {"t": "She has lived here ___ 2019.", "o": ["for", "since", "in", "during"], "a": 1, "e": "2019 là mốc thời gian nên dùng since."}, {"t": "He has worked here ___ five years.", "o": ["since", "for", "in", "at"], "a": 1, "e": "Five years là khoảng thời gian nên dùng for."}, {"t": "The book is ___ the table.", "o": ["in", "on", "at", "among"], "a": 1, "e": "Bề mặt dùng on."}, {"t": "He is good at ___ English.", "o": ["speak", "speaks", "speaking", "to speak"], "a": 2, "e": "Sau giới từ at dùng V-ing."}, {"t": "The shop is ___ the bank and the school.", "o": ["among", "between", "in", "during"], "a": 1, "e": "Giữa hai vật dùng between."}, {"t": "They live ___ Vietnam.", "o": ["at", "on", "in", "for"], "a": 2, "e": "Tên nước dùng in."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">was</span> <span class=\"seg\" data-l=\"C\">born</span> <span class=\"seg\" data-l=\"D\">in July 5th</span>.", "o": ["She", "was", "born", "in July 5th"], "a": 3, "e": "Ngày cụ thể phải dùng on: on July 5th."}]}, {"id": "u7b", "title": "Liên từ nối câu", "desc": "FANBOYS, liên từ phụ thuộc và các cặp liên từ tương quan.", "blocks": [{"t": "p", "text": "Liên từ là chất keo nối các phần của câu. Chọn sai liên từ là sai nghĩa, nên đề thi rất hay khai thác."}, {"t": "h", "lv": 2, "text": "Nhóm 1 — Liên từ đẳng lập: FANBOYS"}, {"t": "tbl", "rows": [["Liên từ", "Nghĩa", "Ví dụ"], ["for", "bởi vì", "He stayed home, for he was sick."], ["and", "và", "I like tea and coffee."], ["nor", "cũng không", "She doesn’t smoke, nor does she drink."], ["but", "nhưng", "He is poor but happy."], ["or", "hoặc", "You can call or text me."], ["yet", "tuy nhiên", "It was cold, yet he went out."], ["so", "vì vậy", "It rained, so we stayed in."]]}, {"t": "h", "lv": 2, "text": "Nhóm 2 — Liên từ phụ thuộc"}, {"t": "tbl", "rows": [["Ý nghĩa", "Liên từ", "Ví dụ"], ["Nguyên nhân", "because, since, as", "She left because she was tired."], ["Tương phản", "although, though, even though, while", "Although it rained, we went out."], ["Thời gian", "when, while, before, after, as soon as", "Call me when you arrive."], ["Điều kiện", "if, unless, as long as", "Unless you hurry, you’ll be late."], ["Mục đích", "so that, in order that", "He studies hard so that he can pass."]]}, {"t": "h", "lv": 2, "text": "Nhóm 3 — Cặp liên từ tương quan"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "both A and B → Both Lan and Nam are students.", "lv": 0}, {"t": "p", "text": "either A or B → You can either stay or leave.", "lv": 0}, {"t": "p", "text": "neither A nor B → Neither he nor I am ready.", "lv": 0}, {"t": "p", "text": "not only A but also B → She is not only smart but also kind.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "KHÔNG dùng hai liên từ cùng lúc. Sai: Although it rained, but we went out. Đúng: bỏ một trong hai.", "lv": 0}, {"t": "p", "text": "Because + mệnh đề (có S + V); because of + danh từ. Tương tự: although + mệnh đề; despite / in spite of + danh từ.", "lv": 0}]}], "quiz": [{"t": "He was tired, ___ he kept working.", "o": ["so", "but", "because", "and"], "a": 1, "e": "Hai vế tương phản nên dùng but."}, {"t": "___ it was raining, we went out.", "o": ["Because", "Although", "So", "And"], "a": 1, "e": "Vế sau trái ngược vế trước nên dùng Although."}, {"t": "She was absent ___ her illness.", "o": ["because", "because of", "although", "so"], "a": 1, "e": "Her illness là danh từ nên dùng because of."}, {"t": "___ Lan ___ Nam can speak French.", "o": ["Both / and", "Either / and", "Neither / or", "Not only / and"], "a": 0, "e": "Cặp chuẩn là both… and…"}, {"t": "Neither he ___ I am responsible.", "o": ["or", "nor", "and", "but"], "a": 1, "e": "Đi với neither là nor."}, {"t": "Chọn câu ĐÚNG.", "o": ["Although he was ill, but he came.", "Although he was ill, he came.", "Because he was ill, so he came.", "Despite he was ill, he came."], "a": 1, "e": "Không dùng hai liên từ cùng lúc; despite phải đi với danh từ."}, {"t": "Call me ___ you arrive.", "o": ["so", "but", "as soon as", "although"], "a": 2, "e": "Diễn tả thời gian nên dùng as soon as."}, {"t": "She is not only beautiful ___ also intelligent.", "o": ["and", "but", "or", "nor"], "a": 1, "e": "Cặp chuẩn là not only… but also…"}, {"t": "___ you study hard, you will fail.", "o": ["If", "Unless", "Because", "Although"], "a": 1, "e": "Unless nghĩa là “nếu không”, hợp nghĩa với vế sau."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">In spite of</span> <span class=\"seg\" data-l=\"B\">he was tired</span> <span class=\"seg\" data-l=\"C\">,</span> <span class=\"seg\" data-l=\"D\">he kept working</span>.", "o": ["In spite of", "he was tired", ",", "he kept working"], "a": 1, "e": "In spite of phải đi với danh từ; đứng trước mệnh đề phải dùng Although."}]}, {"id": "u8", "title": "Cấu tạo từ và cách xử lý câu word form", "desc": "Tiền tố, hậu tố thường gặp và quy trình bốn bước giải câu điền dạng từ.", "blocks": [{"t": "p", "text": "Câu word form là dạng ăn điểm chắc nhất nếu bạn thuộc bảng hậu tố. Không cần hiểu hết nghĩa câu vẫn chọn được đáp án đúng."}, {"t": "h", "lv": 2, "text": "Hậu tố — nhìn đuôi biết từ loại"}, {"t": "tbl", "rows": [["Từ loại", "Hậu tố thường gặp", "Ví dụ"], ["Danh từ", "-tion, -sion, -ment, -ness, -ity, -ance, -ence, -er, -or, -ist", "decision, movement, happiness, ability, teacher"], ["Tính từ", "-ful, -less, -able, -ible, -ive, -ous, -al, -y, -ic", "useful, careless, comfortable, active, famous"], ["Động từ", "-ize, -ify, -en, -ate", "modernize, simplify, widen, activate"], ["Trạng từ", "-ly", "quickly, carefully"]]}, {"t": "h", "lv": 2, "text": "Tiền tố — nhìn đầu biết nghĩa"}, {"t": "tbl", "rows": [["Tiền tố", "Nghĩa", "Ví dụ"], ["un-, in-, im-, il-, ir-, dis-", "phủ định", "unhappy, impossible, illegal, irregular, dislike"], ["re-", "lại", "rewrite, rebuild"], ["mis-", "sai", "misunderstand"], ["over- / under-", "quá mức / chưa đủ", "overwork, underestimate"], ["pre- / post-", "trước / sau", "prepare, postwar"]]}, {"t": "h", "lv": 2, "text": "Quy trình 4 bước giải câu word form"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Bước 1: Che hết đáp án, nhìn chỗ trống đứng ở vị trí nào trong câu.", "lv": 0}, {"t": "p", "text": "Bước 2: Dựa vào bảng vị trí ở bài u4, xác định cần DANH TỪ, TÍNH TỪ, ĐỘNG TỪ hay TRẠNG TỪ.", "lv": 0}, {"t": "p", "text": "Bước 3: Chọn đáp án có hậu tố khớp với từ loại đó.", "lv": 0}, {"t": "p", "text": "Bước 4: Kiểm tra nghĩa khẳng định hay phủ định để quyết định có cần tiền tố un-, im-, dis- hay không.", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "His ___ was a surprise. (resign) → sau his cần danh từ → resignation.", "lv": 0}, {"t": "p", "text": "The test was ___ difficult. (extreme) → trước tính từ cần trạng từ → extremely.", "lv": 0}, {"t": "p", "text": "It is ___ to finish in one day. (possible) → nghĩa câu là không thể → impossible.", "lv": 0}, {"t": "p", "text": "They want to ___ the system. (modern) → sau to cần động từ → modernize.", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Hai danh từ cùng gốc nhưng khác nghĩa rất hay ra thi: economy (nền kinh tế) – economics (kinh tế học) – economist (nhà kinh tế).", "lv": 0}, {"t": "p", "text": "Bẫy người và vật: employer (chủ) – employee (nhân viên); interested (cảm thấy thích) – interesting (gây thích thú).", "lv": 0}]}], "quiz": [{"t": "His ___ surprised everyone. (resign)", "o": ["resign", "resigned", "resignation", "resignedly"], "a": 2, "e": "Sau his cần danh từ: resignation."}, {"t": "It is ___ to finish in one day. (possible)", "o": ["possible", "impossible", "possibly", "possibility"], "a": 1, "e": "Nghĩa câu là không thể nên dùng tiền tố phủ định im-."}, {"t": "The government wants to ___ the industry. (modern)", "o": ["modern", "modernly", "modernize", "modernity"], "a": 2, "e": "Sau to cần động từ: modernize."}, {"t": "She answered the question ___ . (correct)", "o": ["correct", "correctly", "correction", "corrective"], "a": 1, "e": "Bổ nghĩa cho động từ answered nên dùng trạng từ."}, {"t": "He is an ___ of the company. (employ)", "o": ["employ", "employer", "employee", "employment"], "a": 2, "e": "Là người làm thuê trong công ty nên dùng employee."}, {"t": "The film was very ___ . (interest)", "o": ["interest", "interested", "interesting", "interestingly"], "a": 2, "e": "Vật gây thích thú nên dùng interesting."}, {"t": "Từ nào là ĐỘNG TỪ?", "o": ["simplify", "simplicity", "simple", "simply"], "a": 0, "e": "Hậu tố -ify tạo động từ."}, {"t": "This machine is very ___ . (use)", "o": ["use", "useful", "usefully", "usefulness"], "a": 1, "e": "Sau be very cần tính từ: useful."}, {"t": "He ___ what I said. (understand)", "o": ["misunderstood", "understanding", "understandable", "understandably"], "a": 0, "e": "Cần động từ chia quá khứ; mis- nghĩa là hiểu sai."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">The</span> <span class=\"seg\" data-l=\"B\">develop</span> <span class=\"seg\" data-l=\"C\">of the city</span> <span class=\"seg\" data-l=\"D\">was fast</span>.", "o": ["The", "develop", "of the city", "was fast"], "a": 1, "e": "Sau mạo từ The cần danh từ: development."}]}, {"id": "u1", "title": "Hiện tại đơn và hiện tại tiếp diễn", "desc": "Thói quen và sự thật so với việc đang xảy ra ngay lúc này.", "blocks": [{"t": "p", "text": "Hai thì này hay bị nhầm nhất. Chỉ cần hỏi một câu: việc đó LẶP LẠI hay đang XẢY RA ngay bây giờ?"}, {"t": "h", "lv" ."}]}, {"id": "u9", "title": "Mệnh đề và bốn kiểu câu", "desc": "Mệnh đề là gì, phân biệt mệnh đề độc lập với phụ thuộc và bốn kiểu câu.", "blocks": [{"t": "p", "text": "Trước hết phải hiểu MỆNH ĐỀ là gì: một nhóm từ có CHỦ NGỮ và ĐỘNG TỪ riêng của nó. Hiểu điều này thì toàn bộ Phần 4 và Phần 5 trở nên dễ."}, {"t": "h", "lv": 2, "text": "Hai loại mệnh đề"}, {"t": "tbl", "rows": [["Loại", "Đặc điểm", "Ví dụ", "Đứng riêng được không?"], ["Độc lập", "Có nghĩa trọn vẹn", "She reads books.", "Được"], ["Phụ thuộc", "Mở đầu bằng because, although, when, who, that...", "because she loves stories", "KHÔNG"]]}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Cách nhận biết: nếu nhóm từ bắt đầu bằng một liên từ phụ thuộc hoặc đại từ quan hệ thì đó là mệnh đề phụ thuộc.", "lv": 0}, {"t": "p", "text": "because she loves stories - đọc xong thấy lửng lơ, phải có vế chính đi kèm.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Bốn kiểu câu"}, {"t": "tbl", "rows": [["Kiểu câu", "Cấu tạo", "Ví dụ"], ["Câu đơn", "1 mệnh đề độc lập", "She reads books."], ["Câu ghép", "2 mệnh đề độc lập trở lên", "She reads books, and he writes poems."], ["Câu phức", "1 độc lập + ít nhất 1 phụ thuộc", "Because it was late, we went home."], ["Câu ghép phức", "2 độc lập trở lên + ít nhất 1 phụ thuộc", "When I arrived, she was cooking and he was reading."]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Mẹo đếm nhanh: đếm số cặp chủ ngữ và động từ trong câu, rồi xem có liên từ phụ thuộc nào không.", "lv": 0}, {"t": "p", "text": "Một nhóm từ không có động từ chia thì không phải mệnh đề, chỉ là cụm từ.", "lv": 0}]}], "quiz": [{"t": "Nhóm từ nào KHÔNG thể đứng riêng thành câu?", "o": ["She reads books.", "because she loves stories", "They played basketball.", "He is rich."], "a": 1, "e": "Because she loves stories là mệnh đề phụ thuộc."}, {"t": "She reads books, and he writes poems. Câu này có mấy mệnh đề độc lập?", "o": ["1", "2", "3", "0"], "a": 1, "e": "Có hai mệnh đề độc lập."}, {"t": "Because it was late, we went home. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 2, "e": "Có một mệnh đề phụ thuộc và một mệnh đề độc lập."}, {"t": "Mệnh đề phụ thuộc thường mở đầu bằng gì?", "o": ["Liên từ phụ thuộc hoặc đại từ quan hệ", "Dấu chấm", "Mạo từ", "Giới từ chỉ nơi chốn"], "a": 0, "e": "Because, although, who, that mở đầu mệnh đề phụ thuộc."}, {"t": "Mệnh đề là gì?", "o": ["Nhóm từ có chủ ngữ và động từ", "Nhóm từ bất kỳ", "Một danh từ", "Một dấu câu"], "a": 0, "e": "Mệnh đề phải có chủ ngữ và động từ riêng."}, {"t": "We stayed home, and it rained all day. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 1, "e": "Hai mệnh đề độc lập nối bằng and."}, {"t": "When I arrived, she was cooking. Đây là kiểu câu nào?", "o": ["Câu đơn", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 2, "e": "Một phụ thuộc và một độc lập."}, {"t": "Câu nào có chứa một mệnh đề phụ thuộc?", "o": ["She reads books.", "They played basketball.", "He left because he was tired.", "Tom and Jerry ran."], "a": 2, "e": "Because he was tired là mệnh đề phụ thuộc."}, {"t": "Câu phức khác câu ghép ở điểm nào?", "o": ["Câu phức có mệnh đề phụ thuộc", "Câu phức có nhiều mệnh đề độc lập", "Câu phức không có động từ", "Câu phức chỉ có một từ"], "a": 0, "e": "Câu phức có ít nhất một mệnh đề phụ thuộc."}, {"t": "Câu nào là câu đơn?", "o": ["The students studied hard.", "The students studied, but they failed.", "They failed because they did not study.", "Although they studied, they failed."], "a": 0, "e": "Chỉ có một mệnh đề độc lập."}]}, {"id": "u10", "title": "Câu đơn: chủ ngữ ghép và vị ngữ ghép", "desc": "Câu vẫn là câu đơn dù có hai chủ ngữ hoặc hai động từ.", "blocks": [{"t": "p", "text": "Nhiều người nhầm câu có hai động từ là câu ghép. Thực ra nếu chỉ có MỘT mệnh đề thì vẫn là câu đơn."}, {"t": "h", "lv": 2, "text": "Hai dạng mở rộng của câu đơn"}, {"t": "tbl", "rows": [["Dạng", "Đặc điểm", "Ví dụ"], ["Chủ ngữ ghép", "Hai chủ ngữ chung một động từ", "John and Mary went to the store."], ["Vị ngữ ghép", "Một chủ ngữ với hai động từ", "She danced and sang."], ["Cả hai", "Hai chủ ngữ với hai động từ", "Tom and Lan sang and danced."]]}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Câu đơn: chỉ có MỘT mệnh đề độc lập, dù chủ ngữ hay động từ có bao nhiêu.", "lv": 0}, {"t": "p", "text": "Câu ghép: có HAI mệnh đề, nghĩa là hai cặp chủ ngữ và động từ riêng biệt.", "lv": 0}, {"t": "p", "text": "So sánh: She sings and dances. (câu đơn) - She sings, and he dances. (câu ghép)", "lv": 0}]}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "The children laughed and played in the garden. (câu đơn, vị ngữ ghép)", "lv": 0}, {"t": "p", "text": "Anna and Ben are cousins. (câu đơn, chủ ngữ ghép)", "lv": 0}, {"t": "p", "text": "Anna sings, and Ben dances. (câu ghép vì có hai chủ ngữ riêng với hai động từ riêng)", "lv": 0}]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "Trước and nối hai ĐỘNG TỪ chung chủ ngữ thì KHÔNG có dấu phẩy: She danced and sang.", "lv": 0}, {"t": "p", "text": "Trước and nối hai MỆNH ĐỀ thì CÓ dấu phẩy: She danced, and he sang.", "lv": 0}]}], "quiz": [{"t": "Câu nào có vị ngữ ghép?", "o": ["She danced and sang.", "John and Mary left.", "They arrived.", "She sings, and he dances."], "a": 0, "e": "Danced và sang chung chủ ngữ she."}, {"t": "Câu nào có chủ ngữ ghép?", "o": ["John and Mary went to the store.", "She danced and sang.", "He ran.", "It rained, so we left."], "a": 0, "e": "John và Mary chung một động từ."}, {"t": "Một câu đơn chứa bao nhiêu mệnh đề độc lập?", "o": ["1", "2", "3", "Không có"], "a": 0, "e": "Câu đơn chỉ có một mệnh đề độc lập."}, {"t": "The children laughed and played in the garden. Câu này có gì đặc biệt?", "o": ["Chủ ngữ ghép", "Vị ngữ ghép", "Hai mệnh đề độc lập", "Mệnh đề phụ thuộc"], "a": 1, "e": "Laughed và played chung chủ ngữ the children."}, {"t": "Anna and Ben are cousins. Câu này là kiểu nào?", "o": ["Câu đơn có chủ ngữ ghép", "Câu ghép", "Câu phức", "Câu ghép phức"], "a": 0, "e": "Chỉ có một mệnh đề với hai chủ ngữ."}, {"t": "Câu nào KHÔNG phải câu đơn?", "o": ["She sings.", "She sings and dances.", "She sings, and he dances.", "Mary and Tom sing."], "a": 2, "e": "Có hai mệnh đề độc lập nên là câu ghép."}, {"t": "Câu đơn cần có tối thiểu những thành phần nào?", "o": ["Chủ ngữ và động từ", "Chỉ tân ngữ", "Hai mệnh đề", "Liên từ phụ thuộc"], "a": 0, "e": "Tối thiểu gồm chủ ngữ và động từ."}, {"t": "Chọn câu ĐÚNG về dấu phẩy.", "o": ["She danced, and sang.", "She danced and sang.", "She, danced and sang.", "She danced and, sang."], "a": 1, "e": "Nối hai động từ chung chủ ngữ thì không cần dấu phẩy."}, {"t": "Lan and Nam study and work in Hanoi. Câu này có gì?", "o": ["Chỉ chủ ngữ ghép", "Chỉ vị ngữ ghép", "Cả chủ ngữ ghép và vị ngữ ghép", "Hai mệnh đề"], "a": 2, "e": "Hai chủ ngữ và hai động từ nhưng vẫn chỉ một mệnh đề."}, {"t": "Tìm phần sai trong câu.", "sentence": "<span class=\"seg\" data-l=\"A\">She</span> <span class=\"seg\" data-l=\"B\">enjoys</span> <span class=\"seg\" data-l=\"C\">reading,</span> <span class=\"seg\" data-l=\"D\">and watching movies</span>.", "o": ["She", "enjoys", "reading,", "and watching movies"], "a": 2, "e": "Chỉ liệt kê hai đối tượng nên không cần dấu phẩy."}]}, {"id": "u11", "title": "Câu ghép: FANBOYS và dấu chấm phẩy", "desc": "Ba cách nối hai mệnh đề độc lập và lỗi comma splice.", "blocks": [{"t": "p", "text": "Hai mệnh đề độc lập không thể chỉ nối bằng dấu phẩy. Phải dùng một trong ba cách dưới đây."}, {"t": "h", "lv": 2, "text": "Ba cách nối"}, {"t": "tbl", "rows": [["Cách", "Công thức", "Ví dụ"], ["Dấu phẩy + FANBOYS", "MĐ1, and/but/so... MĐ2", "I was hungry, so I ate a sandwich."], ["Dấu chấm phẩy", "MĐ1; MĐ2", "She was tired; she went to bed."], ["Dấu chấm phẩy + trạng từ nối", "MĐ1; however, MĐ2", "It was raining; however, we went out."]]}, {"t": "h", "lv": 2, "text": "FANBOYS và nghĩa"}, {"t": "tbl", "rows": [["Liên từ", "Nghĩa", "Ví dụ"], ["For", "bởi vì", "He stayed home, for he was sick."], ["And", "và", "She sings, and he dances."], ["Nor", "cũng không", "He doesn't smoke, nor does he drink."], ["But", "nhưng", "She studied hard, but she failed."], ["Or", "hoặc, nếu không", "Hurry up, or you will miss the bus."], ["Yet", "tuy nhiên, vậy mà", "She was tired, yet she kept working."], ["So", "vì vậy", "It rained, so we stayed in."]]}, {"t": "box", "label": "LƯU Ý", "items": [{"t": "p", "text": "LỖI COMMA SPLICE: nối hai mệnh đề độc lập chỉ bằng dấu phẩy. Sai: She was tired, she went to bed. Sửa: thêm so, hoặc đổi thành dấu chấm phẩy.", "lv": 0}, {"t": "p", "text": "Sau nor phải ĐẢO NGỮ: nor does he drink, không phải nor he drinks.", "lv": 0}]}], "quiz": [{"t": "He doesn't smoke, ___ does he drink.", "o": ["nor", "or", "but", "so"], "a": 0, "e": "Nor nghĩa là cũng không, dùng với phủ định bổ sung."}, {"t": "Hurry up, ___ you will miss the bus.", "o": ["and", "or", "so", "yet"], "a": 1, "e": "Or chỉ hậu quả nếu không làm."}, {"t": "Chọn câu ĐÚNG.", "o": ["She studied hard, she failed the exam.", "She studied hard, yet she failed the exam.", "She studied hard yet, she failed.", "She studied; hard yet she failed."], "a": 1, "e": "Hai mệnh đề nối bằng dấu phẩy và liên từ yet."}, {"t": "He stayed home, ___ he was ill.", "o": ["for", "so", "but", "or"], "a": 0, "e": "For nghĩa là vì, chỉ nguyên nhân."}, {"t": "I was hungry, ___ I ate a sandwich.", "o": ["so", "but", "or", "nor"], "a": 0, "e": "Đói là nguyên nhân, ăn là kết quả."}, {"t": "Hai mệnh đề độc lập nối chỉ bằng dấu phẩy là lỗi gì?", "o": ["Comma splice", "Sentence fragment", "Oxford comma", "Compound subject"], "a": 0, "e": "Đây là lỗi comma splice."}, {"t": "She was tired, ___ she kept working.", "o": ["yet", "so", "for", "nor"], "a": 0, "e": "Mệt nhưng vẫn làm việc là đối lập bất ngờ."}, {"t": "You can take the bus, ___ you can walk.", "o": ["or", "so", "for", "yet"], "a": 0, "e": "Or dùng để nêu lựa chọn."}, {"t": "Chọn cách sửa đúng cho: She was tired, she went to bed early.", "o": ["She was tired, so she went to bed early.", "She was tired she, went to bed early.", "She was, tired she went to bed.", "She was tired; so, she went to bed."], "a": 0, "e": "Cần thêm liên từ so để tránh comma splice."}, {"t": "It was raining; ___ , we went out.", "o": ["however", "and", "but", "so"], "a": 0, "e": "Sau dấu chấm phẩy dùng trạng từ nối however rồi dấu phẩy."}]}, {"id": "u12", "title": "Câu phức và câu ghép phức", "desc": "Cách ghép mệnh đề phụ thuộc với mệnh đề chính và quy tắc dấu phẩy.", "blocks": [{"t": "p", "text": "Câu phức luôn gồm một mệnh đề chính đứng được một mình, cộng thêm một mệnh đề phụ thuộc bổ sung ý."}, {"t": "h", "lv": 2, "text": "Quy tắc dấu phẩy — rất hay ra thi"}, {"t": "box", "label": "CẤU TRÚC", "items": [{"t": "p", "text": "Mệnh đề phụ thuộc ĐỨNG TRƯỚC thì CÓ dấu phẩy: Because it was late, we went home.", "lv": 0}, {"t": "p", "text": "Mệnh đề phụ thuộc ĐỨNG SAU thì KHÔNG có dấu phẩy: We went home because it was late.", "lv": 0}]}, {"t": "h", "lv": 2, "text": "Liên từ phụ thuộc theo nhóm nghĩa"}, {"t": "tbl", "rows": [["Nhóm", "Liên từ", "Ví dụ"], ["Nguyên nhân", "because, since, as", "She left because she was tired."], ["Tương phản", "although, though, even though, while", "Although it rained, we went out."], ["Thời gian", "when, while, before, after, as soon as, until", "I will wait until you come back."], ["Điều kiện", "if, unless, as long as", "Unless you hurry, you will be late."], ["Mục đích", "so that, in order that", "He studies hard so that he can pass."], ["Kết quả", "so + tính từ + that", "He was so tired that he fell asleep."]]}, {"t": "h", "lv": 2, "text": "Câu ghép phức"}, {"t": "p", "text": "Có từ hai mệnh đề độc lập trở lên cộng với ít nhất một mệnh đề phụ thuộc."}, {"t": "box", "label": "VÍ DỤ", "items": [{"t": "p", "text": "When I arrived, she was cooking and he was reading. (Khi tôi đến, cô ấy đang nấu ăn còn anh ấy đang đọc sách.)", "lv": 0},
